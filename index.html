<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATAG • Coletor Industrial Dourados</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Montserrat:wght@700;800&display=swap');

    :root {
      --atag-bg-dark: #0f131a;
      --atag-card: #181f2c;
      --atag-card-inner: #222b3d;
      --atag-border: rgba(255, 255, 255, 0.08);
      --atag-border-focus: #e53e3e;
      
      --atag-red: #e53e3e;
      --atag-red-dark: #c53030;
      --atag-red-glow: rgba(229, 62, 62, 0.35);
      --atag-red-subtle: rgba(229, 62, 62, 0.15);

      --text-main: #f1f5f9;
      --text-muted: #cbd5e0;
      --text-dim: #64748b;
      
      --success: #38d39f;
      --success-bg: rgba(56, 211, 159, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--atag-bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sys-header {
      background: var(--atag-card);
      border: 1px solid var(--atag-border);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .sys-brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      background: linear-gradient(135deg, var(--atag-red), var(--atag-red-dark));
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .sys-title { display: flex; flex-direction: column; }
    .sys-title-main { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .sys-title-sub { font-size: 9px; color: var(--text-dim); }

    .sys-status {
      display: flex; align-items: center; gap: 6px; font-size: 10px;
      color: var(--success); font-weight: 700; background: var(--success-bg);
      padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(56, 211, 159, 0.3);
    }
    .sys-status-dot { width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; }

    .view-section { display: none; flex-direction: column; gap: 10px; }
    .view-section.active { display: flex; }

    .main-form-card {
      background: var(--atag-card);
      border: 1px solid var(--atag-border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-grid-compact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field.full { grid-column: span 2; }

    label {
      font-size: 9px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%; padding: 10px; font-size: 14px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace; border: 1px solid var(--atag-border);
      border-radius: 8px; background: var(--atag-card-inner); color: var(--text-main);
      text-align: center; outline: none; text-transform: uppercase;
    }
    input[type="text"]#input-codigo { font-size: 15px; letter-spacing: 0.8px; }
    input[type="text"]:focus { border-color: var(--atag-border-focus); box-shadow: 0 0 10px var(--atag-red-glow); background: rgba(229, 62, 62, 0.05); }

    .barcode-input-wrapper { position: relative; display: flex; align-items: center; }
    .barcode-input-wrapper input { padding-right: 44px; }

    .btn-scanner-toggle {
      position: absolute; right: 4px; background: var(--atag-red-subtle);
      border: 1px solid rgba(229, 62, 62, 0.4); border-radius: 6px; cursor: pointer;
      padding: 6px; display: flex; align-items: center; justify-content: center; color: var(--atag-red);
    }
    .btn-scanner-toggle svg { width: 18px; height: 18px; fill: currentColor; }

    .loc-photo-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 6px; }

    .btn-anexar {
      width: 100%; height: 40px; background: var(--atag-card-inner);
      border: 1px dashed var(--atag-border); color: var(--text-muted);
      border-radius: 8px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-anexar.tem-foto { border-color: var(--success); color: var(--success); background: var(--success-bg); border-style: solid; }

    .loc-alert-box {
      display: none; background: var(--warning-bg); border: 1px solid var(--warning);
      color: var(--warning); padding: 8px 10px; border-radius: 8px; font-size: 10px;
      font-weight: 700; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; align-items: center; gap: 8px;
    }
    .loc-alert-box.active { display: flex; }

    .preview-mini {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--atag-card-inner); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--atag-border);
    }
    .preview-mini img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
    .preview-mini span { font-size: 10px; color: var(--success); font-weight: 700; }
    .btn-remover-foto { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 4px 8px; font-size: 8px; font-weight: 700; border-radius: 6px; cursor: pointer; }

    .sys-status-bar {
      font-size: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 600;
      padding: 9px 12px; border-radius: 8px; background: var(--atag-card-inner); border: 1px solid var(--atag-border);
    }
    .sys-status-bar.pronto { color: var(--text-muted); }
    .sys-status-bar.enviando { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
    .sys-status-bar.sucesso { color: var(--success); background: var(--success-bg); }

    /* LEITOR / CÂMERA OVERLAY MELHORADO */
    .scanner-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 19, 26, 0.96); z-index: 2000; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px;
    }
    .scanner-overlay.active { display: flex; }

    .scanner-top-bar {
      width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
      background: var(--atag-card); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--atag-border);
    }
    .scanner-title { font-size: 11px; font-weight: 700; color: var(--atag-red); text-transform: uppercase; }
    .btn-close-scanner { background: var(--danger-bg); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }

    .scanner-viewport {
      width: 100%; max-width: 400px; flex: 1; margin: 10px 0; background: #000;
      border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--atag-border);
      display: flex; align-items: center; justify-content: center;
    }
    #interactive.viewport { width: 100%; height: 100%; position: relative; }
    #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    
    .laser-guide {
      position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
      background: var(--atag-red); box-shadow: 0 0 12px var(--atag-red); z-index: 10;
      animation: pulseLaser 1.5s infinite alternate;
    }
    @keyframes pulseLaser { 0% { opacity: 0.4; } 100% { opacity: 1; } }

    .scanner-controls-bar {
      width: 100%; max-width: 400px; background: var(--atag-card);
      padding: 12px; border-radius: 10px; border: 1px solid var(--atag-border);
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
    }
    .scanner-controls-bar select {
      flex: 1; padding: 8px; font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
      background: var(--atag-card-inner); color: var(--text-main); border: 1px solid var(--atag-border); border-radius: 6px; outline: none;
    }
    .btn-torch {
      background: var(--atag-card-inner); border: 1px solid var(--atag-border); color: var(--warning);
      padding: 8px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    /* LISTA DE LOCADOS */
    .allocated-card { background: var(--atag-card); border: 1px solid var(--atag-border); border-radius: 12px; padding: 12px; }
    .filter-sticky-bar { position: sticky; top: 0; z-index: 10; background: var(--atag-card); padding-bottom: 10px; border-bottom: 1px solid var(--atag-border); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
    .filter-sticky-bar select { flex: 1; padding: 9px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; background: var(--atag-card-inner); color: var(--atag-red); border: 1px solid var(--atag-border); border-radius: 8px; outline: none; }
    .allocated-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; padding: 0 2px 8px 2px; }
    .allocated-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; }
    .allocated-item-compact { background: var(--atag-card-inner); border: 1px solid var(--atag-border); border-left: 3px solid var(--atag-red); padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .item-info-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .loc-tag-compact { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--atag-red); background: var(--atag-red-subtle); padding: 2px 8px; border-radius: 6px; width: fit-content; }
    .sku-compact { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .obs-compact { font-size: 10px; color: var(--text-muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-thumb-center { width: 42px; height: 42px; flex-shrink: 0; border-radius: 6px; border: 1px solid var(--atag-border); background: #000; object-fit: cover; cursor: pointer; }
    .item-actions-compact { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon-act { background: var(--atag-card); border: 1px solid var(--atag-border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-icon-act.edit { color: var(--atag-red); }
    .btn-icon-act.delete { color: var(--danger); background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.3); }
    .btn-icon-act svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
    .empty-msg { text-align: center; color: var(--text-dim); padding: 25px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

    /* BARRA INFERIOR */
    .bottom-nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 19, 26, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--atag-border); padding: 10px 14px; z-index: 1000; display: flex; justify-content: center; }
    .bottom-nav-inner { width: 100%; max-width: 440px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: center; }
    .nav-btn, .btn-salvar-main { background: var(--atag-card-inner); border: 1px solid var(--atag-border); color: var(--text-muted); height: 48px; border-radius: 8px; font-size: 10px; font-weight: 700; font-family: 'Montserrat', sans-serif; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .nav-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
    .nav-btn.active { background: var(--atag-red-subtle); color: var(--atag-red); border-color: rgba(229, 62, 62, 0.4); }
    .btn-salvar-main { background: linear-gradient(135deg, var(--atag-red), var(--atag-red-dark)); color: #ffffff; border: 1px solid rgba(229, 62, 62, 0.5); font-size: 11px; font-weight: 800; box-shadow: 0 4px 14px var(--atag-red-glow); flex-direction: row; gap: 6px; }
    .badge-pill { background: var(--atag-red); color: #ffffff; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }

    /* MODAIS */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); align-items: center; justify-content: center; z-index: 2500; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--atag-card); border: 1px solid var(--atag-border); border-radius: 12px; padding: 16px; width: 100%; max-width: 380px; }
    .modal-title { font-size: 11px; font-weight: 700; color: var(--atag-red); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--atag-border); }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .btn-modal { padding: 10px; border-radius: 8px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; }
    .btn-modal.save { background: var(--atag-red); color: #ffffff; }
    .btn-modal.cancel { background: var(--atag-card-inner); color: var(--text-main); border: 1px solid var(--atag-border); }

    .modal-foto-zoom { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 19, 26, 0.95); align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
    .modal-foto-zoom.active { display: flex; }
    .modal-foto-content { background: var(--atag-card); border: 1px solid var(--atag-border); border-radius: 12px; padding: 14px; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .modal-foto-content img { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="sys-header">
      <div class="sys-brand">
        <span class="brand-badge">ATAG</span>
        <div class="sys-title">
          <span class="sys-title-main">Coletor Industrial</span>
          <span class="sys-title-sub">Dourados - MS</span>
        </div>
      </div>
      <div class="sys-status">
        <span class="sys-status-dot"></span>
        <span>ONLINE</span>
      </div>
    </div>

    <!-- TELA 1: COLETOR -->
    <div id="view-coletor" class="view-section active">
      <div class="main-form-card">

        <div class="form-field full">
          <label>Código de Barras / SKU</label>
          <div class="barcode-input-wrapper">
            <input type="text" id="input-codigo" placeholder="EX: 7891234567890" autofocus oninput="verificarValidacoesCampos()" onkeyup="validarERepassarCodigo(event)">
            <button type="button" class="btn-scanner-toggle" onclick="abrirCamera()" title="Escanear com a câmera">
              <svg viewBox="0 0 24 24">
                <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4v-4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="box-alerta-sku" class="loc-alert-box">
          <span>⚠️</span>
          <span id="texto-alerta-sku">SKU já possui locação cadastrada!</span>
        </div>

        <div id="box-alerta-posicao" class="loc-alert-box">
          <span>⚠️</span>
          <span id="texto-alerta-posicao">Esta posição já possui um item cadastrado!</span>
        </div>

        <div class="loc-photo-grid">
          <div class="form-field">
            <label>Rua</label>
            <input type="text" id="input-local" placeholder="R01" maxlength="3" oninput="validarERepassarLocalizacao(this)">
          </div>

          <div class="form-field">
            <label>Posição</label>
            <input type="text" id="input-posicao" placeholder="001" maxlength="4" oninput="validarERepassarPosicao(this)" onblur="formatarPosicaoBlur(this)">
          </div>

          <div class="form-field">
            <label>Foto</label>
            <input type="file" id="input-arquivo-foto" accept="image/*" capture="environment" style="display:none;" onchange="processarFotoAnexada(this)">
            <button type="button" id="btn-anexar-trigger" class="btn-anexar" onclick="document.getElementById('input-arquivo-foto').click()">
              📸 Anexar
            </button>
          </div>
        </div>

        <div id="preview-foto-container" style="display:none;">
          <div class="preview-mini">
            <div style="display:flex; align-items:center; gap:8px;">
              <img id="img-preview-mini" src="" alt="Preview">
              <span>Foto Anexada</span>
            </div>
            <button type="button" class="btn-remover-foto" onclick="removerFoto()">Remover</button>
          </div>
        </div>

        <div class="form-field full">
          <label>Observação Adicional</label>
          <input type="text" id="input-obs" placeholder="OPCIONAL (AVARIA, DIVERGÊNCIA, ETC.)" style="font-size: 11px;">
        </div>

      </div>

      <div id="status-msg" class="sys-status-bar pronto">
        <span>></span> PREENCHA OS DADOS E CONFIRME
      </div>
    </div>

    <!-- TELA 2: ESTOQUE -->
    <div id="view-locados" class="view-section">
      <div class="allocated-card">
        <div class="filter-sticky-bar">
          <label style="font-size:10px; font-weight:700; color:var(--atag-red);">RUA:</label>
          <select id="select-filtro-rua" onchange="renderizarListaLocados()">
            <option value="TODAS">TODAS AS RUAS</option>
          </select>
        </div>
        <div class="allocated-header">
          <span>Organizado por Posição</span>
          <span id="count-historico" style="color:var(--atag-red);">0 ITENS</span>
        </div>
        <ul id="historico" class="allocated-list">
          <div class="empty-msg">Carregando itens...</div>
        </ul>
      </div>
    </div>

  </div>

  <!-- LEITOR DE CÂMERA OTIMIZADO -->
  <div id="scanner-modal" class="scanner-overlay">
    <div class="scanner-top-bar">
      <span class="scanner-title">Leitor Industrial</span>
      <button class="btn-close-scanner" onclick="fecharCamera()">FECHAR</button>
    </div>

    <div class="scanner-viewport">
      <div id="interactive" class="viewport"></div>
      <div class="laser-guide"></div>
    </div>

    <div class="scanner-controls-bar">
      <select id="camera-select" onchange="mudarCameraSelecionada()">
        <option value="">A carregar câmaras...</option>
      </select>
      <button type="button" class="btn-torch" onclick="alternarLanterna()">🔦 Luz</button>
    </div>
  </div>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
  <div class="bottom-nav-bar">
    <div class="bottom-nav-inner">
      <button id="btn-tab-coletor" class="nav-btn active" onclick="mudarAba('coletor')">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 9h10M7 12h10M7 15h10"/></svg>
        Coletar
      </button>

      <button type="button" class="btn-salvar-main" onclick="clicarSalvarRegistro()">
        💾 Salvar
      </button>

      <button id="btn-tab-locados" class="nav-btn" onclick="mudarAba('locados')">
        <svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
        Estoque <span id="badge-total" class="badge-pill">0</span>
      </button>
    </div>
  </div>

  <!-- MODAL EDITAR -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Editar Registro</div>
      <input type="hidden" id="edit-id">
      <div class="form-grid-compact">
        <div class="form-field full"><label>Código de Barras</label><input type="text" id="edit-codigo"></div>
        <div class="form-field"><label>Rua</label><input type="text" id="edit-local" maxlength="3"></div>
        <div class="form-field"><label>Posição</label><input type="text" id="edit-posicao" maxlength="4"></div>
        <div class="form-field full"><label>Observação</label><input type="text" id="edit-obs"></div>
      </div>
      <div class="modal-btns">
        <button class="btn-modal cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn-modal save" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ZOOM FOTO -->
  <div id="modal-zoom" class="modal-foto-zoom" onclick="fecharZoom()">
    <div class="modal-foto-content" onclick="event.stopPropagation()">
      <img id="img-zoom-src" src="" alt="Foto SKU">
      <button class="btn-modal cancel" onclick="fecharZoom()">Fechar</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

    let html5QrCode = null;
    let cameraAtualId = null;
    let listaCameras = [];
    let lanternaLigada = false;
    let fotoBase64Atual = "";
    let ultimoDadoLido = "";
    let ultimoTimestamp = 0;
    const BLOQUEIO_MS = 2000;
    let listaItensCache = [];

    function mudarAba(aba) {
      document.getElementById('view-coletor').classList.remove('active');
      document.getElementById('view-locados').classList.remove('active');
      document.getElementById('btn-tab-coletor').classList.remove('active');
      document.getElementById('btn-tab-locados').classList.remove('active');

      if (aba === 'coletor') {
        document.getElementById('view-coletor').classList.add('active');
        document.getElementById('btn-tab-coletor').classList.add('active');
      } else {
        document.getElementById('view-locados').classList.add('active');
        document.getElementById('btn-tab-locados').classList.add('active');
        carregarLocacoesDaPlanilha();
      }
    }

    function tocarBip() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 2400;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
        if (navigator.vibrate) navigator.vibrate(80);
      } catch (e) {}
    }

    /* SISTEMA DE CÂMERA ROBUSTO COM SELETOR E FOCO CONTÍNUO */
    async function abrirCamera() {
      document.getElementById('scanner-modal').classList.add('active');
      
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("interactive");
      }

      try {
        listaCameras = await Html5Qrcode.getCameras();
        const select = document.getElementById('camera-select');
        select.innerHTML = "";

        if (listaCameras && listaCameras.length > 0) {
          listaCameras.forEach((cam, index) => {
            const opt = document.createElement('option');
            opt.value = cam.id;
            // Tenta priorizar a câmara traseira automaticamente
            let nomeCam = cam.label || `Câmara ${index + 1}`;
            opt.innerText = nomeCam;
            if (nomeCam.toLowerCase().includes('back') || nomeCam.toLowerCase().includes('traseira') || nomeCam.toLowerCase().includes('environment')) {
              opt.selected = true;
            }
            select.appendChild(opt);
          });

          cameraAtualId = select.value || listaCameras[0].id;
          iniciarFluxoCamera(cameraAtualId);
        } else {
          alert("Nenhuma câmara detetada no dispositivo.");
        }
      } catch (err) {
        alert("Erro ao aceder à câmara: " + err);
      }
    }

    async function iniciarFluxoCamera(cameraId) {
      try {
        if (html5QrCode && html5QrCode.isScanning) {
          await html5QrCode.stop();
        }

        const configConfig = {
          fps: 25,
          qrbox: { width: 300, height: 140 },
          aspectRatio: 1.777778,
          videoConstraints: {
            deviceId: { exact: cameraId },
            focusMode: "continuous",
            advanced: [{ focusMode: "continuous" }]
          }
        };

        await html5QrCode.start(
          cameraId,
          configConfig,
          (decodedText) => {
            processarDadoLido(decodedText);
          },
          (errorMessage) => {
            // Ignora erros de frame individual para não poluir a consola
          }
        );
      } catch (e) {
        // Fallback sem restrições avançadas caso o telemóvel rejeite o continuous focus
        try {
          await html5QrCode.start(
            cameraId,
            { fps: 20, qrbox: { width: 280, height: 130 } },
            (decodedText) => { processarDadoLido(decodedText); }
          );
        } catch (err2) {
          alert("Não foi possível iniciar o vídeo da câmara. Verifique as permissões.");
        }
      }
    }

    async function mudarCameraSelecionada() {
      const select = document.getElementById('camera-select');
      cameraAtualId = select.value;
      lanternaLigada = false;
      await iniciarFluxoCamera(cameraAtualId);
    }

    async function alternarLanterna() {
      if (!html5QrCode || !html5QrCode.isScanning) return;
      try {
        lanternaLigada = !lanternaLigada;
        await html5QrCode.applyVideoConstraints({
          advanced: [{ torch: lanternaLigada }]
        });
      } catch (e) {
        alert("Este dispositivo/câmara não suporta controlo de lanterna.");
      }
    }

    async function fecharCamera() {
      document.getElementById('scanner-modal').classList.remove('active');
      if (html5QrCode && html5QrCode.isScanning) {
        try {
          await html5QrCode.stop();
        } catch(e){}
      }
    }

    function processarDadoLido(dadoBruto) {
      const texto = dadoBruto.trim().replace(/\n/g, "").toUpperCase();
      if (!texto || texto.length < 2) return;

      const agora = Date.now();
      if (texto === ultimoDadoLido && (agora - ultimoTimestamp) < BLOQUEIO_MS) return;

      ultimoDadoLido = texto;
      ultimoTimestamp = agora;
      tocarBip();

      document.getElementById('input-codigo').value = texto;
      verificarValidacoesCampos();
      fecharCamera();
      document.getElementById('input-local').focus();
    }

    function verificarValidacoesCampos() {
      try {
        const codInput = (document.getElementById('input-codigo').value || "").toString().trim().toUpperCase();
        const ruaInput = (document.getElementById('input-local').value || "").toString().trim().toUpperCase();
        let posInput = (document.getElementById('input-posicao').value || "").toString().trim();

        const boxSku = document.getElementById('box-alerta-sku');
        const textSku = document.getElementById('texto-alerta-sku');
        const boxPos = document.getElementById('box-alerta-posicao');
        const textPos = document.getElementById('texto-alerta-posicao');

        if (!listaItensCache || listaItensCache.length === 0) return;

        if (codInput) {
          const itemSku = listaItensCache.find(i => {
            let c = (i.codigo || i["Cod.Mestre"] || i["Código de Barras"] || i.Codigo || "").toString().trim().toUpperCase();
            return c === codInput;
          });

          if (itemSku) {
            let rua = (itemSku.localizacao || itemSku.Localização || itemSku["Localização"] || "").toString().toUpperCase();
            let pos = (itemSku.posicao || itemSku.Posição || itemSku["Posição"] || "").toString();
            if (pos && pos.length < 3) pos = pos.padStart(3, '0');
            let locFmt = (itemSku.locacao || itemSku.LOCACAO || itemSku.Locação || itemSku["Locação"] || (rua + pos)).toString().toUpperCase();
            let desc = itemSku["Descrição"] || itemSku.Descrição || itemSku.Marca || "";
            textSku.innerText = `⚠️ SKU JÁ LOCADO EM: ${locFmt}${desc ? ' (' + desc + ')' : ''}`;
            boxSku.classList.add('active');
          } else {
            boxSku.classList.remove('active');
          }
        } else {
          boxSku.classList.remove('active');
        }

        if (ruaInput && posInput) {
          let posPadded = posInput;
          if (posPadded.length < 3) posPadded = posPadded.padStart(3, '0');
          const locAlvo = ruaInput + posPadded;

          const itemLocal = listaItensCache.find(i => {
            let r = (i.localizacao || i.Localização || i["Localização"] || "").toString().trim().toUpperCase();
            let p = (i.posicao || i.Posição || i["Posição"] || "").toString().trim();
            if (p && p.length < 3) p = p.padStart(3, '0');
            let locExistente = (i.locacao || i.LOCACAO || i.Locação || (r + p)).toString().trim().toUpperCase();
            return locExistente === locAlvo;
          });

          if (itemLocal) {
            let skuExistente = (itemLocal.codigo || itemLocal["Cod.Mestre"] || itemLocal["Código de Barras"] || itemLocal.Codigo || "").toString().toUpperCase();
            textPos.innerText = `⚠️ LOCAÇÃO ${locAlvo} OCUPADA PELO SKU: ${skuExistente}`;
            boxPos.classList.add('active');
          } else {
            boxPos.classList.remove('active');
          }
        } else {
          boxPos.classList.remove('active');
        }
      } catch (e) {}
    }

    function validarERepassarCodigo(event) {
      verificarValidacoesCampos();
      if (event.key === "Enter" && event.target.value.trim().length > 0) {
        document.getElementById('input-local').focus();
      }
    }

    function validarERepassarLocalizacao(input) {
      let val = input.value.toUpperCase().replace(/[^R0-9]/g, '');
      if (val.length > 0 && val[0] !== 'R') val = 'R' + val.replace(/R/g, '');
      if (val.length > 3) val = val.substring(0, 3);
      input.value = val;
      verificarValidacoesCampos();
      if (val.length === 3) document.getElementById('input-posicao').focus();
    }

    function validarERepassarPosicao(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      let num = parseInt(val, 10);
      if (!isNaN(num) && num > 2000) val = "2000";
      if (val.length > 4) val = val.substring(0, 4);
      input.value = val;
      verificarValidacoesCampos();
      if (val.length >= 3) document.getElementById('btn-anexar-trigger').focus();
    }

    function formatarPosicaoBlur(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (!val) return;
      let num = parseInt(val, 10);
      if (num > 2000) num = 2000;
      input.value = String(num).padStart(3, '0');
      verificarValidacoesCampos();
    }

    function processarFotoAnexada(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_W = 800, MAX_H = 800;
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } }
            else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            fotoBase64Atual = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('img-preview-mini').src = fotoBase64Atual;
            document.getElementById('preview-foto-container').style.display = "block";
            const btnFoto = document.getElementById('btn-anexar-trigger');
            btnFoto.classList.add('tem-foto');
            btnFoto.innerHTML = "✅ Anexada";
            document.getElementById('input-obs').focus();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removerFoto() {
      fotoBase64Atual = "";
      document.getElementById('input-arquivo-foto').value = "";
      document.getElementById('preview-foto-container').style.display = "none";
      const btnFoto = document.getElementById('btn-anexar-trigger');
      btnFoto.classList.remove('tem-foto');
      btnFoto.innerHTML = "📸 Anexar";
    }

    function abrirZoom(url) {
      document.getElementById('img-zoom-src').src = url;
      document.getElementById('modal-zoom').classList.add('active');
    }
    function fecharZoom() { document.getElementById('modal-zoom').classList.remove('active'); }

    function clicarSalvarRegistro() {
      const codigo = document.getElementById('input-codigo').value.trim().toUpperCase();
      let local = document.getElementById('input-local').value.trim().toUpperCase();
      let posicao = document.getElementById('input-posicao').value.trim();
      const obs = document.getElementById('input-obs').value.trim().toUpperCase();

      if (!codigo) { alert("Informe o Código de Barras!"); document.getElementById('input-codigo').focus(); return; }
      if (!local) { alert("Informe a Rua!"); document.getElementById('input-local').focus(); return; }
      if (!posicao) { alert("Informe a Posição!"); document.getElementById('input-posicao').focus(); return; }

      let numPos = parseInt(posicao, 10);
      posicao = String(numPos).padStart(3, '0');

      enviarParaSheets({
        codigo: codigo, localizacao: local, posicao: posicao,
        locacao: local + posicao, foto: fotoBase64Atual, obs: obs
      });
    }

    function carregarLocacoesDaPlanilha() {
      const historico = document.getElementById('historico');
      if (historico) historico.innerHTML = '<div class="empty-msg">A sincronizar...</div>';

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(dados => {
          listaItensCache = dados || [];
          atualizarOpcoesFiltroRuas();
          renderizarListaLocados();
          verificarValidacoesCampos();
        })
        .catch(() => {
          if (historico) historico.innerHTML = '<div class="empty-msg">Erro ao sincronizar dados.</div>';
        });
    }

    function atualizarOpcoesFiltroRuas() {
      const select = document.getElementById('select-filtro-rua');
      if (!select) return;
      const ruaAtual = select.value;
      const ruasUnicas = [...new Set(listaItensCache.map(i => (i.localizacao || i.Localização || "").toString().toUpperCase()).filter(Boolean))].sort();
      
      let html = '<option value="TODAS">TODAS AS RUAS</option>';
      ruasUnicas.forEach(r => { html += `<option value="${r}">${r}</option>`; });
      select.innerHTML = html;
      if (ruasUnicas.includes(ruaAtual)) select.value = ruaAtual;
    }

    function renderizarListaLocados() {
      const ruaSelect = document.getElementById('select-filtro-rua');
      const ruaSel = ruaSelect ? ruaSelect.value : 'TODAS';
      const historico = document.getElementById('historico');
      if (!historico) return;
      historico.innerHTML = "";

      let filtrados = listaItensCache.filter(i => {
        let r = (i.localizacao || i.Localização || "").toString().toUpperCase();
        if (ruaSel === 'TODAS') return true;
        return r === ruaSel;
      });

      document.getElementById('count-historico').innerText = filtrados.length + " ITENS";
      document.getElementById('badge-total').innerText = listaItensCache.length;

      if (filtrados.length === 0) {
        historico.innerHTML = '<div class="empty-msg">Nenhum item encontrado.</div>';
        return;
      }

      filtrados.forEach(item => {
        const li = document.createElement('li');
        li.className = "allocated-item-compact";
        let foto = item.foto || item["Foto do produto"] || '';
        let cod = (item.codigo || item["Código de Barras"] || item["Cod.Mestre"] || "").toUpperCase();
        let obs = (item.obs || item["OBS ADICIONAL"] || "").toUpperCase();
        let loc = (item.locacao || item.LOCACAO || "").toUpperCase();

        li.innerHTML = `
          <div class="item-info-left">
            <div class="loc-tag-compact">📍 ${loc}</div>
            <div class="sku-compact">SKU: ${cod}</div>
            ${obs ? `<div class="obs-compact">${obs}</div>` : ''}
          </div>
          ${foto ? `<img src="${foto}" class="item-thumb-center" onclick="abrirZoom('${foto}')">` : '<span style="font-size:9px; color:var(--text-dim);">Sem foto</span>'}
          <div class="item-actions-compact">
            <button class="btn-icon-act edit" onclick="abrirEdicao('${item.id || item.ID}')"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
            <button class="btn-icon-act delete" onclick="excluirItem('${item.id || item.ID}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
        `;
        historico.appendChild(li);
      });
    }

    function abrirEdicao(id) {
      const item = listaItensCache.find(i => (i.id || i.ID) == id);
      if (!item) return;
      document.getElementById('edit-id').value = (item.id || item.ID);
      document.getElementById('edit-local').value = (item.localizacao || item.Localização || "").toUpperCase();
      document.getElementById('edit-posicao').value = (item.posicao || item.Posição || "");
      document.getElementById('edit-codigo').value = (item.codigo || item["Código de Barras"] || "").toUpperCase();
      document.getElementById('edit-obs').value = (item.obs || item["OBS ADICIONAL"] || "").toUpperCase();
      document.getElementById('modal-edit').classList.add('active');
    }
    function fecharModal() { document.getElementById('modal-edit').classList.remove('active'); }

    function salvarEdicao() {
      const id = document.getElementById('edit-id').value;
      const local = document.getElementById('edit-local').value.trim().toUpperCase();
      let pos = document.getElementById('edit-posicao').value.trim();
      const cod = document.getElementById('edit-codigo').value.trim().toUpperCase();
      const obs = document.getElementById('edit-obs').value.trim().toUpperCase();

      if (!local || !pos || !cod) { alert("Preencha todos os campos obrigatórios!"); return; }
      pos = String(parseInt(pos, 10)).padStart(3, '0');

      fecharModal();
      fetch(WEB_APP_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "update", id, localizacao: local, posicao: pos, locacao: local + pos, codigo: cod, obs })
      });
      setTimeout(carregarLocacoesDaPlanilha, 1200);
    }

    function excluirItem(id) {
      if (!confirm("Deseja excluir este registo?")) return;
      fetch(WEB_APP_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", id })
      });
      setTimeout(carregarLocacoesDaPlanilha, 1200);
    }

    function enviarParaSheets(dados) {
      const statusElement = document.getElementById('status-msg');
      statusElement.className = "sys-status-bar enviando";
      statusElement.innerHTML = "<span>></span> A ENVIAR REGISTRO...";

      fetch(WEB_APP_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });

      document.getElementById('input-codigo').value = "";
      document.getElementById('input-local').value = "";
      document.getElementById('input-posicao').value = "";
      document.getElementById('input-obs').value = "";
      document.getElementById('box-alerta-sku').classList.remove('active');
      document.getElementById('box-alerta-posicao').classList.remove('active');
      removerFoto();

      statusElement.className = "sys-status-bar sucesso";
      statusElement.innerHTML = "<span>></span> REGISTRO SALVO COM SUCESSO!";

      setTimeout(() => {
        carregarLocacoesDaPlanilha();
        statusElement.className = "sys-status-bar pronto";
        statusElement.innerHTML = "<span>></span> PRONTO PARA NOVO LANÇAMENTO";
        document.getElementById('input-codigo').focus();
      }, 1200);
    }

    window.addEventListener('load', () => { carregarLocacoesDaPlanilha(); });
  </script>

</body>
</html>

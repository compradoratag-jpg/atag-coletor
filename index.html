<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATAG • Coletor Industrial Dourados</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Montserrat:wght@700;800;900&display=swap');

    :root {
      --atag-bg-dark: #080a0f;
      --atag-card: #111622;
      --atag-card-inner: #182030;
      --atag-border: rgba(255, 255, 255, 0.08);
      --atag-border-focus: #e52323;
      
      --atag-red: #e52323;
      --atag-red-hover: #ff2a2a;
      --atag-red-glow: rgba(229, 35, 35, 0.35);
      --atag-red-subtle: rgba(229, 35, 35, 0.12);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--atag-bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 70px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* HEADER */
    .sys-header {
      background: linear-gradient(145deg, var(--atag-card), #0c0f18);
      border: 1px solid var(--atag-border);
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .sys-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--atag-red);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px var(--atag-red-glow);
    }

    .sys-title {
      display: flex;
      flex-direction: column;
    }

    .sys-title-main {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .sys-title-sub {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .sys-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--success);
      font-weight: 800;
      background: var(--success-bg);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .sys-status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* VONTROLE DE NAVEGAÇÃO */
    .view-section {
      display: none;
    }
    .view-section.active {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* FORM CARD COMPACTO */
    .form-card {
      background: linear-gradient(145deg, var(--atag-card), #0d121c);
      border: 1px solid var(--atag-border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-field.full {
      grid-column: span 2;
    }

    label {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--atag-border);
      border-radius: 8px;
      background: var(--atag-card-inner);
      color: var(--text-main);
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
      user-select: text;
    }

    input[type="text"]:focus {
      border-color: var(--atag-border-focus);
      box-shadow: 0 0 12px var(--atag-red-glow);
      background: rgba(229, 35, 35, 0.05);
      color: #ffffff;
    }

    .barcode-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .barcode-input-wrapper input {
      padding-right: 44px;
    }

    .btn-scanner-toggle {
      position: absolute;
      right: 4px;
      background: var(--atag-red-subtle);
      border: 1px solid rgba(229, 35, 35, 0.3);
      border-radius: 6px;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--atag-red);
      transition: all 0.2s;
    }

    .btn-scanner-toggle:active {
      transform: scale(0.92);
    }

    .btn-scanner-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-anexar {
      width: 100%;
      background: var(--atag-card-inner);
      border: 1px dashed var(--atag-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-anexar.tem-foto {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-bg);
    }

    .btn-anexar svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .preview-mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--atag-card-inner);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--atag-border);
      margin-top: 4px;
    }

    .preview-mini-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-mini img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--atag-border);
    }

    .preview-mini span {
      font-size: 9px;
      color: var(--success);
      font-weight: 800;
      text-transform: uppercase;
    }

    .btn-remover-foto {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      font-size: 9px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }

    .sys-status-bar {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--atag-card-inner);
      border: 1px solid var(--atag-border);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .sys-status-bar.pronto { color: var(--text-muted); }
    .sys-status-bar.enviando { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.1); }
    .sys-status-bar.sucesso { color: var(--success); border-color: rgba(16, 185, 129, 0.4); background: var(--success-bg); }

    /* OVERLAY CAMERA FLUTUANTE */
    .scanner-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .scanner-overlay.active {
      display: flex;
    }

    .scanner-wrapper {
      width: 100%;
      max-width: 360px;
      background: var(--atag-card);
      border: 2px solid var(--atag-red);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 30px var(--atag-red-glow);
      position: relative;
    }

    .scanner-header {
      padding: 10px;
      background: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--atag-border);
    }

    .scanner-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--atag-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-close-scanner {
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      max-height: 220px;
      object-fit: cover;
    }

    #reader button {
      background: var(--atag-red) !important;
      color: #ffffff !important;
      border: none !important;
      padding: 8px 16px !important;
      border-radius: 8px !important;
      font-weight: 800 !important;
      font-size: 11px !important;
      text-transform: uppercase !important;
      margin: 10px auto !important;
      cursor: pointer !important;
    }

    /* LISTA DE ITENS LOCADOS (ALTA DENSIDADE) */
    .allocated-card {
      background: linear-gradient(145deg, var(--atag-card), #0d121c);
      border: 1px solid var(--atag-border);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .filter-sticky-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--atag-card);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--atag-border);
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-sticky-bar select {
      flex: 1;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      background: var(--atag-card-inner);
      color: var(--atag-red);
      border: 1px solid var(--atag-border);
      border-radius: 8px;
      outline: none;
    }

    .allocated-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 2px 6px 2px;
    }

    .allocated-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* CARD COMPACTO HORIZONTAL */
    .allocated-item-compact {
      background: var(--atag-card-inner);
      border: 1px solid var(--atag-border);
      border-left: 3px solid var(--atag-red);
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .loc-tag-compact {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: var(--atag-red);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sku-compact {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .obs-compact {
      font-size: 9px;
      color: var(--text-muted);
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-thumb-center {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 6px;
      border: 1px solid var(--atag-border);
      background: #000;
      object-fit: cover;
      cursor: pointer;
    }

    .item-actions-compact {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-icon-act {
      background: var(--atag-card);
      border: 1px solid var(--atag-border);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon-act:active {
      transform: scale(0.9);
    }

    .btn-icon-act.edit { color: var(--atag-red); }
    .btn-icon-act.delete { color: var(--danger); background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.3); }

    .btn-icon-act svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-dim);
      padding: 20px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* BARRA FIXA INFERIOR (THUMB ZONE) */
    .bottom-nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 18, 28, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--atag-border);
      padding: 8px 12px;
      z-index: 1000;
      display: flex;
      justify-content: center;
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .nav-btn {
      background: var(--atag-card-inner);
      border: 1px solid var(--atag-border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .nav-btn.active {
      background: var(--atag-red-subtle);
      color: var(--atag-red);
      border-color: rgba(229, 35, 35, 0.4);
    }

    .btn-salvar-main {
      background: linear-gradient(135deg, var(--atag-red), #b91c1c);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--atag-red-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-salvar-main:active {
      transform: scale(0.96);
    }

    .badge-pill {
      background: var(--atag-red);
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 8px;
    }

    /* MODAIS */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 2500;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--atag-card);
      border: 1px solid var(--atag-border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--atag-red);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--atag-border);
    }

    .modal-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-modal {
      padding: 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-modal.save { background: var(--atag-red); color: #ffffff; }
    .btn-modal.cancel { background: var(--atag-card-inner); color: var(--text-main); border: 1px solid var(--atag-border); }

    .modal-foto-zoom {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
    }
    .modal-foto-zoom.active { display: flex; }
    .modal-foto-content {
      background: var(--atag-card);
      border: 1px solid var(--atag-border);
      border-radius: 14px;
      padding: 12px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .modal-foto-content img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- HEADER -->
    <div class="sys-header">
      <div class="sys-brand">
        <span class="brand-badge">ATAG</span>
        <div class="sys-title">
          <span class="sys-title-main">Coletor Industrial</span>
          <span class="sys-title-sub">Dourados - MS</span>
        </div>
      </div>
      <div class="sys-status">
        <span class="sys-status-dot"></span>
        <span>ONLINE</span>
      </div>
    </div>

    <!-- TELA 1: COLETOR -->
    <div id="view-coletor" class="view-section active">
      <div class="form-card">
        <div class="form-grid">
          
          <div class="form-field full">
            <label>Código de Barras / SKU</label>
            <div class="barcode-input-wrapper">
              <input type="text" id="input-codigo" placeholder="Bipe ou digite o código..." autofocus>
              <button type="button" id="btn-toggle-cam" class="btn-scanner-toggle" onclick="abrirCamera()" title="Escanear com a câmera">
                <svg viewBox="0 0 24 24">
                  <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4v-4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label>Rua (R01-R99)</label>
            <input type="text" id="input-local" placeholder="Ex: R01" maxlength="3" oninput="validarERepassarLocalizacao(this)">
          </div>

          <div class="form-field">
            <label>Posição (001-2000)</label>
            <input type="text" id="input-posicao" placeholder="Ex: 015" maxlength="4" oninput="validarERepassarPosicao(this)">
          </div>

          <div class="form-field full">
            <input type="file" id="input-arquivo-foto" accept="image/*" capture="environment" style="display:none;" onchange="processarFotoAnexada(this)">
            <button type="button" id="btn-anexar-trigger" class="btn-anexar" onclick="document.getElementById('input-arquivo-foto').click()">
              <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              📸 Tirar / Anexar Foto
            </button>
            <div id="preview-foto-container" style="display:none;">
              <div class="preview-mini">
                <div class="preview-mini-left">
                  <img id="img-preview-mini" src="" alt="Preview">
                  <span>Foto Anexada</span>
                </div>
                <button type="button" class="btn-remover-foto" onclick="removerFoto()">Remover</button>
              </div>
            </div>
          </div>

          <div class="form-field full">
            <label>Observação</label>
            <input type="text" id="input-obs" placeholder="Opcional (avaria, divergência, etc.)" style="text-align: left; font-size: 11px;">
          </div>

        </div>

        <div id="status-msg" class="sys-status-bar pronto">
          <span>></span> PREENCHA OS DADOS E CONFIRME
        </div>
      </div>
    </div>

    <!-- TELA 2: ITENS LOCADOS -->
    <div id="view-locados" class="view-section">
      <div class="allocated-card">
        
        <div class="filter-sticky-bar">
          <label style="font-size:9px; font-weight:800; color:var(--atag-red);">RUA:</label>
          <select id="select-filtro-rua" onchange="renderizarListaLocados()">
            <option value="TODAS">TODAS AS RUAS</option>
          </select>
        </div>

        <div class="allocated-header">
          <span>Organizado por Posição</span>
          <span id="count-historico" style="color:var(--atag-red);">0 ITENS</span>
        </div>

        <ul id="historico" class="allocated-list">
          <div id="msg-vazio" class="empty-msg">Carregando dados...</div>
        </ul>
      </div>
    </div>

  </div>

  <!-- LEITOR FLUTUANTE DE CÂMERA -->
  <div id="scanner-modal" class="scanner-overlay">
    <div class="scanner-wrapper">
      <div class="scanner-header">
        <span class="scanner-title">Aproxime o Código de Barras</span>
        <button class="btn-close-scanner" onclick="fecharCamera()">FECHAR</button>
      </div>
      <div id="reader"></div>
    </div>
  </div>

  <!-- BARRA DE AÇÕES NA ZONA DO POLEGAR -->
  <div class="bottom-nav-bar">
    <div class="bottom-nav-inner">
      <button id="btn-tab-coletor" class="nav-btn active" onclick="mudarAba('coletor')">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 9h10M7 12h10M7 15h10"/></svg>
        Coletor
      </button>

      <button type="button" class="btn-salvar-main" onclick="clicarSalvarRegistro()">
        💾 SALVAR
      </button>

      <button id="btn-tab-locados" class="nav-btn" onclick="mudarAba('locados')">
        <svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
        Locados <span id="badge-total" class="badge-pill">0</span>
      </button>
    </div>
  </div>

  <!-- MODAL EDITAR -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Editar Registro</div>
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div class="form-field full">
          <label>Código de Barras</label>
          <input type="text" id="edit-codigo">
        </div>
        <div class="form-field">
          <label>Rua</label>
          <input type="text" id="edit-local" maxlength="3">
        </div>
        <div class="form-field">
          <label>Posição</label>
          <input type="text" id="edit-posicao" maxlength="4">
        </div>
        <div class="form-field full">
          <label>Observação</label>
          <input type="text" id="edit-obs" style="text-align: left;">
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-modal cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn-modal save" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ZOOM FOTO -->
  <div id="modal-zoom" class="modal-foto-zoom" onclick="fecharZoom()">
    <div class="modal-foto-content" onclick="event.stopPropagation()">
      <img id="img-zoom-src" src="" alt="Foto SKU">
      <button class="btn-modal cancel" onclick="fecharZoom()">Fechar</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

    let fotoBase64Atual = "";
    let ultimoDadoLido = "";
    let ultimoTimestamp = 0;
    const BLOQUEIO_MS = 2000;
    let listaItensCache = [];
    let scannerAtivo = null;

    function mudarAba(aba) {
      document.getElementById('view-coletor').classList.remove('active');
      document.getElementById('view-locados').classList.remove('active');
      document.getElementById('btn-tab-coletor').classList.remove('active');
      document.getElementById('btn-tab-locados').classList.remove('active');

      if (aba === 'coletor') {
        document.getElementById('view-coletor').classList.add('active');
        document.getElementById('btn-tab-coletor').classList.add('active');
      } else {
        document.getElementById('view-locados').classList.add('active');
        document.getElementById('btn-tab-locados').classList.add('active');
        carregarLocacoesDaPlanilha();
      }
    }

    function tocarBip() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 2200;
        gain.gain.value = 0.20;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function abrirCamera() {
      document.getElementById('scanner-modal').classList.add('active');
      if (!scannerAtivo) {
        try {
          scannerAtivo = new Html5QrcodeScanner(
            "reader", 
            { fps: 15, qrbox: { width: 220, height: 110 }, facingMode: "environment" },
            false
          );
          scannerAtivo.render(processarDadoLido);
        } catch (err) {}
      }
    }

    function fecharCamera() {
      document.getElementById('scanner-modal').classList.remove('active');
      if (scannerAtivo) {
        try {
          scannerAtivo.clear();
          scannerAtivo = null;
        } catch(e){}
      }
    }

    function validarERepassarLocalizacao(input) {
      let val = input.value.toUpperCase().replace(/[^R0-9]/g, '');
      if (val.length > 0 && val[0] !== 'R') {
        val = 'R' + val.replace(/R/g, '');
      }
      if (val.length > 3) {
        val = val.substring(0, 3);
      }
      input.value = val;

      if (val.length === 3) {
        document.getElementById('input-posicao').focus();
      }
    }

    function validarERepassarPosicao(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length > 4) {
        val = val.substring(0, 4);
      }
      input.value = val;

      if (val.length === 3) {
        document.getElementById('input-obs').focus();
      }
    }

    function processarDadoLido(dadoBruto) {
      const texto = dadoBruto.trim().replace(/\n/g, "");
      if (!texto || texto.length < 2) return;

      const agora = Date.now();
      if (texto === ultimoDadoLido && (agora - ultimoTimestamp) < BLOQUEIO_MS) return;

      ultimoDadoLido = texto;
      ultimoTimestamp = agora;
      tocarBip();

      document.getElementById('input-codigo').value = texto;
      fecharCamera();
      document.getElementById('input-local').focus();
    }

    function processarFotoAnexada(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            fotoBase64Atual = canvas.toDataURL('image/jpeg', 0.7);
            
            document.getElementById('img-preview-mini').src = fotoBase64Atual;
            document.getElementById('preview-foto-container').style.display = "block";
            document.getElementById('btn-anexar-trigger').classList.add('tem-foto');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removerFoto() {
      fotoBase64Atual = "";
      document.getElementById('input-arquivo-foto').value = "";
      document.getElementById('preview-foto-container').style.display = "none";
      document.getElementById('btn-anexar-trigger').classList.remove('tem-foto');
    }

    function abrirZoom(urlFoto) {
      document.getElementById('img-zoom-src').src = urlFoto;
      document.getElementById('modal-zoom').classList.add('active');
    }

    function fecharZoom() {
      document.getElementById('modal-zoom').classList.remove('active');
    }

    function clicarSalvarRegistro() {
      const codigo = document.getElementById('input-codigo').value.trim();
      let local = document.getElementById('input-local').value.trim().toUpperCase();
      let posicao = document.getElementById('input-posicao').value.trim();
      const obs = document.getElementById('input-obs').value.trim();

      if (!codigo) {
        alert("Informe o Código de Barras!");
        document.getElementById('input-codigo').focus();
        return;
      }
      if (!local) {
        alert("Informe a Rua (Ex: R01)!");
        document.getElementById('input-local').focus();
        return;
      }
      if (!posicao) {
        alert("Informe a Posição (Ex: 015)!");
        document.getElementById('input-posicao').focus();
        return;
      }

      posicao = String(parseInt(posicao, 10)).padStart(3, '0');

      enviarParaSheets({
        codigo: codigo,
        localizacao: local,
        posicao: posicao,
        foto: fotoBase64Atual,
        obs: obs
      });
    }

    function carregarLocacoesDaPlanilha() {
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(dados => {
          listaItensCache = dados || [];
          atualizarOpcoesFiltroRuas();
          renderizarListaLocados();
        })
        .catch(() => {
          document.getElementById('historico').innerHTML = '<div class="empty-msg">Erro ao carregar dados.</div>';
        });
    }

    function atualizarOpcoesFiltroRuas() {
      const select = document.getElementById('select-filtro-rua');
      const ruaAtualSelecionada = select.value;
      
      const ruasUnicas = [...new Set(listaItensCache.map(i => i.localizacao).filter(Boolean))].sort();
      
      let html = '<option value="TODAS">TODAS AS RUAS</option>';
      ruasUnicas.forEach(rua => {
        html += `<option value="${rua}">${rua}</option>`;
      });
      
      select.innerHTML = html;
      if (ruasUnicas.includes(ruaAtualSelecionada)) {
        select.value = ruaAtualSelecionada;
      }
    }

    function renderizarListaLocados() {
      const ruaSelecionada = document.getElementById('select-filtro-rua').value;
      const historico = document.getElementById('historico');
      historico.innerHTML = "";

      let itensFiltrados = listaItensCache.filter(item => {
        if (ruaSelecionada === 'TODAS') return true;
        return item.localizacao === ruaSelecionada;
      });

      itensFiltrados.sort((a, b) => parseInt(a.posicao || 0, 10) - parseInt(b.posicao || 0, 10));

      document.getElementById('count-historico').innerText = itensFiltrados.length + " ITENS";
      document.getElementById('badge-total').innerText = listaItensCache.length;

      if (itensFiltrados.length === 0) {
        historico.innerHTML = '<div class="empty-msg">Nenhum item nesta rua.</div>';
        return;
      }

      itensFiltrados.forEach(item => {
        const li = document.createElement('li');
        li.className = "allocated-item-compact";
        let sourceFoto = item.foto || '';

        li.innerHTML = `
          <div class="item-info-left">
            <div class="loc-tag-compact">
              📍 ${item.locacao || (item.localizacao + '-' + item.posicao)}
            </div>
            <div class="sku-compact">SKU: ${item.codigo}</div>
            ${item.obs ? `<div class="obs-compact">${item.obs}</div>` : ''}
          </div>
          ${sourceFoto ? `<img src="${sourceFoto}" class="item-thumb-center" onclick="abrirZoom('${sourceFoto}')" title="Ampliar">` : ''}
          <div class="item-actions-compact">
            <button class="btn-icon-act edit" onclick="abrirEdicao('${item.id}')" title="Editar">
              <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="btn-icon-act delete" onclick="excluirItem('${item.id}')" title="Excluir">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `;
        historico.appendChild(li);
      });
    }

    function abrirEdicao(id) {
      const item = listaItensCache.find(i => i.id == id);
      if (!item) return;

      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-local').value = item.localizacao || "";
      document.getElementById('edit-posicao').value = item.posicao || "";
      document.getElementById('edit-codigo').value = item.codigo || "";
      document.getElementById('edit-obs').value = item.obs || "";

      document.getElementById('modal-edit').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modal-edit').classList.remove('active');
    }

    function salvarEdicao() {
      const id = document.getElementById('edit-id').value;
      const local = document.getElementById('edit-local').value.trim();
      const pos = document.getElementById('edit-posicao').value.trim();
      const cod = document.getElementById('edit-codigo').value.trim();
      const obs = document.getElementById('edit-obs').value.trim();

      if (!local || !pos || !cod) {
        alert("Preencha Código, Rua e Posição!");
        return;
      }

      fecharModal();
      document.getElementById('historico').innerHTML = '<div class="empty-msg">Atualizando...</div>';

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "update",
          id: id,
          localizacao: local,
          posicao: pos,
          codigo: cod,
          obs: obs
        })
      }).then(() => {
        setTimeout(carregarLocacoesDaPlanilha, 1000);
      });
    }

    function excluirItem(id) {
      if (!confirm("Confirmar exclusão?")) return;

      document.getElementById('historico').innerHTML = '<div class="empty-msg">Excluindo...</div>';

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "delete",
          id: id
        })
      }).then(() => {
        setTimeout(carregarLocacoesDaPlanilha, 1000);
      });
    }

    function enviarParaSheets(dados) {
      const statusElement = document.getElementById('status-msg');
      statusElement.className = "sys-status-bar enviando";
      statusElement.innerHTML = "<span>></span> ENVIANDO REGISTRO...";

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });

      document.getElementById('input-codigo').value = "";
      document.getElementById('input-local').value = "";
      document.getElementById('input-posicao').value = "";
      document.getElementById('input-obs').value = "";
      removerFoto();

      statusElement.className = "sys-status-bar sucesso";
      statusElement.innerHTML = "<span>></span> REGISTRO SALVO!";

      setTimeout(() => {
        carregarLocacoesDaPlanilha();
        statusElement.className = "sys-status-bar pronto";
        statusElement.innerHTML = "<span>></span> PRONTO PARA NOVO LANÇAMENTO";
        document.getElementById('input-codigo').focus();
      }, 1000);
    }

    window.addEventListener('load', function () {
      carregarLocacoesDaPlanilha();
    });
  </script>

</body>
</html>

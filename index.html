<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Coletor & Consulta Industrial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- HTML5-QRCode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: '#1E293B',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #interactive video, #qr-reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
        }

        .laser-line {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, rgba(229,62,62,0.1) 0%, rgba(239,68,68,1) 50%, rgba(229,62,62,0.1) 100%);
            box-shadow: 0 0 12px #EF4444, 0 0 4px #EF4444;
            z-index: 10;
            animation: scanLine 2s infinite ease-in-out;
        }

        @keyframes scanLine {
            0%, 100% { transform: translateY(-45px); opacity: 0.4; }
            50% { transform: translateY(45px); opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        #qr-reader {
            border: none !important;
            background: black;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        #qr-reader__scan_region {
            background: black;
        }
        #qr-reader__scan_region video {
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- HEADER STATUS BAR -->
    <header class="bg-atag-card border-b border-atag-border p-3 px-4 sticky top-0 z-30 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="bg-atag-red text-white font-extrabold px-2.5 py-1 rounded text-sm tracking-wider shadow-sm">ATAG</span>
                <div>
                    <h1 id="header-titulo" class="text-xs font-bold text-gray-200 uppercase tracking-wider leading-none">Coletor Industrial</h1>
                    <p class="text-[10px] text-gray-400 font-medium">Dourados - MS</p>
                </div>
            </div>
            <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="status-text">ONLINE</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">

        <!-- VIEW 1: COLETAR (FORMULARIO PRINCIPAL) -->
        <section id="view-coletar" class="flex flex-col gap-4">
            
            <!-- LOCACAO CARD -->
            <div class="bg-atag-card border border-atag-border rounded-xl p-4 shadow-md">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block flex justify-between items-center">
                    <span>1. Endereçamento (Locação)</span>
                    <span id="locacao-completa" class="text-atag-accent font-extrabold text-sm">R00-000</span>
                </label>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <span class="text-[11px] text-gray-400 mb-1 block font-medium">Rua (Ex: 01, R01)</span>
                        <div class="relative">
                            <input type="text" id="input-rua" placeholder="R01" maxlength="4" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase focus:outline-none focus:border-atag-accent transition-all">
                        </div>
                    </div>
                    <div>
                        <span class="text-[11px] text-gray-400 mb-1 block font-medium">Posição (Ex: 001)</span>
                        <div class="relative">
                            <input type="number" id="input-posicao" placeholder="001" inputmode="numeric"
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase focus:outline-none focus:border-atag-accent transition-all">
                        </div>
                    </div>
                </div>

                <div id="alert-locacao" class="hidden mt-3 p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border"></div>
            </div>

            <!-- BIPAR / CODIGO DE BARRAS CARD -->
            <div class="bg-atag-card border border-atag-border rounded-xl p-4 shadow-md flex flex-col gap-3">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block flex justify-between items-center">
                    <span>2. Código de Barras / SKU</span>
                    <i class="fa-solid fa-barcode text-atag-accent text-sm"></i>
                </label>

                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="input-codigo" placeholder="Digite ou Bipe..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-3 pr-8 py-3 font-mono font-bold text-base text-white focus:outline-none focus:border-atag-accent transition-all uppercase">
                        <button id="btn-clear-code" onclick="limparCodigo()" class="hidden absolute right-2.5 top-3 text-gray-400 hover:text-white">
                            <i class="fa-solid fa-circle-xmark"></i>
                        </button>
                    </div>
                    <button onclick="abrirModalCamera('coletar')" class="bg-atag-accent/20 border border-atag-accent/50 text-atag-accent hover:bg-atag-accent/30 px-4 rounded-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
                        <i class="fa-solid fa-camera text-lg"></i>
                        <span class="text-xs uppercase hidden sm:inline">Bipar</span>
                    </button>
                </div>

                <div id="alert-sku" class="hidden p-2.5 rounded-lg text-xs font-medium flex items-start gap-2 border"></div>
            </div>

            <!-- DETALHES OPCIONAIS (FOTO & OBS) -->
            <div class="bg-atag-card border border-atag-border rounded-xl p-4 shadow-md flex flex-col gap-3">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block">3. Opcionais (Foto & Observação)</label>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <input type="file" id="input-foto" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(event)">
                        <button onclick="document.getElementById('input-foto').click()" id="btn-foto-trigger" class="w-full bg-slate-900 border border-dashed border-slate-700 hover:border-atag-accent rounded-lg p-3 flex flex-col items-center justify-center gap-1.5 transition-all">
                            <i class="fa-solid fa-camera-retro text-gray-400 text-lg" id="icon-foto"></i>
                            <span class="text-xs font-medium text-gray-300" id="text-foto">Anexar Foto</span>
                        </button>
                    </div>

                    <div id="container-preview-foto" class="relative hidden bg-slate-900 rounded-lg border border-slate-700 overflow-hidden flex items-center justify-center">
                        <img id="img-preview" class="h-20 w-full object-cover" src="" alt="Preview">
                        <button onclick="removerFoto()" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="col-span-1">
                        <textarea id="input-obs" rows="2" placeholder="Observações..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-atag-accent resize-none h-full"></textarea>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW 2: TELA DE CONSULTA DE ESTOQUE (INDEPENDENTE) -->
        <section id="view-consulta" class="hidden flex flex-col gap-4">
            
            <!-- CARD DE FILTROS DE CONSULTA -->
            <div class="bg-atag-card border border-atag-border rounded-xl p-4 shadow-md flex flex-col gap-3">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                    <span class="text-xs font-bold text-atag-accent uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Filtros de Consulta
                    </span>
                    <button onclick="limparFiltrosConsulta()" class="text-[11px] text-gray-400 hover:text-white underline">Limpar</button>
                </div>

                <!-- FILTRO POR LOCAÇÃO (TOTAL OU PARCIAL) -->
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">Locação (Parcial ou Total)</label>
                    <div class="relative">
                        <input type="text" id="consulta-locacao" placeholder="Ex: R01001 ou R01..." oninput="filtrarConsultaSaldo()" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-white uppercase focus:outline-none focus:border-atag-accent">
                        <i class="fa-solid fa-location-dot absolute right-3 top-2.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <!-- FILTRO POR MARCA -->
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">Marca</label>
                        <select id="consulta-marca" onchange="filtrarConsultaSaldo()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs font-bold text-atag-accent focus:outline-none">
                            <option value="TODAS">TODAS</option>
                        </select>
                    </div>

                    <!-- BOTAO BIPAR NA CONSULTA -->
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">Bipar Produto</label>
                        <button onclick="abrirModalCamera('consulta')" class="w-full bg-atag-accent/10 border border-atag-accent/40 text-atag-accent hover:bg-atag-accent/20 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-camera"></i>
                            <span>BIPAR</span>
                        </button>
                    </div>
                </div>

                <!-- FILTRO POR CODIGO MESTRE / DESCRICAO -->
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">Cód. Mestre ou Descrição</label>
                    <input type="text" id="consulta-codmestre" placeholder="Ex: ETE9937, CHICOTE..." oninput="filtrarConsultaSaldo()" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-white uppercase focus:outline-none focus:border-atag-accent">
                </div>
            </div>

            <!-- CARD DE RESUMO E RESULTADOS DA CONSULTA -->
            <div class="bg-atag-card border border-atag-border rounded-xl p-3 shadow-md flex flex-col gap-3">
                <div class="flex justify-between items-center text-[11px] text-gray-400 font-bold">
                    <span>RESULTADOS DA BASE SALDO</span>
                    <div class="flex gap-2">
                        <span id="consulta-total-itens" class="text-atag-accent">0 ITENS</span>
                        <span class="text-slate-600">|</span>
                        <span id="consulta-total-qtd" class="text-emerald-400">0 UNID.</span>
                    </div>
                </div>

                <!-- LISTA DE ITENS DA PLANILHA SALDO_ATUAL -->
                <div id="lista-consulta-saldo" class="flex flex-col gap-2 max-h-[50vh] overflow-y-auto pr-1">
                    <!-- Injetado via Javascript -->
                </div>
            </div>

        </section>

        <!-- VIEW 3: ESTOQUE (LISTA DE LANÇAMENTOS DO COLETOR) -->
        <section id="view-estoque" class="hidden flex flex-col gap-3">
            <div class="bg-atag-card border border-atag-border rounded-xl p-3 shadow-md flex flex-col gap-3">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Filtrar por Rua:</span>
                    <select id="select-filtro-rua" onchange="renderizarEstoque()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-bold text-atag-accent focus:outline-none">
                        <option value="TODAS">TODAS AS RUAS</option>
                    </select>
                </div>
                <div class="flex justify-between items-center text-[11px] text-gray-400 border-t border-slate-700/50 pt-2 font-medium">
                    <span>ORGANIZADO POR POSIÇÃO</span>
                    <span id="total-itens-contador" class="text-atag-accent font-bold">0 ITENS</span>
                </div>
            </div>

            <div id="lista-estoque" class="flex flex-col gap-2.5">
                <!-- Injetado Dinamicamente -->
            </div>
        </section>

    </main>

    <!-- FOOTER NAV BAR -->
    <footer class="bg-atag-card border-t border-atag-border p-2 sticky bottom-0 z-30 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5">
            <button onclick="mudarAba('coletar')" id="nav-coletar" class="py-2.5 rounded-xl font-bold text-[11px] flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40 shadow">
                <i class="fa-solid fa-qrcode text-base"></i>
                <span>COLETAR</span>
            </button>
            <button onclick="mudarAba('consulta')" id="nav-consulta" class="py-2.5 rounded-xl font-bold text-[11px] flex flex-col items-center gap-1 text-gray-400 hover:bg-slate-800/50 transition-all">
                <i class="fa-solid fa-magnifying-glass text-base"></i>
                <span>CONSULTA</span>
            </button>
            <button onclick="salvarColeta()" id="btn-salvar" class="py-2.5 rounded-xl font-extrabold text-[11px] flex flex-col items-center gap-1 bg-atag-red hover:bg-atag-redDark text-white shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-floppy-disk text-base"></i>
                <span>SALVAR</span>
            </button>
            <button onclick="mudarAba('estoque')" id="nav-estoque" class="py-2.5 rounded-xl font-bold text-[11px] flex flex-col items-center gap-1 text-gray-400 hover:bg-slate-800/50 transition-all relative">
                <i class="fa-solid fa-boxes-stacked text-base"></i>
                <span>ESTOQUE</span>
                <span id="badge-estoque-count" class="absolute top-1 right-2 bg-atag-accent text-slate-950 font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </footer>

    <!-- MODAL CAMERA SCANNER -->
    <div id="modal-camera" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col justify-between p-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-barcode text-atag-accent text-lg"></i>
                <span class="font-bold text-sm text-white uppercase tracking-wider">Leitor Industrial</span>
            </div>
            <button onclick="fecharModalCamera()" class="bg-slate-800 hover:bg-slate-700 text-gray-300 w-9 h-9 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="relative my-auto w-full max-w-sm mx-auto aspect-square bg-black rounded-2xl border-2 border-atag-accent/40 overflow-hidden shadow-2xl flex items-center justify-center">
            <div id="qr-reader" class="w-full h-full"></div>
            <div class="laser-line"></div>
            <div class="absolute top-3 left-3 w-6 h-6 border-t-2 border-l-2 border-atag-accent pointer-events-none"></div>
            <div class="absolute top-3 right-3 w-6 h-6 border-t-2 border-r-2 border-atag-accent pointer-events-none"></div>
            <div class="absolute bottom-3 left-3 w-6 h-6 border-b-2 border-l-2 border-atag-accent pointer-events-none"></div>
            <div class="absolute bottom-3 right-3 w-6 h-6 border-b-2 border-r-2 border-atag-accent pointer-events-none"></div>
        </div>

        <div class="flex flex-col gap-3 bg-atag-card border border-atag-border p-3.5 rounded-xl">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-1">
                    <i class="fa-solid fa-video text-atag-accent text-xs"></i>
                    <select id="select-camera" onchange="trocarCamera(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold text-white focus:outline-none focus:border-atag-accent">
                        <option value="">Carregando Câmeras...</option>
                    </select>
                </div>
                
                <button id="btn-torch" onclick="toggleTorch()" class="bg-slate-900 border border-slate-700 hover:border-amber-400 text-amber-400 px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span id="torch-text">Luz</span>
                </button>
            </div>
            <p class="text-[11px] text-gray-400 text-center font-medium">Aproxime o código do retângulo central. O foco é automático.</p>
        </div>
    </div>

    <!-- MODAL EDITAR ITEM -->
    <div id="modal-editar" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-atag-card border border-atag-border rounded-xl w-full max-w-md p-4 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-sm font-bold text-white uppercase">Editar Item</h3>
                <button onclick="fecharModalEditar()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <input type="hidden" id="edit-id">
            
            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase">Código de Barras</label>
                    <input type="text" id="edit-codigo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Rua</label>
                        <input type="text" id="edit-rua" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Posição</label>
                        <input type="number" id="edit-posicao" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase">Observação</label>
                    <textarea id="edit-obs" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mt-1 resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-slate-700">
                <button onclick="fecharModalEditar()" class="flex-1 bg-slate-800 text-gray-300 py-2.5 rounded-lg text-xs font-bold">Cancelar</button>
                <button onclick="salvarEdicaoItem()" class="flex-1 bg-atag-accent text-slate-950 py-2.5 rounded-lg text-xs font-black uppercase">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL ZOOM FOTO -->
    <div id="modal-foto" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4" onclick="fecharModalFoto()">
        <img id="img-zoom" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain" src="" alt="Zoom">
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseDados = [];
        let baseSaldoAtual = []; // Dados da aba SALDO_ATUAL
        let fotoBase64 = "";
        let html5QrCode = null;
        let cameraAtualId = null;
        let isTorchOn = false;
        let modoBipagemCamera = "coletar"; // 'coletar' ou 'consulta'

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 1200;
                gain.gain.value = 0.2;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}

            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        window.onload = function() {
            carregarDadosServidor();

            document.getElementById('input-rua').addEventListener('input', function(e) {
                let val = e.target.value.toUpperCase();
                if (val && !val.startsWith('R') && !isNaN(val)) {
                    val = 'R' + val.padStart(2, '0');
                }
                e.target.value = val;
                atualizarLocacaoCompleta();
            });

            document.getElementById('input-posicao').addEventListener('input', function(e) {
                atualizarLocacaoCompleta();
            });

            document.getElementById('input-codigo').addEventListener('input', function(e) {
                e.target.value = e.target.value.toUpperCase();
                const btnClear = document.getElementById('btn-clear-code');
                if (e.target.value) {
                    btnClear.classList.remove('hidden');
                } else {
                    btnClear.classList.add('hidden');
                }
                validarSKUDuplicado();
            });
        };

        function getLocacaoFormatada() {
            let ruaInput = document.getElementById('input-rua').value.trim().toUpperCase();
            let posInput = document.getElementById('input-posicao').value.trim();

            if (!ruaInput) return "";

            let ruaClean = ruaInput.replace(/[^0-9]/g, '');
            let rua = ruaClean ? 'R' + ruaClean.padStart(2, '0') : ruaInput;
            let pos = posInput ? posInput.replace(/[^0-9]/g, '').padStart(3, '0') : '000';

            return `${rua}-${pos}`;
        }

        function atualizarLocacaoCompleta() {
            const loc = getLocacaoFormatada();

        function filtrarConsultaSaldo() {
            const filtroLoc = document.getElementById('consulta-locacao').value.trim().toUpperCase();
            const filtroMarca = document.getElementById('consulta-marca').value;
            const filtroCodDesc = document.getElementById('consulta-codmestre').value.trim().toUpperCase();

            const container = document.getElementById('lista-consulta-saldo');
            container.innerHTML = "";

            let itens = baseSaldoAtual.filter(i => {
                const loc = String(i.LOCACAO || i.locacao || "").toUpperCase();
                const marca = String(i.Marca || i.marca || "").toUpperCase();
                const cod = String(i["Cod.Mestre"] || i.codigo || "").toUpperCase();
                const desc = String(i.Descrição || i.descricao || "").toUpperCase();

                // Filtro Locacao (Parcial ou Total)
                if (filtroLoc && !loc.includes(filtroLoc)) return false;

                // Filtro Marca
                if (filtroMarca !== "TODAS" && marca !== filtroMarca) return false;

                // Filtro Codigo / Descricao
                if (filtroCodDesc && (!cod.includes(filtroCodDesc) && !desc.includes(filtroCodDesc))) return false;

                return true;
            });

            // Atualiza Contadores
            document.getElementById('consulta-total-itens').innerText = `${itens.length} ITENS`;
            const totalQtd = itens.reduce((acc, curr) => acc + (parseFloat(curr.Qtd_Estoque || curr.qtd || 0)), 0);
            document.getElementById('consulta-total-qtd').innerText = `${totalQtd} UNID.`;

            if (itens.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500 font-bold text-xs uppercase tracking-wider">
                        Nenhum item encontrado no Saldo.
                    </div>
                `;
                return;
            }

            itens.forEach(item => {
                const codMestre = item["Cod.Mestre"] || item.codigo || "S/ CÓDIGO";
                const desc = item.Descrição || item.descricao || "SEM DESCRIÇÃO";
                const marca = item.Marca || item.marca || "INDETERMINADA";
                const locacao = item.LOCACAO || item.locacao || "S/L";
                const qtd = item.Qtd_Estoque !== undefined ? item.Qtd_Estoque : (item.qtd || 0);

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-1.5 shadow";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="bg-atag-accent/20 border border-atag-accent/40 text-atag-accent font-black text-xs px-2 py-0.5 rounded">
                            ${locacao}
                        </span>
                        <span class="text-[10px] font-extrabold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded">
                            ${marca}
                        </span>
                    </div>

                    <div class="flex justify-between items-baseline gap-2 mt-1">
                        <span class="font-mono font-extrabold text-sm text-white">${codMestre}</span>
                        <span class="text-xs font-black text-emerald-400">${qtd} UN</span>
                    </div>

                    <p class="text-[11px] text-gray-300 font-medium leading-tight truncate">${desc}</p>
                `;

                container.appendChild(card);
            });
        }

        // VALIDAÇÕES EM TEMPO REAL
        function validarLocacaoOcupada() {
            const loc = getLocacaoFormatada();
            const alertBox = document.getElementById('alert-locacao');

            if (!loc || loc.length < 7) {
                alertBox.classList.add('hidden');
                return;
            }

            const itemExistente = baseDados.find(i => (i.locacao === loc || i.Locação === loc || i.LOCACAO === loc));

            if (itemExistente) {
                const sku = itemExistente.codigo || itemExistente["Código de Barras"] || itemExistente["Cod.Mestre"] || "Item";
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border bg-amber-500/10 border-amber-500/30 text-amber-300 mt-3";
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i> <span>Atenção: Locação <b>${loc}</b> já possui o SKU: <b>${sku}</b></span>`;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 mt-3";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i> <span>Locação <b>${loc}</b> livre.</span>`;
                alertBox.classList.remove('hidden');
            }
        }

        function validarSKUDuplicado() {
            const cod = document.getElementById('input-codigo').value.trim().toUpperCase();
            const alertBox = document.getElementById('alert-sku');

            if (!cod) {
                alertBox.classList.add('hidden');
                return;
            }

            const repetidos = baseDados.filter(i => {
                const c = i.codigo || i["Código de Barras"] || i["Cod.Mestre"] || "";
                return String(c).trim().toUpperCase() === cod;
            });

            if (repetidos.length > 0) {
                const locs = repetidos.map(r => r.locacao || r["Locação"] || r["LOCACAO"] || "S/L").join(", ");
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-start gap-2 border bg-sky-500/10 border-sky-500/30 text-sky-300";
                alertBox.innerHTML = `<i class="fa-solid fa-info-circle text-sky-400 text-sm mt-0.5"></i> <span>SKU bipado <b>${repetidos.length}x</b> nas locações: <b>${locs}</b></span>`;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
            }
        }

        // FOTO REDIMENSIONADA
        function processarFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('img-preview').src = fotoBase64;
                    document.getElementById('container-preview-foto').classList.remove('hidden');
                    document.getElementById('btn-foto-trigger').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removerFoto() {
            fotoBase64 = "";
            document.getElementById('input-foto').value = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('container-preview-foto').classList.add('hidden');
            document.getElementById('btn-foto-trigger').classList.remove('hidden');
        }

        // SCANNER DE CÂMERA
        async function abrirModalCamera(modo = "coletar") {
            modoBipagemCamera = modo;
            document.getElementById('modal-camera').classList.remove('hidden');
            iniciarScannerHtml5();
        }

        async function iniciarScannerHtml5() {
            try {
                const devices = await Html5Qrcode.getCameras();
                const selectCam = document.getElementById('select-camera');
                selectCam.innerHTML = "";

                if (devices && devices.length > 0) {
                    let backCamId = devices[0].id;

                    devices.forEach((cam, index) => {
                        const opt = document.createElement('option');
                        opt.value = cam.id;
                        let label = cam.label || `Câmera ${index + 1}`;
                        let lowerLabel = label.toLowerCase();
                        
                        if (lowerLabel.includes('back') || lowerLabel.includes('traseira') || lowerLabel.includes('environment')) {
                            backCamId = cam.id;
                        }
                        opt.text = label;
                        selectCam.appendChild(opt);
                    });

                    cameraAtualId = backCamId;
                    selectCam.value = backCamId;
                    startCameraWithConfig(cameraAtualId);
                } else {
                    alert("Nenhuma câmera encontrada no dispositivo.");
                }
            } catch (err) {
                console.error("Erro ao listar câmeras:", err);
            }
        }

        function startCameraWithConfig(cameraId) {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    renderCameraInstance(cameraId);
                }).catch(() => {
                    renderCameraInstance(cameraId);
                });
            } else {
                renderCameraInstance(cameraId);
            }
        }

        function renderCameraInstance(cameraId) {
            html5QrCode = new Html5Qrcode("qr-reader");

            const config = {
                fps: 25,
                qrbox: { width: 280, height: 130 },
                aspectRatio: 1.0,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX
                ]
            };

            html5QrCode.start(
                { deviceId: { exact: cameraId } },
                config,
                onScanSuccess
            ).catch(err => {
                html5QrCode.start(
                    { deviceId: cameraId },
                    config,
                    onScanSuccess
                ).catch(fallbackErr => {
                    alert("Não foi possível carregar o vídeo da câmera.");
                });
            });
        }

        function onScanSuccess(decodedText) {
            playBeepSound();
            const codigo = decodedText.toUpperCase();

            if (modoBipagemCamera === "coletar") {
                document.getElementById('input-codigo').value = codigo;
                document.getElementById('btn-clear-code').classList.remove('hidden');
                validarSKUDuplicado();
            } else if (modoBipagemCamera === "consulta") {
                document.getElementById('consulta-codmestre').value = codigo;
                filtrarConsultaSaldo();
            }

            fecharModalCamera();
        }

        function trocarCamera(newCamId) {
            cameraAtualId = newCamId;
            startCameraWithConfig(newCamId);
        }

            if (!html5QrCode) return;
            isTorchOn = !isTorchOn;

                document.getElementById('torch-text').innerText = isTorchOn ? "Ligada" : "Luz";

                const locA = a.locacao || a["Locação"] || a["LOCACAO"] || "";
                const locB = b.locacao || b["Locação"] || b["LOCACAO"] || "";
                return locA.localeCompare(locB);

            const payload = {
                action: "delete",
                id: id
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                setTimeout(carregarDadosServidor, 800);
            } catch (e) {
                alert("Erro ao excluir item.");
            }
        }

        function abrirFotoZoom(src) {
            document.getElementById('img-zoom').src = src;
            document.getElementById('modal-foto').classList.remove('hidden');
        }

        function fecharModalFoto() {
            document.getElementById('modal-foto').classList.add('hidden');
        }
    </script>
</body>
</html>

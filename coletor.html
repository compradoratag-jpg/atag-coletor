<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Coletor Industrial</title>
    
    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATAG Coletor">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- HTML5-QRCode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: 'rgba(30, 41, 59, 0.92)',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('atag_logo.png');
            background-repeat: no-repeat;
            background-position: 65% center;
            background-size: 55% auto; 
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 1024px) {
            body::before {
                background-position: center center;
                background-size: 80% auto;
                opacity: 0.06;
            }
        }

        .glass-card {
            background-color: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .atag-logo-glow { filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.25)); }

        input:focus, textarea:focus, select:focus {
            border-color: #38BDF8 !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35) !important;
            outline: none;
        }

        #qr-reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
        }

        .laser-line {
            position: absolute;
            top: 50%; left: 5%; right: 5%; height: 2px;
            background: linear-gradient(90deg, rgba(229,62,62,0.1) 0%, rgba(239,68,68,1) 50%, rgba(229,62,62,0.1) 100%);
            box-shadow: 0 0 12px #EF4444, 0 0 4px #EF4444;
            z-index: 10;
            animation: scanLine 2s infinite ease-in-out;
        }

        @keyframes scanLine {
            0%, 100% { transform: translateY(-45px); opacity: 0.4; }
            50% { transform: translateY(45px); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        #qr-reader { border: none !important; background: black; border-radius: 0.75rem; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased relative z-10">

    <!-- HEADER -->
    <header class="glass-card border-b border-atag-border p-3 px-4 sticky top-0 z-30 shadow-xl">
        <div class="max-w-md lg:max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="bg-slate-800 hover:bg-slate-700 text-atag-accent px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow border border-slate-700" title="Voltar ao Menu">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Menu</span>
                </a>

                <img src="atag_logo.png" alt="Logo ATAG" class="h-9 w-auto atag-logo-glow">
                <div>
                    <h1 class="text-xs font-bold text-gray-200 uppercase tracking-wider leading-none">Coletor Industrial</h1>
                    <p class="text-[10px] text-gray-400 font-medium">Dourados - MS <span class="hidden lg:inline text-atag-accent font-semibold ml-2">| Gatilho & Câmara Ativa</span></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="status-badge" class="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                    <span id="status-text">ATUALIZANDO</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md lg:max-w-6xl w-full mx-auto p-4 pb-24 lg:pb-4 flex flex-col gap-4 relative z-10">
        <div class="lg:grid lg:grid-cols-12 lg:gap-6 lg:items-start">

            <!-- COLUNA ESQUERDA: FORMULÁRIO (COLETAR) -->
            <section id="view-coletar" class="lg:col-span-5 flex flex-col gap-4">
                
                <!-- 1. CÓDIGO DE BARRAS / GATILHO -->
                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block flex justify-between items-center">
                        <span>1. Código de Barras / SKU (Gatilho Ativo)</span>
                        <i class="fa-solid fa-barcode text-atag-accent text-sm"></i>
                    </label>

                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="text" id="input-codigo" placeholder="Bipe o coletor ou digite..." autofocus
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-3 pr-8 py-3 font-mono font-bold text-base text-white uppercase">
                            <button id="btn-clear-code" onclick="limparCodigo()" class="hidden absolute right-2.5 top-3 text-gray-400 hover:text-white">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                        </div>
                        <button onclick="abrirModalCamera()" class="bg-atag-accent/20 border border-atag-accent/50 text-atag-accent hover:bg-atag-accent/30 px-4 rounded-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
                            <i class="fa-solid fa-camera text-lg"></i>
                        </button>
                    </div>
                    <!-- ALERTA DE SKU DUPLICADO -->
                    <div id="alert-sku-duplicado" class="hidden p-2.5 rounded-lg text-xs font-bold bg-red-500/20 border border-red-500/50 text-red-300 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-base"></i>
                        <span id="txt-alerta-sku"></span>
                    </div>
                </div>

                <!-- 2. LOCAÇÃO -->
                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block flex justify-between items-center">
                        <span>2. Endereçamento (Locação)</span>
                        <span id="locacao-completa" class="text-atag-accent font-extrabold text-sm">R00-000</span>
                    </label>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="text-[11px] text-gray-400 mb-1 block font-medium">Rua (Ex: R01)</span>
                            <input type="text" id="input-rua" placeholder="R01" maxlength="3" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase">
                        </div>
                        <div>
                            <span class="text-[11px] text-gray-400 mb-1 block font-medium">Posição (001 - 2000)</span>
                            <input type="text" id="input-posicao" placeholder="001" inputmode="numeric" maxlength="4"
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase">
                        </div>
                    </div>
                    <!-- ALERTA DE STATUS DA LOCAÇÃO (OCUPADA / LIVRE) -->
                    <div id="alert-locacao-status" class="hidden mt-3 p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 border"></div>
                </div>

                <!-- 3. FOTO LEVE & OBS -->
                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block">3. Opcionais (Foto Leve & OBS)</label>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <label for="input-foto-arquivo" id="btn-foto-trigger" class="w-full bg-slate-900 border border-dashed border-slate-700 hover:border-atag-accent rounded-lg p-3 flex flex-col items-center justify-center gap-1.5 transition-all cursor-pointer">
                                <i class="fa-solid fa-camera-retro text-gray-400 text-lg"></i>
                                <span class="text-xs font-medium text-gray-300">Anexar Foto</span>
                            </label>
                            <input type="file" id="input-foto-arquivo" accept="image/*" capture="environment" class="hidden" onchange="processarFotoOtimizada(this)">
                        </div>

                        <div id="container-preview-foto" class="relative hidden bg-slate-900 rounded-lg border border-slate-700 overflow-hidden flex items-center justify-center">
                            <img id="img-preview" class="h-20 w-full object-cover" src="" alt="Preview">
                            <button onclick="removerFoto()" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div class="col-span-1">
                            <textarea id="input-obs" rows="2" placeholder="Observações (opcional)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white resize-none h-full"></textarea>
                        </div>
                    </div>
                </div>

                <div class="hidden lg:block">
                    <button onclick="salvarColeta()" id="btn-salvar-desktop" class="w-full py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 bg-atag-red hover:bg-atag-redDark text-white shadow-xl active:scale-95 transition-all uppercase tracking-wider">
                        <i class="fa-solid fa-floppy-disk text-lg"></i>
                        <span>Salvar Lançamento (Enter)</span>
                    </button>
                </div>
            </section>

            <!-- COLUNA DIREITA: ESTOQUE -->
            <section id="view-estoque" class="lg:col-span-7 hidden lg:flex flex-col gap-3 mt-4 lg:mt-0">
                <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex flex-col gap-3">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-boxes-stacked text-atag-accent"></i>
                            <span class="text-xs font-bold text-gray-200 uppercase tracking-wider">Consulta em Tempo Real</span>
                        </div>
                        <button onclick="exportarRelatorioCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow">
                            <i class="fa-solid fa-file-excel text-sm"></i>
                            <span>Exportar Relatório</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700/50">
                        <button onclick="toggleModoVisao()" id="btn-modo-visao" class="bg-slate-900 border border-slate-700 text-gray-300 px-3 py-2 rounded-lg text-xs font-bold">
                            <span id="text-modo-visao">Compacto</span>
                        </button>
                        <select id="select-filtro-rua" onchange="renderizarEstoque()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-atag-accent text-center">
                            <option value="TODAS">TODAS AS RUAS</option>
                        </select>
                    </div>

                    <div class="flex justify-between items-center text-[11px] text-gray-400 border-t border-slate-700/50 pt-2 font-medium">
                        <span>ORGANIZADO POR POSIÇÃO</span>
                        <span id="total-itens-contador" class="text-atag-accent font-bold">0 ITENS</span>
                    </div>
                </div>

                <div id="lista-estoque" class="flex flex-col gap-2.5 pb-20 lg:pb-0 lg:max-h-[calc(100vh-220px)] lg:overflow-y-auto lg:pr-1"></div>
            </section>
        </div>
    </main>

    <!-- FOOTER NAV BAR (MOBILE) -->
    <footer class="lg:hidden glass-card border-t border-atag-border p-2 fixed bottom-0 left-0 right-0 z-30 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <button onclick="mudarAba('coletar')" id="nav-coletar" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40">
                <i class="fa-solid fa-qrcode text-base"></i>
                <span>COLETAR</span>
            </button>
            <button onclick="salvarColeta()" id="btn-salvar" class="py-2.5 rounded-xl font-extrabold text-xs flex flex-col items-center gap-1 bg-atag-red text-white shadow-lg">
                <i class="fa-solid fa-floppy-disk text-base"></i>
                <span>SALVAR</span>
            </button>
            <button onclick="mudarAba('estoque')" id="nav-estoque" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 text-gray-400">
                <i class="fa-solid fa-boxes-stacked text-base"></i>
                <span>ESTOQUE</span>
            </button>
        </div>
    </footer>

    <!-- MODAL CAMERA -->
    <div id="modal-camera" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <span class="font-bold text-sm text-white uppercase"><i class="fa-solid fa-camera text-atag-accent mr-2"></i>Leitor por Câmara</span>
            <button onclick="fecharModalCamera()" class="bg-slate-800 text-gray-300 w-9 h-9 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="relative my-auto w-full max-w-sm mx-auto aspect-square bg-slate-900 rounded-2xl border-2 border-atag-accent/40 overflow-hidden flex items-center justify-center">
            <div id="qr-reader" class="w-full h-full"></div>
            <div id="cam-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-gray-400 text-xs gap-2 p-4 text-center">
                <i class="fa-solid fa-spinner fa-spin text-atag-accent text-2xl"></i>
                <span>Iniciando câmara... Verifique as permissões.</span>
            </div>
            <div class="laser-line"></div>
        </div>

        <div class="flex flex-col gap-2 max-w-sm mx-auto w-full">
            <button onclick="reiniciarCamera()" class="bg-slate-800 hover:bg-slate-700 text-atag-accent py-2.5 rounded-lg text-xs font-bold transition-all">
                <i class="fa-solid fa-rotate-right mr-1"></i> Reiniciar Câmara
            </button>
            <button onclick="fecharModalCamera()" class="bg-red-600/80 hover:bg-red-600 text-white py-2.5 rounded-lg text-xs font-bold transition-all">
                Fechar Câmara
            </button>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal-editar" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-center items-center p-4">
        <div class="glass-card border border-atag-border rounded-2xl p-5 max-w-md w-full shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <span class="font-bold text-sm text-white uppercase"><i class="fa-solid fa-pen-to-square text-atag-accent mr-2"></i>Editar Lançamento</span>
                <button onclick="fecharModalEditar()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="edit-id-original">
            <div>
                <label class="text-[11px] text-gray-400 font-bold block mb-1">CÓDIGO DE BARRAS / SKU</label>
                <input type="text" id="edit-codigo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 font-mono font-bold text-white uppercase">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[11px] text-gray-400 font-bold block mb-1">RUA (Ex: R01)</label>
                    <input type="text" id="edit-rua" maxlength="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-white uppercase">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 font-bold block mb-1">POSIÇÃO</label>
                    <input type="text" id="edit-posicao" maxlength="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-white uppercase">
                </div>
            </div>
            <div>
                <label class="text-[11px] text-gray-400 font-bold block mb-1">OBSERVAÇÃO</label>
                <textarea id="edit-obs" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white resize-none"></textarea>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="fecharModalEditar()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-gray-300 py-2.5 rounded-xl font-bold text-xs">Cancelar</button>
                <button onclick="salvarEdicao()" class="flex-1 bg-atag-accent hover:bg-sky-400 text-slate-950 py-2.5 rounded-xl font-extrabold text-xs shadow-lg">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseDados = [];
        let fotoBase64 = "";
        let html5QrCode = null;
        let modoVisaoCompacto = false;

        window.onload = function() {
            carregarDadosServidor(true);
            focarInputCodigo();
            setInterval(() => carregarDadosServidor(false), 5000);

            // GATILHO HARDWARE / LEITOR FÍSICO TRADICIONAL
            window.addEventListener('keydown', function(e) {
                const inputCod = document.getElementById('input-codigo');
                
                if (e.key === 'Enter') {
                    if (document.activeElement === inputCod && inputCod.value.trim() !== '') {
                        e.preventDefault();
                        document.getElementById('input-rua').focus();
                        document.getElementById('input-rua').select();
                    } else if (inputCod.value && document.getElementById('input-rua').value && document.getElementById('input-posicao').value) {
                        e.preventDefault();
                        salvarColeta();
                    }
                }
            });

            document.getElementById('input-rua').addEventListener('input', function(e) {
                let val = e.target.value.toUpperCase().replace(/[^R0-9]/g, '');
                if (val.length > 0 && !val.startsWith('R')) val = 'R' + val.replace(/R/g, '');
                e.target.value = val;
                atualizarLocacaoCompleta();
                verificarStatusLocacao();
                if (val.length === 3) document.getElementById('input-posicao').focus();
            });

            document.getElementById('input-posicao').addEventListener('input', function(e) {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 4) val = val.substring(0, 4);
                e.target.value = val;
                atualizarLocacaoCompleta();
                verificarStatusLocacao();
            });

            document.getElementById('input-codigo').addEventListener('input', function(e) {
                e.target.value = e.target.value.toUpperCase();
                const codigo = e.target.value.trim();
                const btnClear = document.getElementById('btn-clear-code');
                const alertaSku = document.getElementById('alert-sku-duplicado');
                
                if (codigo) {
                    btnClear.classList.remove('hidden');
                    const itemExistente = baseDados.find(i => (i.codigo || i["Código de Barras"] || "").toUpperCase() === codigo);
                    if (itemExistente) {
                        const locOcupada = itemExistente.locacao || itemExistente["Locação"] || "S/L";
                        document.getElementById('txt-alerta-sku').innerText = `ITEM JÁ CADASTRADO! Localizado em: ${locOcupada}`;
                        alertaSku.classList.remove('hidden');
                    } else {
                        alertaSku.classList.add('hidden');
                    }
                } else {
                    btnClear.classList.add('hidden');
                    alertaSku.classList.add('hidden');
                }
            });
        };

        function focarInputCodigo() {
            const inputCod = document.getElementById('input-codigo');
            if (inputCod) { inputCod.focus(); inputCod.select(); }
        }

        function limparCodigo() {
            document.getElementById('input-codigo').value = "";
            document.getElementById('btn-clear-code').classList.add('hidden');
            document.getElementById('alert-sku-duplicado').classList.add('hidden');
            focarInputCodigo();
        }

        function getLocacaoFormatada() {
            let rua = document.getElementById('input-rua').value.trim().toUpperCase();
            let pos = document.getElementById('input-posicao').value.trim();
            if (!rua) return "";
            if (rua.length === 2 && !isNaN(rua[1])) rua = 'R0' + rua[1];
            if (pos) {
                let numPos = parseInt(pos, 10);
                if (!isNaN(numPos)) return `${rua}-${String(numPos).padStart(3, '0')}`;
            }
            return rua;
        }

        function atualizarLocacaoCompleta() {
            document.getElementById('locacao-completa').innerText = getLocacaoFormatada() || "R00-000";
        }

        function verificarStatusLocacao() {
            const locacaoAtual = getLocacaoFormatada();
            const divStatus = document.getElementById('alert-locacao-status');

            if (!locacaoAtual || locacaoAtual.length < 5) {
                divStatus.classList.add('hidden');
                return;
            }

            const itemNaLocacao = baseDados.find(i => (i.locacao || i["Locação"] || "").toUpperCase() === locacaoAtual);

            if (itemNaLocacao) {
                const produtoOcupante = itemNaLocacao.codigo || itemNaLocacao["Código de Barras"] || "Produto";
                divStatus.className = "mt-3 p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 border bg-amber-500/20 border-amber-500/50 text-amber-300";
                divStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base"></i><span>Locação Ocupada! Contém o produto: <b>${produtoOcupante}</b></span>`;
                divStatus.classList.remove('hidden');
            } else {
                divStatus.className = "mt-3 p-2.5 rounded-lg text-xs font-semibold flex items-center gap-2 border bg-emerald-500/20 border-emerald-500/50 text-emerald-300";
                divStatus.innerHTML = `<i class="fa-solid fa-circle-check text-base"></i><span>Locação Disponível para uso!</span>`;
                divStatus.classList.remove('hidden');
            }
        }

        // CÂMERA AO VIVO COM HTML5-QRCODE (MODO ESCANEAMENTO CONTÍNUO)
        async function abrirModalCamera() {
            document.getElementById('modal-camera').classList.remove('hidden');
            document.getElementById('cam-loading').style.display = 'flex';
            setTimeout(iniciarScannerHtml5, 300);
        }

        async function iniciarScannerHtml5() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }
            
            const config = { 
                fps: 20, 
                qrbox: { width: 280, height: 180 },
                aspectRatio: 1.0,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess, 
                    () => {}
                );
                document.getElementById('cam-loading').style.display = 'none';
            } catch (err) {
                try {
                    await html5QrCode.start(
                        { facingMode: "user" }, 
                        config, 
                        onScanSuccess, 
                        () => {}
                    );
                    document.getElementById('cam-loading').style.display = 'none';
                } catch (e) {
                    document.getElementById('cam-loading').innerHTML = `<span>Erro ao aceder à câmara. Verifique as permissões.</span>`;
                }
            }
        }

        function onScanSuccess(decodedText) {
            const codigo = decodedText.toUpperCase();
            document.getElementById('input-codigo').value = codigo;
            document.getElementById('btn-clear-code').classList.remove('hidden');
            
            const itemExistente = baseDados.find(i => (i.codigo || i["Código de Barras"] || "").toUpperCase() === codigo);
            if (itemExistente) {
                const locOcupada = itemExistente.locacao || itemExistente["Locação"] || "S/L";
                document.getElementById('txt-alerta-sku').innerText = `ITEM JÁ CADASTRADO! Localizado em: ${locOcupada}`;
                document.getElementById('alert-sku-duplicado').classList.remove('hidden');
            } else {
                document.getElementById('alert-sku-duplicado').classList.add('hidden');
            }

            fecharModalCamera();
            document.getElementById('input-rua').focus();
        }

        async function reiniciarCamera() {
            if (html5QrCode) { try { await html5QrCode.stop(); } catch(e) {} }
            document.getElementById('cam-loading').style.display = 'flex';
            iniciarScannerHtml5();
        }

        async function fecharModalCamera() {
            if (html5QrCode) { try { await html5QrCode.stop(); } catch (e) {} }
            document.getElementById('modal-camera').classList.add('hidden');
        }

        function mudarAba(aba) {
            const viewColetar = document.getElementById('view-coletar');
            const viewEstoque = document.getElementById('view-estoque');
            const navColetar = document.getElementById('nav-coletar');
            const navEstoque = document.getElementById('nav-estoque');

            if (aba === 'coletar') {
                viewColetar.classList.remove('hidden');
                viewEstoque.classList.add('hidden');
                viewEstoque.classList.remove('flex');

                navColetar.className = "py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40";
                navEstoque.className = "py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 text-gray-400";
                focarInputCodigo();
            } else {
                viewColetar.classList.add('hidden');
                viewEstoque.classList.remove('hidden');
                viewEstoque.classList.add('flex');

                navEstoque.className = "py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40";
                navColetar.className = "py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 text-gray-400";
                renderizarEstoque();
            }
        }

        function processarFotoOtimizada(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > 600) {
                            height = Math.round((height * 600) / width);
                            width = 600;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        fotoBase64 = canvas.toDataURL('image/jpeg', 0.4);
                        document.getElementById('img-preview').src = fotoBase64;
                        document.getElementById('container-preview-foto').classList.remove('hidden');
                        document.getElementById('btn-foto-trigger').classList.add('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removerFoto() {
            fotoBase64 = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('container-preview-foto').classList.add('hidden');
            document.getElementById('btn-foto-trigger').classList.remove('hidden');
            document.getElementById('input-foto-arquivo').value = "";
        }

        async function carregarDadosServidor(mostrarCarregando = true) {
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    baseDados = data;
                    preencherFiltroRuas();
                    renderizarEstoque();
                    
                    const badge = document.getElementById('status-badge');
                    badge.className = "flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold";
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                    document.getElementById('status-text').innerText = "ONLINE";
                }
            } catch (err) {
                if (mostrarCarregando) {
                    const badge = document.getElementById('status-badge');
                    badge.className = "flex items-center gap-1.5 bg-red-500/10 border border-red-500/30 text-red-400 text-xs px-2.5 py-1 rounded-full font-semibold";
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-red-500";
                    document.getElementById('status-text').innerText = "ERRO SINC";
                }
            }
        }

        async function salvarColeta() {
            const rua = document.getElementById('input-rua').value.trim();
            const pos = document.getElementById('input-posicao').value.trim();
            const codigo = document.getElementById('input-codigo').value.trim().toUpperCase();
            const obs = document.getElementById('input-obs').value.trim();
            const locacao = getLocacaoFormatada();

            if (!rua || !pos || !codigo) {
                alert("Preencha Rua, Posição e Código de Barras.");
                return;
            }

            const itemExistente = baseDados.find(i => (i.codigo || i["Código de Barras"] || "").toUpperCase() === codigo);
            if (itemExistente) {
                const locOcupada = itemExistente.locacao || itemExistente["Locação"] || "S/L";
                alert(`BLOQUEADO: Este item já está cadastrado na locação ${locOcupada}! Não é permitido duplicar.`);
                return;
            }

            const payload = {
                action: "insert",
                codigo: codigo,
                localizacao: rua,
                posicao: pos,
                locacao: locacao,
                foto: fotoBase64,
                obs: obs
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('input-codigo').value = "";
                document.getElementById('input-posicao').value = "";
                document.getElementById('input-obs').value = "";
                document.getElementById('alert-sku-duplicado').classList.add('hidden');
                document.getElementById('alert-locacao-status').classList.add('hidden');
                removerFoto();
                focarInputCodigo();
                carregarDadosServidor(false);
                alert("Lançamento salvo com sucesso!");
            } catch (e) {
                alert("Erro ao salvar lançamento.");
            }
        }

        async function excluirItem(codigoItem) {
            if (!confirm(`Tem certeza que deseja excluir o item ${codigoItem}? Ele será removido da planilha.`)) return;

            const payload = {
                action: "delete",
                codigo: codigoItem
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                carregarDadosServidor(false);
                alert("Item excluído com sucesso!");
            } catch (e) {
                alert("Erro ao excluir item.");
            }
        }

        function abrirModalEditar(codigo, ruaAtual, posAtual, obsAtual) {
            document.getElementById('edit-id-original').value = codigo;
            document.getElementById('edit-codigo').value = codigo;
            document.getElementById('edit-rua').value = ruaAtual || "";
            document.getElementById('edit-posicao').value = posAtual || "";
            document.getElementById('edit-obs').value = obsAtual || "";
            document.getElementById('modal-editar').classList.remove('hidden');
        }

        function fecharModalEditar() {
            document.getElementById('modal-editar').classList.add('hidden');
        }

        async function salvarEdicao() {
            const codigoOriginal = document.getElementById('edit-id-original').value;
            const novoCodigo = document.getElementById('edit-codigo').value.trim().toUpperCase();
            const rua = document.getElementById('edit-rua').value.trim().toUpperCase();
            const pos = document.getElementById('edit-posicao').value.trim();
            const obs = document.getElementById('edit-obs').value.trim();

            if (!rua || !pos || !novoCodigo) {
                alert("Preencha todos os campos obrigatórios.");
                return;
            }

            let numPos = parseInt(pos, 10);
            let locacao = `${rua}-${String(numPos).padStart(3, '0')}`;

            const payload = {
                action: "update",
                codigoOriginal: codigoOriginal,
                codigo: novoCodigo,
                localizacao: rua,
                posicao: pos,
                locacao: locacao,
                obs: obs
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                fecharModalEditar();
                carregarDadosServidor(false);
                alert("Alterações salvas com sucesso!");
            } catch (e) {
                alert("Erro ao atualizar o item.");
            }
        }

        function preencherFiltroRuas() {
            const select = document.getElementById('select-filtro-rua');
            const valorAtual = select.value;
            select.innerHTML = '<option value="TODAS">TODAS AS RUAS</option>';
            const ruasSet = new Set();
            baseDados.forEach(item => {
                const loc = item.locacao || item["Locação"] || "";
                if (loc.startsWith("R")) ruasSet.add(loc.split("-")[0]);
            });
            Array.from(ruasSet).sort().forEach(rua => {
                const opt = document.createElement('option');
                opt.value = rua; opt.text = `RUA ${rua}`;
                select.appendChild(opt);
            });
            select.value = valorAtual;
        }

        function renderizarEstoque() {
            const container = document.getElementById('lista-estoque');
            const filtroRua = document.getElementById('select-filtro-rua').value;
            container.innerHTML = "";

            let itensFiltrados = baseDados.filter(i => {
                const loc = i.locacao || i["Locação"] || "";
                return filtroRua === "TODAS" || loc.startsWith(filtroRua);
            });

            document.getElementById('total-itens-contador').innerText = `${itensFiltrados.length} ITENS`;

            itensFiltrados.forEach(item => {
                const codigo = item.codigo || item["Código de Barras"] || "SEM CÓDIGO";
                const locacao = item.locacao || item["Locação"] || "S/L";
                const foto = item.foto || item["Foto do produto"] || "";
                const obs = item.obs || item["OBS ADICIONAL"] || "";
                const ruaVal = item.localizacao || locacao.split("-")[0] || "";
                const posVal = item.posicao || (locacao.split("-")[1] ? locacao.split("-")[1].replace(/^0+/, '') : "");

                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-3 flex items-center justify-between gap-3 shadow-xl";
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden flex-1">
                        ${foto ? `<img src="${foto}" class="w-10 h-10 rounded-lg object-cover border border-slate-700">` : '<div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-600"><i class="fa-solid fa-box"></i></div>'}
                        <div class="truncate flex-1">
                            <span class="bg-atag-accent/20 border border-atag-accent/40 text-atag-accent text-[11px] font-black px-2 py-0.5 rounded">${locacao}</span>
                            <p class="font-mono font-extrabold text-xs text-white truncate mt-1">${codigo}</p>
                            ${obs ? `<p class="text-[10px] text-gray-400 truncate">${obs}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="abrirModalEditar('${codigo}', '${ruaVal}', '${posVal}', '${obs}')" class="bg-slate-800 hover:bg-slate-700 text-atag-accent p-2 rounded-lg text-xs" title="Editar">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="excluirItem('${codigo}')" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 p-2 rounded-lg text-xs" title="Excluir">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportarRelatorioCSV() {
            let csv = "data:text/csv;charset=utf-8,\uFEFFCódigo;Locação;Observação\n";
            baseDados.forEach(i => {
                csv += `"${i.codigo || ''}";"${i.locacao || ''}";"${i.obs || ''}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `Relatorio_ATAG_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleModoVisao() {
            modoVisaoCompacto = !modoVisaoCompacto;
            document.getElementById('text-modo-visao').innerText = modoVisaoCompacto ? "Confortável" : "Compacto";
            renderizarEstoque();
        }
    </script>
</body>

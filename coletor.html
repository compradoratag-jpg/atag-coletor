<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Coletor Industrial</title>
    
    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATAG Coletor">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- HTML5-QRCode Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: 'rgba(30, 41, 59, 0.92)',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('atag_logo.png');
            background-repeat: no-repeat;
            background-position: 65% center;
            background-size: 55% auto; 
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 1024px) {
            body::before {
                background-position: center center;
                background-size: 80% auto;
                opacity: 0.06;
            }
        }

        .glass-card {
            background-color: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .atag-logo-glow {
            filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.25));
        }

        input:focus, textarea:focus, select:focus {
            border-color: #38BDF8 !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35), 0 0 12px rgba(56, 189, 248, 0.25) !important;
            outline: none;
            transform: scale(1.005);
            transition: all 0.15s ease-in-out;
        }

        .input-success {
            border-color: #22C55E !important;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25) !important;
        }

        .input-warning {
            border-color: #F59E0B !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25) !important;
        }

        .btn-salvo-sucesso {
            background-color: #22C55E !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6) !important;
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }

        #interactive video, #qr-reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0.75rem;
        }

        .laser-line {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, rgba(229,62,62,0.1) 0%, rgba(239,68,68,1) 50%, rgba(229,62,62,0.1) 100%);
            box-shadow: 0 0 12px #EF4444, 0 0 4px #EF4444;
            z-index: 10;
            animation: scanLine 2s infinite ease-in-out;
        }

        @keyframes scanLine {
            0%, 100% { transform: translateY(-45px); opacity: 0.4; }
            50% { transform: translateY(45px); opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        #qr-reader {
            border: none !important;
            background: black;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        #qr-reader__scan_region {
            background: black;
        }
        #qr-reader__scan_region video {
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased relative z-10">

    <header class="glass-card border-b border-atag-border p-3 px-4 sticky top-0 z-30 shadow-xl">
        <div class="max-w-md lg:max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="atag_logo.png" alt="Logo ATAG" class="h-9 w-auto atag-logo-glow">
                <div>
                    <h1 class="text-xs font-bold text-gray-200 uppercase tracking-wider leading-none">Coletor Industrial</h1>
                    <p class="text-[10px] text-gray-400 font-medium">Dourados - MS <span class="hidden lg:inline text-atag-accent font-semibold ml-2">| Sincronização em Tempo Real</span></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="hidden lg:flex items-center gap-2 text-[11px] text-gray-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">
                    <span>Atalhos: <kbd class="bg-slate-800 text-atag-accent px-1.5 py-0.5 rounded font-mono font-bold">F2</kbd> Bipe | <kbd class="bg-slate-800 text-atag-accent px-1.5 py-0.5 rounded font-mono font-bold">ENTER</kbd> Salvar</span>
                </div>
                <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="status-text">ONLINE</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-md lg:max-w-6xl w-full mx-auto p-4 pb-20 lg:pb-4 flex flex-col gap-4 relative z-10">
        <div class="lg:grid lg:grid-cols-12 lg:gap-6 lg:items-start">

            <section id="view-coletar" class="lg:col-span-5 flex flex-col gap-4">
                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block flex justify-between items-center">
                        <span>1. Código de Barras / SKU</span>
                        <i class="fa-solid fa-barcode text-atag-accent text-sm"></i>
                    </label>

                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input type="text" id="input-codigo" placeholder="Bipe no coletor ou digite..." autofocus
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-3 pr-8 py-3 font-mono font-bold text-base text-white transition-all uppercase">
                            <button id="btn-clear-code" onclick="limparCodigo()" class="hidden absolute right-2.5 top-3 text-gray-400 hover:text-white">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                        </div>
                        <button onclick="abrirModalCamera()" class="bg-atag-accent/20 border border-atag-accent/50 text-atag-accent hover:bg-atag-accent/30 px-4 rounded-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
                            <i class="fa-solid fa-camera text-lg"></i>
                            <span class="text-xs uppercase hidden sm:inline">Câmara</span>
                        </button>
                    </div>

                    <div id="alert-sku" class="hidden p-2.5 rounded-lg text-xs font-medium flex items-start gap-2 border"></div>
                </div>

                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block flex justify-between items-center">
                        <span>2. Endereçamento (Locação)</span>
                        <span id="locacao-completa" class="text-atag-accent font-extrabold text-sm">R00-000</span>
                    </label>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="text-[11px] text-gray-400 mb-1 block font-medium">Rua (Ex: R01)</span>
                            <div class="relative">
                                <input type="text" id="input-rua" placeholder="R01" maxlength="3" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase transition-all">
                            </div>
                        </div>
                        <div>
                            <span class="text-[11px] text-gray-400 mb-1 block font-medium">Posição (001 - 2000)</span>
                            <div class="relative">
                                <input type="text" id="input-posicao" placeholder="001" inputmode="numeric" maxlength="4"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-center font-bold text-lg text-white uppercase transition-all">
                            </div>
                        </div>
                    </div>

                    <div id="alert-locacao" class="hidden mt-3 p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border"></div>
                </div>

                <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block">3. Opcionais (Foto & Observação)</label>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative">
                            <label for="input-foto-arquivo" id="btn-foto-trigger" class="w-full bg-slate-900 border border-dashed border-slate-700 hover:border-atag-accent rounded-lg p-3 flex flex-col items-center justify-center gap-1.5 transition-all cursor-pointer">
                                <i class="fa-solid fa-camera-retro text-gray-400 text-lg" id="icon-foto"></i>
                                <span class="text-xs font-medium text-gray-300" id="text-foto">Anexar Foto</span>
                            </label>
                            <input type="file" id="input-foto-arquivo" accept="image/*" capture="environment" class="hidden" onchange="processarFotoArquivo(this)">
                        </div>

                        <div id="container-preview-foto" class="relative hidden bg-slate-900 rounded-lg border border-slate-700 overflow-hidden flex items-center justify-center">
                            <img id="img-preview" class="h-20 w-full object-cover" src="" alt="Preview">
                            <button onclick="removerFoto()" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div class="col-span-1">
                            <textarea id="input-obs" rows="2" placeholder="Observações..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white placeholder-gray-500 resize-none h-full"></textarea>
                        </div>
                    </div>
                </div>

                <div class="hidden lg:block">
                    <button onclick="salvarColeta()" id="btn-salvar-desktop" class="w-full py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 bg-atag-red hover:bg-atag-redDark text-white shadow-xl active:scale-95 transition-all uppercase tracking-wider">
                        <i class="fa-solid fa-floppy-disk text-lg" id="icon-btn-salvar-desktop"></i>
                        <span id="text-btn-salvar-desktop">Salvar Lançamento (Enter)</span>
                    </button>
                </div>
            </section>

            <section id="view-estoque" class="lg:col-span-7 flex flex-col gap-3 mt-4 lg:mt-0">
                <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex flex-col gap-3">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-boxes-stacked text-atag-accent"></i>
                            <span class="text-xs font-bold text-gray-200 uppercase tracking-wider">Consulta em Tempo Real</span>
                        </div>
                        
                        <button onclick="exportarRelatorioCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow transition-all active:scale-95 flex-shrink-0">
                            <i class="fa-solid fa-file-excel text-sm"></i>
                            <span>Exportar Relatório</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700/50">
                        <button onclick="toggleModoVisao()" id="btn-modo-visao" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-gray-300 px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all">
                            <i class="fa-solid fa-grip-lines text-atag-accent"></i>
                            <span id="text-modo-visao">Compacto</span>
                        </button>

                        <select id="select-filtro-rua" onchange="renderizarEstoque()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-atag-accent text-center">
                            <option value="TODAS">TODAS AS RUAS</option>
                        </select>
                    </div>

                    <div class="flex justify-between items-center text-[11px] text-gray-400 border-t border-slate-700/50 pt-2 font-medium">
                        <span>ORGANIZADO POR POSIÇÃO</span>
                        <span id="total-itens-contador" class="text-atag-accent font-bold">1 ITENS</span>
                    </div>
                </div>

                <div id="lista-estoque" class="flex flex-col gap-2.5 pb-20 lg:pb-0 lg:max-h-[calc(100vh-220px)] lg:overflow-y-auto lg:pr-1"></div>
            </section>
        </div>
    </main>

    <footer class="lg:hidden glass-card border-t border-atag-border p-2 fixed bottom-0 left-0 right-0 z-30 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <button onclick="mudarAba('coletar')" id="nav-coletar" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40 shadow">
                <i class="fa-solid fa-qrcode text-base"></i>
                <span>COLETAR</span>
            </button>
            <button onclick="salvarColeta()" id="btn-salvar" class="py-2.5 rounded-xl font-extrabold text-xs flex flex-col items-center gap-1 bg-atag-red hover:bg-atag-redDark text-white shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-floppy-disk text-base" id="icon-btn-salvar-mobile"></i>
                <span id="text-btn-salvar-mobile">SALVAR</span>
            </button>
            <button onclick="mudarAba('estoque')" id="nav-estoque" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 text-gray-400 hover:bg-slate-800/50 transition-all relative">
                <i class="fa-solid fa-boxes-stacked text-base"></i>
                <span>ESTOQUE</span>
                <span id="badge-estoque-count" class="absolute top-1 right-4 bg-atag-accent text-slate-950 font-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </footer>

    <div id="modal-camera" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col justify-between p-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-barcode text-atag-accent text-lg"></i>
                <span class="font-bold text-sm text-white uppercase tracking-wider">Leitor por Câmara</span>
            </div>
            <button onclick="fecharModalCamera()" class="bg-slate-800 hover:bg-slate-700 text-gray-300 w-9 h-9 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="relative my-auto w-full max-w-sm mx-auto aspect-square bg-black rounded-2xl border-2 border-atag-accent/40 overflow-hidden shadow-2xl flex items-center justify-center">
            <div id="qr-reader" class="w-full h-full"></div>
            <div class="laser-line"></div>
        </div>

        <div class="flex flex-col gap-3 glass-card border border-atag-border p-3.5 rounded-xl max-w-sm mx-auto w-full">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-1">
                    <i class="fa-solid fa-video text-atag-accent text-xs"></i>
                    <select id="select-camera" onchange="trocarCamera(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold text-white">
                        <option value="">Carregando Câmeras...</option>
                    </select>
                </div>
                
                <button id="btn-torch" onclick="toggleTorch()" class="bg-slate-900 border border-slate-700 hover:border-amber-400 text-amber-400 px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span id="torch-text">Luz</span>
                </button>
            </div>
            <p class="text-[11px] text-gray-400 text-center font-medium">Aproxime o código do retângulo central.</p>
        </div>
    </div>

    <div id="modal-editar" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card border border-atag-border rounded-xl w-full max-w-md p-4 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-sm font-bold text-white uppercase">Editar Item</h3>
                <button onclick="fecharModalEditar()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <input type="hidden" id="edit-id">
            
            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase">Código de Barras</label>
                    <input type="text" id="edit-codigo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Rua</label>
                        <input type="text" id="edit-rua" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase">Posição</label>
                        <input type="number" id="edit-posicao" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white uppercase mt-1">
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase">Observação</label>
                    <textarea id="edit-obs" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mt-1 resize-none"></textarea>
                </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-slate-700">
                <button onclick="fecharModalEditar()" class="flex-1 bg-slate-800 text-gray-300 py-2.5 rounded-lg text-xs font-bold">Cancelar</button>
                <button onclick="salvarEdicaoItem()" class="flex-1 bg-atag-accent text-slate-950 py-2.5 rounded-lg text-xs font-black uppercase">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-foto" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4" onclick="fecharModalFoto()">
        <img id="img-zoom" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain" src="" alt="Zoom">
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseDados = [];
        let fotoBase64 = "";
        let html5QrCode = null;
        let cameraAtualId = null;
        let isTorchOn = false;
        let modoVisaoCompacto = false;

        function tocarSom(tipo) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (tipo === 'sucesso') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.value = 1400;
                    gain.gain.value = 0.2;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                    if (navigator.vibrate) navigator.vibrate(80);
                } else if (tipo === 'alerta') {
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = "sawtooth";
                    osc1.frequency.value = 350;
                    gain1.gain.value = 0.3;
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start();
                    osc1.stop(ctx.currentTime + 0.15);
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            } catch(e) {}
        }

        window.onload = function() {
            carregarDadosServidor(true);
            focarInputCodigo();
            setInterval(() => { carregarDadosServidor(false); }, 4000);

            window.addEventListener('keydown', function(e) {
                if (e.key === 'F2' || (e.key === 'Escape' && document.getElementById('modal-camera').classList.contains('hidden'))) {
                    e.preventDefault();
                    focarInputCodigo();
                }
                if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && document.getElementById('modal-editar').classList.contains('hidden') && document.getElementById('modal-camera').classList.contains('hidden')) {
                    if (e.target.id === 'input-codigo' && e.target.value.trim() !== '') {
                        e.preventDefault();
                        document.getElementById('input-rua').focus();
                        document.getElementById('input-rua').select();
                    } else if (document.getElementById('input-codigo').value && document.getElementById('input-rua').value && document.getElementById('input-posicao').value) {
                        e.preventDefault();
                        salvarColeta();
                    }
                }
            });

            document.getElementById('input-rua').addEventListener('input', function(e) {
                let val = e.target.value.toUpperCase().replace(/[^R0-9]/g, '');
                if (val.length > 0 && !val.startsWith('R')) val = 'R' + val.replace(/R/g, '');
                e.target.value = val;
                atualizarLocacaoCompleta();
                if (val.length === 3) document.getElementById('input-posicao').focus();
            });

            document.getElementById('input-posicao').addEventListener('input', function(e) {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 4) val = val.substring(0, 4);
                e.target.value = val;
                atualizarLocacaoCompleta();
            });

            document.getElementById('input-codigo').addEventListener('input', function(e) {
                e.target.value = e.target.value.toUpperCase();
                const btnClear = document.getElementById('btn-clear-code');
                if (e.target.value) btnClear.classList.remove('hidden');
                else btnClear.classList.add('hidden');
                validarSKUDuplicado();
            });
        };

        function focarInputCodigo() {
            const inputCod = document.getElementById('input-codigo');
            if (inputCod) { inputCod.focus(); inputCod.select(); }
        }

        function toggleModoVisao() {
            modoVisaoCompacto = !modoVisaoCompacto;
            document.getElementById('text-modo-visao').innerText = modoVisaoCompacto ? "Confortável" : "Compacto";
            renderizarEstoque();
        }

        function getLocacaoFormatada() {
            let rua = document.getElementById('input-rua').value.trim().toUpperCase();
            let pos = document.getElementById('input-posicao').value.trim();
            if (!rua) return "";
            if (rua.length === 2 && !isNaN(rua[1])) rua = 'R0' + rua[1];
            if (pos) {
                let numPos = parseInt(pos, 10);
                if (!isNaN(numPos) && numPos >= 1 && numPos <= 2000) return `${rua}-${String(numPos).padStart(3, '0')}`;
            }
            return rua;
        }

        function atualizarLocacaoCompleta() {
            const loc = getLocacaoFormatada();
            document.getElementById('locacao-completa').innerText = loc || "R00-000";
            validarLocacaoOcupada();
        }

        function limparCodigo() {
            document.getElementById('input-codigo').value = "";
            document.getElementById('btn-clear-code').classList.add('hidden');
            validarSKUDuplicado();
            focarInputCodigo();
        }

        async function carregarDadosServidor(mostrarCarregando = true) {
            if (mostrarCarregando) setOnlineStatus(false, "CARREGANDO...");
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    if (JSON.stringify(baseDados) !== JSON.stringify(data)) {
                        baseDados = data;
                        preencherFiltroRuas();
                        renderizarEstoque();
                        validarLocacaoOcupada();
                        validarSKUDuplicado();
                    }
                    setOnlineStatus(true, "ONLINE");
                }
            } catch (err) {
                if (mostrarCarregando) setOnlineStatus(false, "ERRO SINC");
            }
        }

        function setOnlineStatus(online, text) {
            const badge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            statusText.innerText = text;
            badge.className = online 
                ? "flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold"
                : "flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold";
        }

        function validarLocacaoOcupada() {
            const loc = getLocacaoFormatada();
            const alertBox = document.getElementById('alert-locacao');
            if (!loc || loc.length < 7) { alertBox.classList.add('hidden'); return; }

            const itemExistente = baseDados.find(i => (i.locacao || i["Locação"] || "") === loc);
            if (itemExistente) {
                const sku = itemExistente.codigo || itemExistente["Código de Barras"] || "SKU Indefinido";
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border bg-amber-500/10 border-amber-500/30 text-amber-300 mt-3";
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i> <span>Atenção: Locação <b>${loc}</b> já possui o SKU: <b>${sku}</b></span>`;
                alertBox.classList.remove('hidden');
                tocarSom('alerta');
            } else {
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-center gap-2 border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 mt-3";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i> <span>Locação <b>${loc}</b> livre.</span>`;
                alertBox.classList.remove('hidden');
            }
        }

        function validarSKUDuplicado() {
            const cod = document.getElementById('input-codigo').value.trim().toUpperCase();
            const alertBox = document.getElementById('alert-sku');
            if (!cod) { alertBox.classList.add('hidden'); return; }

            const repetidos = baseDados.filter(i => String(i.codigo || i["Código de Barras"] || "").trim().toUpperCase() === cod);
            if (repetidos.length > 0) {
                const locs = repetidos.map(r => r.locacao || r["Locação"] || "S/L").join(", ");
                alertBox.className = "p-2.5 rounded-lg text-xs font-medium flex items-start gap-2 border bg-sky-500/10 border-sky-500/30 text-sky-300";
                alertBox.innerHTML = `<i class="fa-solid fa-info-circle text-sky-400 text-sm mt-0.5"></i> <span>SKU bipado <b>${repetidos.length}x</b> nas locações: <b>${locs}</b></span>`;
                alertBox.classList.remove('hidden');
                tocarSom('alerta');
            } else {
                alertBox.classList.add('hidden');
            }
        }

        async function salvarColeta() {
            const rua = document.getElementById('input-rua').value.trim();
            const pos = document.getElementById('input-posicao').value.trim();
            const codigo = document.getElementById('input-codigo').value.trim().toUpperCase();
            const obs = document.getElementById('input-obs').value.trim();
            const locacao = getLocacaoFormatada();

            if (!rua || rua.length !== 3 || !pos || !codigo) {
                alert("Preencha Rua, Posição e Código de Barras.");
                tocarSom('alerta');
                return;
            }

            const payload = { action: "insert", codigo, localizacao: rua, posicao: pos, locacao, foto: fotoBase64, obs };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                tocarSom('sucesso');
                document.getElementById('input-codigo').value = "";
                document.getElementById('input-posicao').value = "";
                document.getElementById('input-obs').value = "";
                removerFoto();
                focarInputCodigo();
                carregarDadosServidor(false);
            } catch (e) {
                alert("Erro ao salvar lançamento.");
            }
        }

        function preencherFiltroRuas() {
            const select = document.getElementById('select-filtro-rua');
            const valorAtual = select.value;
            select.innerHTML = '<option value="TODAS">TODAS AS RUAS</option>';
            const ruasSet = new Set();
            baseDados.forEach(item => {
                const loc = item.locacao || item["Locação"] || "";
                if (loc.startsWith("R")) ruasSet.add(loc.split("-")[0]);
            });
            Array.from(ruasSet).sort().forEach(rua => {
                const opt = document.createElement('option');
                opt.value = rua; opt.text = `RUA ${rua}`;
                select.appendChild(opt);
            });
            select.value = valorAtual;
        }

        function renderizarEstoque() {
            const container = document.getElementById('lista-estoque');
            const filtroRua = document.getElementById('select-filtro-rua').value;
            container.innerHTML = "";

            let itensFiltrados = baseDados.filter(i => {
                const loc = i.locacao || i["Locação"] || "";
                return filtroRua === "TODAS" || loc.startsWith(filtroRua);
            });

            document.getElementById('total-itens-contador').innerText = `${itensFiltrados.length} ITENS`;

            itensFiltrados.forEach(item => {
                const codigo = item.codigo || item["Código de Barras"] || "SEM CÓDIGO";
                const locacao = item.locacao || item["Locação"] || "S/L";
                const foto = item.foto || item["Foto do produto"] || "";
                const obs = item.obs || item["OBS ADICIONAL"] || "";

                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-3 flex items-center justify-between gap-3 shadow-xl";
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        ${foto ? `<img src="${foto}" onclick="abrirFotoZoom('${foto}')" class="w-10 h-10 rounded-lg object-cover border border-slate-700 cursor-pointer">` : '<div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-gray-600"><i class="fa-solid fa-box"></i></div>'}
                        <div class="truncate">
                            <span class="bg-atag-accent/20 border border-atag-accent/40 text-atag-accent text-[11px] font-black px-2 py-0.5 rounded">${locacao}</span>
                            <p class="font-mono font-extrabold text-xs text-white truncate mt-1">${codigo}</p>
                            ${obs ? `<p class="text-[10px] text-gray-400 truncate">${obs}</p>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportarRelatorioCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFCódigo;Locação;Observação\n";
            baseDados.forEach(i => {
                csvContent += `"${i.codigo || ''}";"${i.locacao || ''}";"${i.obs || ''}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `Relatorio_ATAG_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function processarFotoArquivo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result;
                    document.getElementById('img-preview').src = fotoBase64;
                    document.getElementById('container-preview-foto').classList.remove('hidden');
                    document.getElementById('btn-foto-trigger').classList.add('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removerFoto() {
            fotoBase64 = "";
            document.getElementById('container-preview-foto').classList.add('hidden');
            document.getElementById('btn-foto-trigger').classList.remove('hidden');
        }

        function abrirModalCamera() { document.getElementById('modal-camera').classList.remove('hidden'); }
        function fecharModalCamera() { document.getElementById('modal-camera').classList.add('hidden'); }
        function abrirFotoZoom(src) {
            document.getElementById('img-zoom').src = src;
            document.getElementById('modal-foto').classList.remove('hidden');
        }
        function fecharModalFoto() { document.getElementById('modal-foto').classList.add('hidden'); }
    </script>
</body>
</html>

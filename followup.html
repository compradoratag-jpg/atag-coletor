<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Gestão de Cargas & Transportes</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATAG Cargas">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: 'rgba(30, 41, 59, 0.92)',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('atag_logo.png');
            background-repeat: no-repeat;
            background-position: 65% center;
            background-size: 55% auto; 
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        @media (max-width: 1024px) {
            body::before { background-position: center center; background-size: 80% auto; opacity: 0.06; }
        }
        .glass-card {
            background-color: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .atag-logo-glow { filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.25)); }
        input:focus, textarea:focus, select:focus {
            border-color: #38BDF8 !important;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35), 0 0 12px rgba(56, 189, 248, 0.25) !important;
            outline: none;
            transform: scale(1.005);
            transition: all 0.15s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased relative z-10">

    <!-- HEADER BARRA SUPERIOR FIXA -->
    <header class="glass-card border-b border-atag-border p-3 px-4 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-md lg:max-w-7xl mx-auto flex justify-between items-center flex-wrap gap-2">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="bg-slate-800 hover:bg-slate-700 text-atag-accent border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 shadow">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                    <span class="hidden sm:inline">Módulos</span>
                </a>
                <img src="atag_logo.png" alt="Logo ATAG" class="h-8 w-auto atag-logo-glow">
                <div>
                    <h1 class="text-xs font-bold text-gray-200 uppercase tracking-wider leading-none">Gestão de Cargas & Transportes</h1>
                    <p class="text-[10px] text-gray-400 font-medium">ATAG Auto Peças <span class="text-atag-accent ml-1">| Nuvem Planilha</span></p>
                </div>
            </div>

            <!-- MENU NAVEGAÇÃO SUPERIOR -->
            <div class="flex items-center gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button onclick="mudarAba('cargas')" id="nav-desk-cargas" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40"><i class="fa-solid fa-truck-fast mr-1"></i> Cargas & NF-e</button>
                <button onclick="mudarAba('transp')" id="nav-desk-transp" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white"><i class="fa-solid fa-address-book mr-1"></i> Transportadoras</button>
            </div>

            <div class="flex items-center gap-3">
                <div id="status-badge" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="status-text">ONLINE</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md lg:max-w-7xl w-full mx-auto p-4 pb-24 lg:pb-6 flex flex-col gap-4 relative z-10">

        <!-- MÓDULO 1: CARGAS & FOLLOW-UP -->
        <section id="view-cargas" class="flex flex-col gap-4">
            
            <!-- PAINEL DE ESTATÍSTICAS RÁPIDAS -->
            <div class="grid grid-cols-3 gap-3">
                <div class="glass-card border border-atag-border rounded-xl p-3 text-center shadow">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Em Trânsito</span>
                    <span id="stat-transito" class="text-xl font-black text-amber-400 mt-1 block">0</span>
                </div>
                <div class="glass-card border border-atag-border rounded-xl p-3 text-center shadow">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Pendentes / Atrasadas</span>
                    <span id="stat-pendentes" class="text-xl font-black text-atag-red mt-1 block">0</span>
                </div>
                <div class="glass-card border border-atag-border rounded-xl p-3 text-center shadow">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Entregues</span>
                    <span id="stat-entregues" class="text-xl font-black text-emerald-400 mt-1 block">0</span>
                </div>
            </div>

            <!-- LAYOUT LADO A LADO NO DESKTOP -->
            <div class="lg:grid lg:grid-cols-12 lg:gap-6 lg:items-start">

                <!-- COLUNA ESQUERDA FIXA: FORMULÁRIO DE LANÇAMENTO (STICKY) -->
                <div class="lg:col-span-4 flex flex-col gap-4 mb-4 lg:mb-0 lg:sticky lg:top-20 z-20">
                    <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3 max-h-[calc(100vh-100px)] overflow-y-auto">
                        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                            <h3 class="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                                <i class="fa-solid fa-square-plus text-atag-accent"></i>
                                Registrar Carga / Pedido
                            </h3>
                            <span class="text-[10px] bg-atag-accent/20 text-atag-accent px-2 py-0.5 rounded font-bold">NOVO</span>
                        </div>

                        <div class="flex flex-col gap-3">
                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase">NF / Nº Pedido *</label>
                                <input type="text" id="reg-nf" placeholder="EX: NF 45892 OU PED 1092" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase mt-1 font-mono font-bold">
                            </div>

                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase">Origem / Fornecedor *</label>
                                <input type="text" id="reg-origem" placeholder="EX: SCHADEK, NGK, FORNECEDOR SP..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase mt-1 font-bold">
                            </div>

                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase flex justify-between items-center">
                                    <span>Destinatário (Filial / Matriz) *</span>
                                </label>
                                <select id="reg-cnpj" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-bold text-atag-accent mt-1">
                                    <option value="09.253.819/0001-35">Matriz (Dourados - 0001-35)</option>
                                    <option value="09.253.819/0002-16">Filial (Campo Grande - 0002-16)</option>
                                </select>
                            </div>

                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase flex justify-between items-center">
                                    <span>Transportadora *</span>
                                    <button onclick="mudarAba('transp')" class="text-[10px] text-atag-accent hover:underline">+ Cadastrar</button>
                                </label>
                                <select id="reg-transp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-bold text-white mt-1">
                                    <option value="">Selecione a transportadora...</option>
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[11px] font-bold text-gray-400 uppercase">Previsão Entrega</label>
                                    <input type="date" id="reg-previsao" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
                                </div>
                                <div>
                                    <label class="text-[11px] font-bold text-gray-400 uppercase">Status Carga</label>
                                    <select id="reg-status" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold text-amber-400 mt-1">
                                        <option value="EM TRÂNSITO">Em Trânsito</option>
                                        <option value="PENDENTE / ATRASADA">Pendente / Atrasada</option>
                                        <option value="ENTREGUE">Entregue</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase">Cód. Rastreio ou Obs.</label>
                                <textarea id="reg-obs" rows="2" placeholder="Digite detalhes adicionais..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1 resize-none"></textarea>
                            </div>

                            <button onclick="salvarNovaCarga()" class="w-full bg-atag-red hover:bg-atag-redDark text-white py-3 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-lg active:scale-95 transition-all mt-1">
                                <i class="fa-solid fa-floppy-disk mr-1"></i> Salvar Carga
                            </button>
                        </div>
                    </div>
                </div>

                <!-- COLUNA DIREITA: LISTA E BUSCA DE CARGAS -->
                <div class="lg:col-span-8 flex flex-col gap-3">
                    <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex flex-col gap-3 sticky top-20 z-10">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div class="flex items-center gap-2 flex-1">
                                <i class="fa-solid fa-magnifying-glass text-atag-accent"></i>
                                <input type="text" id="search-cargas" oninput="renderizarCargas()" placeholder="Buscar por NF, Transportadora, Origem..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white">
                            </div>
                            <div class="flex items-center gap-2">
                                <select id="select-filtro-status" onchange="renderizarCargas()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-bold text-atag-accent">
                                    <option value="TODAS">TODOS OS STATUS</option>
                                    <option value="EM TRÂNSITO">EM TRÂNSITO</option>
                                    <option value="PENDENTE / ATRASADA">PENDENTES</option>
                                    <option value="ENTREGUE">ENTREGUES</option>
                                </select>
                                <button onclick="apagarSelecionadas()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                                    <i class="fa-solid fa-trash-can"></i> Excluir Selecionadas
                                </button>
                                <button onclick="exportarRelatorioCargas()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow">
                                    <i class="fa-solid fa-file-excel"></i> CSV
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-[11px] text-gray-400 border-t border-slate-700/50 pt-2 font-medium">
                            <span>REGISTROS ENCONTRADOS</span>
                            <span id="total-cargas-contador" class="text-atag-accent font-bold">0 CARGAS</span>
                        </div>
                    </div>

                    <div id="lista-cargas" class="flex flex-col gap-2.5">
                        <!-- Injetado Dinamicamente -->
                    </div>
                </div>

            </div>
        </section>

        <!-- MÓDULO 2: TRANSPORTADORAS -->
        <section id="view-transp" class="hidden flex-col gap-3">
            <div class="glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="text-xs font-bold text-white uppercase"><i class="fa-solid fa-truck text-atag-accent mr-1"></i> Cadastrar Nova Transportadora</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input type="text" id="transp-nome" placeholder="Nome da Transportadora..." class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase font-bold">
                    <input type="text" id="transp-site" placeholder="Link do Site de Rastreio..." class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                    <input type="text" id="transp-fone" placeholder="Telefone..." class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                    <input type="text" id="transp-whats" placeholder="WhatsApp..." class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                </div>
                <button onclick="salvarTransportadora()" class="bg-atag-accent hover:bg-sky-400 text-slate-950 py-2.5 rounded-lg font-black text-xs uppercase shadow transition-all">Salvar Transportadora</button>
            </div>

            <div id="lista-transp" class="flex flex-col gap-2.5">
                <!-- Injetado Dinamicamente -->
            </div>
        </section>

    </main>

    <!-- FOOTER NAV BAR (MOBILE) -->
    <footer class="lg:hidden glass-card border-t border-atag-border p-2 fixed bottom-0 left-0 right-0 z-30 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-2 gap-2">
            <button onclick="mudarAba('cargas')" id="nav-mob-cargas" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 bg-slate-800 text-atag-accent border border-atag-accent/40">
                <i class="fa-solid fa-truck-fast text-base"></i>
                <span>CARGAS & NF-E</span>
            </button>
            <button onclick="mudarAba('transp')" id="nav-mob-transp" class="py-2.5 rounded-xl font-bold text-xs flex flex-col items-center gap-1 text-gray-400 hover:bg-slate-800/50">
                <i class="fa-solid fa-address-book text-base"></i>
                <span>TRANSPORTADORAS</span>
            </button>
        </div>
    </footer>

    <!-- TOAST DE NOTIFICAÇÃO DE CÓPIA -->
    <div id="toast-copia" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-2xl z-[80] hidden transition-all">
        Contato copiado para a área de transferência! ✓
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseCargas = [];
        let baseTransp = [];

        window.onload = function() {
            carregarTransportadoras();
            carregarCargas();
            setInterval(() => { carregarCargas(false); }, 6000);
        };

        function copiarTexto(texto) {
            if (!texto || texto === "SEM CONTATO") return;
            navigator.clipboard.writeText(texto).then(() => {
                const toast = document.getElementById('toast-copia');
                toast.classList.remove('hidden');
                setTimeout(() => { toast.classList.add('hidden'); }, 1500);
            });
        }

        function mudarAba(aba) {
            ['cargas', 'transp'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(`view-${aba}`).classList.remove('hidden');

            if (aba === 'cargas') {
                document.getElementById('nav-desk-cargas').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40";
                document.getElementById('nav-desk-transp').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white";
                carregarCargas();
            } else {
                document.getElementById('nav-desk-transp').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40";
                document.getElementById('nav-desk-cargas').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white";
                carregarTransportadoras();
            }
        }

        async function carregarCargas(mostrarLoading = true) {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getFollowUp`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    baseCargas = data;
                    atualizarEstatisticas();
                    renderizarCargas();
                    setOnlineStatus(true, "ONLINE");
                }
            } catch(e) {
                if(mostrarLoading) setOnlineStatus(false, "ERRO SINC");
            }
        }

        async function carregarTransportadoras() {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getTransportadoras`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    baseTransp = data;
                    preencherSelectTransportadoras();
                    renderizarTransportadoras();
                }
            } catch(e) {}
        }

        function preencherSelectTransportadoras() {
            const select = document.getElementById('reg-transp');
            const atual = select.value;
            select.innerHTML = '<option value="">Selecione a transportadora...</option>';
            baseTransp.forEach(t => {
                const nome = t["TRANSPORTADORA"] || "";
                if (nome) {
                    const opt = document.createElement('option');
                    opt.value = nome;
                    opt.text = nome;
                    select.appendChild(opt);
                }
            });
            select.value = atual;
        }

        function setOnlineStatus(online, text) {
            const badge = document.getElementById('status-badge');
            document.getElementById('status-text').innerText = text;
            badge.className = online ? "flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold" : "flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold";
        }

        function atualizarEstatisticas() {
            let transito = 0, pendentes = 0, entregues = 0;
            baseCargas.forEach(i => {
                const status = String(i["Entregue? (checkbox)"] || "").toUpperCase();
                const obs = String(i["OBSERVAÇÕES"] || "").toUpperCase();
                if (status === "TRUE" || status === "SIM" || status === "ENTREGUE") {
                    entregues++;
                } else if (obs.includes("ATRASADA") || obs.includes("PENDENTE")) {
                    pendentes++;
                } else {
                    transito++;
                }
            });
            document.getElementById('stat-transito').innerText = transito;
            document.getElementById('stat-pendentes').innerText = pendentes;
            document.getElementById('stat-entregues').innerText = entregues;
        }

        function parseContatos(texto) {
            if (!texto) return [];
            return texto.split(/[\n,\/]+/).map(s => s.trim()).filter(s => s.length > 2);
        }

        function renderizarCargas() {
            const container = document.getElementById('lista-cargas');
            const search = document.getElementById('search-cargas').value.toLowerCase();
            const filtroStatus = document.getElementById('select-filtro-status').value;
            container.innerHTML = "";

            let itens = baseCargas.filter(i => {
                const nf = String(i["Número da NF"] || i.nf || "");
                const emitente = String(i["Emitente (Razão Social)"] || "").toLowerCase();
                const transp = String(i["Transp."] || "").toLowerCase();
                const statusEntregue = String(i["Entregue? (checkbox)"] || "").toUpperCase();

                let statusAtual = "EM TRÂNSITO";
                if (statusEntregue === "TRUE" || statusEntregue === "SIM" || statusEntregue === "ENTREGUE") {
                    statusAtual = "ENTREGUE";
                }

                const matchText = nf.includes(search) || emitente.includes(search) || transp.includes(search);
                if (!matchText) return false;

                if (filtroStatus !== "TODAS" && statusAtual !== filtroStatus) return false;
                return true;
            });

            document.getElementById('total-cargas-contador').innerText = `${itens.length} CARGAS`;

            if (itens.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500 font-bold text-xs uppercase">Nenhuma carga encontrada.</div>`;
                return;
            }

            itens.forEach(i => {
                const id = i["ID_Registro"] || i.id;
                const nf = i["Número da NF"] || "S/N";
                const emitente = i["Emitente (Razão Social)"] || "Fornecedor";
                const transpNome = i["Transp."] || "Transportadora N/A";
                
                const transpInfo = baseTransp.find(t => String(t["TRANSPORTADORA"] || "").trim().toLowerCase() === String(transpNome).trim().toLowerCase()) || {};
                
                const site = i["SITE"] || transpInfo["SITE"] || "";
                const foneBruto = i["TELEFONE"] || transpInfo["TELEFONE"] || "";
                const whatsBruto = i["WHATS"] || transpInfo["WHATSAPP"] || "";
                const obs = i["OBSERVAÇÕES"] || "";
                const cnpj = i["CNPJ Destinatário"] || "09.253.819/0001-35";
                const statusEntregue = String(i["Entregue? (checkbox)"] || "").toUpperCase();
                const entregue = statusEntregue === "TRUE" || statusEntregue === "SIM" || statusEntregue === "ENTREGUE";

                const listaFones = parseContatos(foneBruto);
                const listaWhats = parseContatos(whatsBruto);

                let filialLabel = "Matriz (Dourados)";
                let cnpjBadgeClass = "bg-sky-500/20 text-sky-300 border-sky-500/40";
                if (cnpj.includes("0002-16")) {
                    filialLabel = "Filial (Campo Grande)";
                    cnpjBadgeClass = "bg-purple-500/20 text-purple-300 border-purple-500/40";
                }

                const card = document.createElement('div');
                card.className = `glass-card border rounded-xl p-3 flex flex-col gap-2.5 shadow-xl animate-fade-in ${entregue ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-atag-border'}`;

                let contatosHtml = '';
                if (listaFones.length > 0 || listaWhats.length > 0) {
                    contatosHtml += `<div class="flex flex-wrap gap-2 text-[11px] bg-slate-900/60 p-2 rounded-lg border border-slate-800">`;
                    
                    if (listaFones.length > 0) {
                        contatosHtml += `
                            <div class="flex items-center gap-1.5 flex-1 min-w-[140px]">
                                <i class="fa-solid fa-phone text-atag-accent"></i>
                                <select onchange="if(this.value) copiarTexto(this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white font-bold w-full">
                                    <option value="">Ligar / Copiar Tel (${listaFones.length})...</option>
                                    ${listaFones.map(f => `<option value="${f}">${f}</option>`).join('')}
                                </select>
                            </div>
                        `;
                    }

                    if (listaWhats.length > 0) {
                        contatosHtml += `
                            <div class="flex items-center gap-1.5 flex-1 min-w-[140px]">
                                <i class="fa-brands fa-whatsapp text-emerald-400"></i>
                                <select onchange="if(this.value) window.open('https://api.whatsapp.com/send?phone=55' + encodeURIComponent(this.value.replace(/\\D/g,'')), '_blank')" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-emerald-300 font-bold w-full">
                                    <option value="">Abrir WhatsApp (${listaWhats.length})...</option>
                                    ${listaWhats.map(w => `<option value="${w}">${w}</option>`).join('')}
                                </select>
                            </div>
                        `;
                    }
                    contatosHtml += `</div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex items-center gap-2.5">
                            <input type="checkbox" value="${id}" class="chk-carga w-4 h-4 accent-atag-red rounded">
                            <span class="bg-atag-accent/20 border border-atag-accent/40 text-atag-accent font-mono font-black text-sm px-2.5 py-0.5 rounded">${nf}</span>
                            <span class="text-xs font-bold text-white uppercase">${emitente}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${entregue ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-amber-500/20 text-amber-400 border-amber-500/40'}">
                                ${entregue ? 'ENTREGUE' : 'EM TRÂNSITO'}
                            </span>
                            <button onclick="excluirCarga('${id}')" class="text-gray-500 hover:text-red-400 text-xs p-1" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px] text-gray-300 bg-slate-900/70 p-2.5 rounded-lg border border-slate-800">
                        <div><i class="fa-solid fa-truck text-atag-accent mr-1"></i> <b class="text-gray-400">Transportadora:</b> ${transpNome}</div>
                        <div><i class="fa-solid fa-building text-atag-accent mr-1"></i> <b class="text-gray-400">Destinatário:</b> <span class="border px-1.5 py-0.5 rounded font-bold ${cnpjBadgeClass}">${cnpj} (${filialLabel})</span></div>
                    </div>

                    ${contatosHtml}

                    ${obs ? `<p class="text-[11px] text-gray-300 bg-slate-900/40 px-2 py-1.5 rounded border border-slate-800"><i class="fa-solid fa-comment text-atag-accent mr-1"></i>${obs}</p>` : ''}

                    <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs">
                        <div class="flex items-center gap-2">
                            ${site ? `<a href="${site}" target="_blank" class="text-atag-accent hover:underline font-bold flex items-center gap-1"><i class="fa-solid fa-globe"></i> Rastreio Site</a>` : '<span class="text-gray-500 text-[10px]">Sem site cad.</span>'}
                        </div>
                        <label class="flex items-center gap-1.5 cursor-pointer bg-slate-800 px-2.5 py-1 rounded border border-slate-700">
                            <input type="checkbox" ${entregue ? 'checked' : ''} onchange="toggleEntrega('${id}', this.checked)" class="w-3.5 h-3.5 accent-emerald-500">
                            <span class="text-[11px] font-bold ${entregue ? 'text-emerald-400' : 'text-gray-300'}">Marcar Entregue</span>
                        </label>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function salvarNovaCarga() {
            const nf = document.getElementById('reg-nf').value.trim();
            const origem = document.getElementById('reg-origem').value.trim();
            const cnpj = document.getElementById('reg-cnpj').value;
            const transp = document.getElementById('reg-transp').value;
            const previsao = document.getElementById('reg-previsao').value;
            const status = document.getElementById('reg-status').value;
            const obs = document.getElementById('reg-obs').value.trim();

            if (!nf || !origem || !transp) {
                alert("Preencha a NF, a Origem e selecione a Transportadora.");
                return;
            }

            const payload = {
                action: "insertFollowUp",
                nf: nf,
                emitente: origem,
                cnpj: cnpj,
                transp: transp,
                previsao: previsao,
                status: status,
                obs: obs
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('reg-nf').value = "";
                document.getElementById('reg-origem').value = "";
                document.getElementById('reg-obs').value = "";
                carregarCargas();
                alert("Carga registrada com sucesso!");
            } catch(e) {
                alert("Erro ao gravar carga.");
            }
        }

        async function toggleEntrega(id, status) {
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateFollowUp", id: id, entregue: status })
                });
                carregarCargas(false);
            } catch(e) { alert("Erro ao atualizar status."); }
        }

        async function excluirCarga(id) {
            if (!confirm("Deseja realmente excluir este registro?")) return;
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "deleteFollowUp", id: id })
                });
                carregarCargas();
            } catch(e) { alert("Erro ao excluir."); }
        }

        async function apagarSelecionadas() {
            const checks = document.querySelectorAll('.chk-carga:checked');
            if (checks.length === 0) {
                alert("Selecione pelo menos uma carga para excluir.");
                return;
            }
            if (!confirm(`Deseja realmente excluir as ${checks.length} cargas selecionadas?`)) return;

            for (let chk of checks) {
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "deleteFollowUp", id: chk.value })
                    });
                } catch(e) {}
            }
            carregarCargas();
        }

        async function salvarTransportadora() {
            const nome = document.getElementById('transp-nome').value.trim();
            const site = document.getElementById('transp-site').value.trim();
            const fone = document.getElementById('transp-fone').value.trim();
            const whats = document.getElementById('transp-whats').value.trim();

            if (!nome) { alert("Informe o nome da transportadora."); return; }

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "insertTransportadora", nome, site, fone, whats })
                });
                document.getElementById('transp-nome').value = "";
                document.getElementById('transp-site').value = "";
                document.getElementById('transp-fone').value = "";
                document.getElementById('transp-whats').value = "";
                carregarTransportadoras();
                alert("Transportadora cadastrada com sucesso!");
            } catch(e) { alert("Erro ao cadastrar transportadora."); }
        }

        function renderizarTransportadoras() {
            const container = document.getElementById('lista-transp');
            container.innerHTML = "";
            baseTransp.forEach(t => {
                const nome = t["TRANSPORTADORA"] || "";
                const site = t["SITE"] || "";
                const fone = t["TELEFONE"] || "";
                const whats = t["WHATSAPP"] || "";

                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-3 flex flex-col gap-2 shadow";
                card.innerHTML = `
                    <h4 class="font-bold text-sm text-white">${nome}</h4>
                    <div class="flex flex-col gap-1 text-xs text-gray-400">
                        ${fone ? `<p><i class="fa-solid fa-phone text-atag-accent mr-1.5"></i>${fone}</p>` : ''}
                        ${whats ? `<p><i class="fa-brands fa-whatsapp text-emerald-400 mr-1.5"></i>${whats}</p>` : ''}
                    </div>
                    ${site ? `<a href="${site}" target="_blank" class="mt-1 bg-slate-900 hover:bg-slate-800 text-atag-accent border border-slate-700 py-1.5 rounded-lg text-xs font-bold text-center block"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Acessar Portal de Rastreio</a>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function exportarRelatorioCargas() {
            if (baseCargas.length === 0) { alert("Sem dados para exportar."); return; }
            let csv = "data:text/csv;charset=utf-8,\uFEFF";
            csv += "ID;NF;Emitente;CNPJ Destinatário;Transportadora;Observação;Entregue\n";
            baseCargas.forEach(i => {
                csv += `"${i["ID_Registro"] || ""}","${i["Número da NF"] || ""}","${i["Emitente (Razão Social)"] || ""}","${i["CNPJ Destinatário"] || ""}","${i["Transp."] || ""}","${(i["OBSERVAÇÕES"] || "").replace(/;/g, ',')}","${i["Entregue? (checkbox)"] || ""}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `Relatorio_Cargas_ATAG_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Follow-Up de Cargas & Transportadoras</title>
    
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATAG FollowUp">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: 'rgba(30, 41, 59, 0.92)',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('atag_logo.png');
            background-repeat: no-repeat;
            background-position: 65% center;
            background-size: 55% auto; 
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .glass-card {
            background-color: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .atag-logo-glow { filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.25)); }
        input:focus, textarea:focus, select:focus { border-color: #38BDF8 !important; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35) !important; outline: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased relative z-10">

    <header class="glass-card border-b border-atag-border p-3 px-4 sticky top-0 z-30 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-3">
                    <a href="./index.html" class="bg-slate-800 hover:bg-slate-700 text-atag-accent px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow border border-slate-700" title="Voltar ao Portal de Módulos">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Menu</span>
                    </a>
                    <img src="atag_logo.png" alt="Logo ATAG" class="h-9 w-auto atag-logo-glow">
                    <div>
                        <h1 class="text-xs font-bold text-gray-200 uppercase tracking-wider leading-none">Gestão de Cargas & Transportes</h1>
                        <p class="text-[10px] text-gray-400 font-medium">ATAG Auto Peças <span class="text-atag-accent font-semibold ml-1">| Nuvem Planilha</span></p>
                    </div>
                </div>

                <div id="status-badge" class="flex sm:hidden items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="status-text">ONLINE</span>
                </div>
            </div>

            <nav class="flex items-center gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button onclick="mudarAba('followup')" id="btn-tab-fw" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent text-slate-950 shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-truck-ramp-box"></i> Cargas & NF-e
                </button>
                <button onclick="mudarAba('transportadoras')" id="btn-tab-transp" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-gray-300 hover:text-white transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-truck-fast"></i> Transportadoras
                </button>
            </nav>

            <div class="hidden sm:flex items-center gap-3">
                <div id="status-badge-desk" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="status-text-desk">ONLINE</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col gap-4 relative z-10">

        <!-- ABA 1: FOLLOW-UP -->
        <div id="aba-followup" class="flex flex-col gap-4 animate-fade-in">
            <div class="grid grid-cols-3 gap-3">
                <div class="glass-card border border-amber-500/30 rounded-xl p-3 text-center shadow-lg bg-amber-500/5">
                    <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider block">Em Trânsito</span>
                    <span id="stat-transito" class="text-xl font-black text-amber-300">0</span>
                </div>
                <div class="glass-card border border-red-500/30 rounded-xl p-3 text-center shadow-lg bg-red-500/5">
                    <span class="text-[10px] font-bold text-red-400 uppercase tracking-wider block">Pendentes / Atrasadas</span>
                    <span id="stat-pendente" class="text-xl font-black text-red-300">0</span>
                </div>
                <div class="glass-card border border-emerald-500/30 rounded-xl p-3 text-center shadow-lg bg-emerald-500/5">
                    <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block">Entregues</span>
                    <span id="stat-entregue" class="text-xl font-black text-emerald-300">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                <div class="lg:col-span-4 glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                        <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-truck-ramp-box text-atag-accent"></i>
                            <span>Registrar Carga / Pedido</span>
                        </h2>
                        <span id="form-modo-label" class="text-[10px] bg-slate-800 text-atag-accent px-2 py-0.5 rounded font-bold uppercase">Novo</span>
                    </div>

                    <input type="hidden" id="fw-edit-id">

                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">NF / N° Pedido *</label>
                            <input type="text" id="fw-nota" placeholder="Ex: NF 45892 ou PED 1092" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase font-bold">
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Origem / Fornecedor *</label>
                            <input type="text" id="fw-origem" placeholder="Ex: SCHADEK, NGK, FORNECEDOR SP..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase font-bold">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[11px] font-bold text-gray-400 uppercase">Transportadora *</label>
                                <button onclick="mudarAba('transportadoras')" class="text-[10px] text-atag-accent hover:underline font-bold">+ Cadastrar</button>
                            </div>
                            <select id="fw-transportadora" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white font-bold">
                                <option value="">Selecione a transportadora...</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Previsão Entrega</label>
                                <input type="date" id="fw-previsao" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Status Carga</label>
                                <select id="fw-status" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs font-bold text-amber-400">
                                    <option value="EM TRANSITO" class="text-amber-400">🚚 Em Trânsito</option>
                                    <option value="PENDENTE" class="text-red-400">⏳ Pendente</option>
                                    <option value="ENTREGUE" class="text-emerald-400">✅ Entregue</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Cód. Rastreio ou Obs.</label>
                            <textarea id="fw-obs" rows="2" placeholder="Digite o código de rastreio ou detalhes adicionais..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white resize-none"></textarea>
                        </div>

                        <div class="flex gap-2">
                            <button id="btn-cancelar-edicao" onclick="limparFormFollowUp()" class="hidden bg-slate-800 text-gray-300 px-3 py-3 rounded-lg text-xs font-bold">Cancelar</button>
                            <button onclick="salvarFollowUp()" id="btn-salvar-fw" class="flex-1 py-3 bg-atag-red hover:bg-atag-redDark text-white font-black rounded-lg text-xs uppercase tracking-wider shadow-lg active:scale-95 transition-all">
                                Salvar Carga
                            </button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-8 flex flex-col gap-3">
                    <div class="glass-card border border-atag-border rounded-xl p-3 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-3">
                        <div class="relative flex-1 w-full">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                            <input type="text" id="filtro-busca-fw" oninput="renderizarFollowUp()" placeholder="Buscar por NF, Transportadora, Origem..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-xs text-white">
                        </div>

                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <select id="filtro-status-fw" onchange="renderizarFollowUp()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold text-atag-accent">
                                <option value="TODOS">TODOS OS STATUS</option>
                                <option value="EM TRANSITO">EM TRÂNSITO</option>
                                <option value="PENDENTE">PENDENTE</option>
                                <option value="ENTREGUE">ENTREGUE</option>
                            </select>

                            <button onclick="exportarRelatorioFw()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow transition-all active:scale-95 flex-shrink-0">
                                <i class="fa-solid fa-file-excel"></i>
                                <span class="hidden sm:inline">Exportar CSV</span>
                            </button>
                        </div>
                    </div>

                    <div id="lista-followup" class="flex flex-col gap-2.5 max-h-[calc(100vh-280px)] overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>

        <!-- ABA 2: TRANSPORTADORAS -->
        <div id="aba-transportadoras" class="hidden flex-col gap-4 animate-fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                <div class="lg:col-span-4 glass-card border border-atag-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                        <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-truck-fast text-atag-accent"></i>
                            <span>Cadastrar Transportadora</span>
                        </h2>
                    </div>

                    <input type="hidden" id="transp-edit-id">

                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Nome da Transportadora *</label>
                            <input type="text" id="transp-nome" placeholder="Ex: BRASPRESS, JADLOG..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white uppercase font-bold">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">WhatsApp (Com DDD)</label>
                                <input type="text" id="transp-telefone" placeholder="67999999999" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Prazo Médio</label>
                                <input type="text" id="transp-prazo" placeholder="Ex: 24h a 48h" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Link Direto de Rastreio</label>
                            <input type="url" id="transp-link" placeholder="https://site.com.br/rastreio" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase block mb-1">Observações Gerais</label>
                            <textarea id="transp-obs" rows="2" placeholder="Rotas atendidas, horários de coleta..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white resize-none"></textarea>
                        </div>

                        <button onclick="salvarTransportadora()" class="w-full py-3 bg-atag-accent hover:bg-sky-400 text-slate-950 font-black rounded-lg text-xs uppercase tracking-wider shadow-lg active:scale-95 transition-all">
                            Salvar Transportadora
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-8 flex flex-col gap-3">
                    <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-200 uppercase">Parceiros Logísticos Cadastrados</span>
                        <span class="text-xs text-atag-accent font-bold" id="transp-total-count">0 Ativas</span>
                    </div>

                    <div id="lista-transportadoras" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[calc(100vh-220px)] overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Sincronização ATAG Logística - Atualizado com Origem Livre
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseFollowUp = [];
        let baseTransportadoras = [];

        window.onload = function() {
            carregarDadosServidor();
            setInterval(carregarDadosServidor, 5000);
        };

        async function carregarDadosServidor() {
            try {
                // Carregar Transportadoras
                const resTr = await fetch(WEB_APP_URL + "?tipo=transportadoras");
                const dataTr = await resTr.json();
                if (Array.isArray(dataTr)) {
                    baseTransportadoras = dataTr.map(t => {
                        let nomeReal = t.nome || t.TRANSPORTADORA || t.Transportadora || t['1'] || '';
                        let telReal = t.telefone || t.WHATSAPP || t.Whatsapp || t.TELEFONE || t['3'] || '';
                        let siteReal = t.link || t.SITE || t.Site || t['2'] || '';
                        let obsReal = t.obs || t.OBS || '';
                        return {
                            id: t.id || t.ID || '',
                            nome: String(nomeReal).trim(),
                            telefone: String(telReal).trim(),
                            prazo: t.prazo || t.PRAZO || '',
                            link: String(siteReal).trim(),
                            obs: String(obsReal).trim()
                        };
                    }).filter(t => t.nome !== '' && t.nome !== 'undefined');

                    renderizarTransportadoras();
                    atualizarSelectTransportadoras();
                }

                // Carregar FollowUp
                const resFw = await fetch(WEB_APP_URL + "?tipo=followup");
                const dataFw = await resFw.json();
                if (Array.isArray(dataFw)) {
                    baseFollowUp = dataFw.map(i => {
                        let notaReal = i.nota || i.NF || i['Número da NF'] || i['NF / N° Pedido'] || i['1'] || '';
                        let origemReal = i.origem || i.Origem || i['Emitente (Razão Social)'] || i['2'] || '';
                        let transpReal = i.transportadora || i.Transp || i.Transportadora || i['4'] || '';
                        let prevReal = i.previsao || i.Previsão || i['PREVISÃO ENTREGA'] || i['8'] || '';
                        let statusReal = i.status || i.Status || i['STATUS CARGA'] || i['9'] || 'EM TRANSITO';
                        let obsReal = i.obs || i.Observações || i.OBSERVAÇÕES || i['CÓD. RASTREIO OU OBS.'] || i['8'] || '';

                        return {
                            id: i.id || i.ID || i['0'] || '',
                            nota: String(notaReal).trim(),
                            origem: String(origemReal).trim(),
                            transportadora: String(transpReal).trim(),
                            previsao: String(prevReal).trim(),
                            status: String(statusReal).toUpperCase().trim(),
                            obs: String(obsReal).trim()
                        };
                    }).filter(i => i.nota !== '' && i.nota !== 'undefined');

                    renderizarFollowUp();
                }

                setStatusOnline(true);
            } catch (e) {
                console.error("Erro ao sincronizar dados logísticos", e);
                setStatusOnline(false);
            }
        }

        function setStatusOnline(online) {
            const txt = online ? "ONLINE" : "ERRO SINC";
            document.getElementById('status-text').innerText = txt;
            document.getElementById('status-text-desk').innerText = txt;
        }

        function mudarAba(aba) {
            document.getElementById('aba-followup').classList.add('hidden');
            document.getElementById('aba-transportadoras').classList.add('hidden');

            document.getElementById('btn-tab-fw').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold text-gray-300 hover:text-white transition-all flex items-center gap-1.5";
            document.getElementById('btn-tab-transp').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold text-gray-300 hover:text-white transition-all flex items-center gap-1.5";

            if (aba === 'followup') {
                document.getElementById('aba-followup').classList.remove('hidden');
                document.getElementById('btn-tab-fw').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent text-slate-950 shadow flex items-center gap-1.5";
            } else {
                document.getElementById('aba-transportadoras').classList.remove('hidden');
                document.getElementById('btn-tab-transp').className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent text-slate-950 shadow flex items-center gap-1.5";
            }
        }

        // TRANSPORTADORAS NA NUVEM
        async function salvarTransportadora() {
            const id = document.getElementById('transp-edit-id').value;
            const nome = document.getElementById('transp-nome').value.trim().toUpperCase();
            const telefone = document.getElementById('transp-telefone').value.trim();
            const prazo = document.getElementById('transp-prazo').value.trim();
            const link = document.getElementById('transp-link').value.trim();
            const obs = document.getElementById('transp-obs').value.trim();

            if (!nome) { alert("Informe o nome da transportadora."); return; }

            const payload = { modulo: "transportadoras", action: id ? "update" : "insert", id, nome, telefone, prazo, link, obs };
            
            try {
                await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                document.getElementById('transp-edit-id').value = "";
                document.getElementById('transp-nome').value = "";
                document.getElementById('transp-telefone').value = "";
                document.getElementById('transp-prazo').value = "";
                document.getElementById('transp-link').value = "";
                document.getElementById('transp-obs').value = "";
                carregarDadosServidor();
            } catch (e) {
                alert("Erro ao salvar transportadora.");
            }
        }

        function renderizarTransportadoras() {
            const container = document.getElementById('lista-transportadoras');
            container.innerHTML = "";

            baseTransportadoras.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-3.5 flex flex-col gap-2 shadow-lg";

                let telefoneLimpo = String(item.telefone || '').replace(/\D/g, '');
                let btnWp = telefoneLimpo ? `<a href="https://wa.me/55${telefoneLimpo}?text=Olá%20${encodeURIComponent(item.nome)},%20poderia%20me%20informar%20o%20status%20das%20entregas%20para%20ATAG%20Distribuidora?" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 w-fit"><i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp</a>` : '';
                let btnLink = item.link && item.link !== '#' ? `<a href="${item.link}" target="_blank" class="text-xs text-atag-accent font-bold hover:underline flex items-center gap-1"><i class="fa-solid fa-globe"></i> Rastreio</a>` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-white">${item.nome}</span>
                        <span class="text-[10px] bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded border border-sky-500/40 font-bold">${item.prazo || 'N/I'}</span>
                    </div>
                    <p class="text-xs text-gray-300"><i class="fa-solid fa-phone text-atag-accent mr-1.5"></i>${item.telefone || 'Sem Telefone'}</p>
                    ${item.obs ? `<p class="text-[11px] text-gray-400">${item.obs}</p>` : ''}
                    <div class="flex items-center justify-between pt-2 border-t border-slate-700/50 mt-1">
                        <div class="flex items-center gap-2">${btnWp} ${btnLink}</div>
                        <div class="flex gap-1">
                            <button onclick="editarTransportadora('${item.id}', '${item.nome}', '${item.telefone || ''}', '${item.prazo || ''}', '${item.link || ''}', '${item.obs || ''}')" class="w-7 h-7 rounded bg-slate-800 text-gray-300 flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="excluirTransportadora('${item.id}')" class="w-7 h-7 rounded bg-red-500/10 text-red-400 flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('transp-total-count').innerText = `${baseTransportadoras.length} Ativas`;
        }

        function editarTransportadora(id, nome, telefone, prazo, link, obs) {
            document.getElementById('transp-edit-id').value = id;
            document.getElementById('transp-nome').value = nome;
            document.getElementById('transp-telefone').value = telefone;
            document.getElementById('transp-prazo').value = prazo;
            document.getElementById('transp-link').value = link;
            document.getElementById('transp-obs').value = obs;
        }

        async function excluirTransportadora(id) {
            if (!confirm("Deseja excluir esta transportadora?")) return;
            try {
                await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modulo: "transportadoras", action: "delete", id }) });
                carregarDadosServidor();
            } catch(e) { alert("Erro ao excluir."); }
        }

        function atualizarSelectTransportadoras() {
            const select = document.getElementById('fw-transportadora');
            const valorAtual = select.value;
            select.innerHTML = '<option value="">Selecione a transportadora...</option>';
            baseTransportadoras.forEach(t => {
                if (t.nome) {
                    const opt = document.createElement('option');
                    opt.value = t.nome;
                    opt.text = t.nome;
                    select.appendChild(opt);
                }
            });
            select.value = valorAtual;
        }

        // FOLLOW-UP NA NUVEM
        async function salvarFollowUp() {
            const id = document.getElementById('fw-edit-id').value;
            const nota = document.getElementById('fw-nota').value.trim().toUpperCase();
            const origem = document.getElementById('fw-origem').value.trim().toUpperCase();
            const transportadora = document.getElementById('fw-transportadora').value;
            const previsao = document.getElementById('fw-previsao').value;
            const status = document.getElementById('fw-status').value;
            const obs = document.getElementById('fw-obs').value.trim();

            if (!nota || !transportadora) {
                alert("Informe a NF e selecione a Transportadora.");
                return;
            }

            const payload = { modulo: "followup", action: id ? "update" : "insert", id, nota, origem, transportadora, previsao, status, obs };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                limparFormFollowUp();
                carregarDadosServidor();
            } catch (e) {
                alert("Erro ao salvar carga.");
            }
        }

        function limparFormFollowUp() {
            document.getElementById('fw-edit-id').value = "";
            document.getElementById('fw-nota').value = "";
            document.getElementById('fw-origem').value = "";
            document.getElementById('fw-obs').value = "";
            document.getElementById('fw-previsao').value = "";
            document.getElementById('fw-transportadora').value = "";
            document.getElementById('form-modo-label').innerText = "Novo";
            document.getElementById('btn-cancelar-edicao').classList.add('hidden');
            document.getElementById('btn-salvar-fw').innerText = "Salvar Carga";
        }

        function editarFollowUp(id, nota, origem, transportadora, previsao, status, obs) {
            document.getElementById('fw-edit-id').value = id;
            document.getElementById('fw-nota').value = nota;
            document.getElementById('fw-origem').value = origem;
            document.getElementById('fw-transportadora').value = transportadora;
            document.getElementById('fw-previsao').value = previsao;
            document.getElementById('fw-status').value = status;
            document.getElementById('fw-obs').value = obs;

            document.getElementById('form-modo-label').innerText = "Editando";
            document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
            document.getElementById('btn-salvar-fw').innerText = "Atualizar Carga";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function excluirFollowUp(id) {
            if (!confirm("Deseja realmente excluir este acompanhamento?")) return;
            try {
                await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ modulo: "followup", action: "delete", id }) });
                carregarDadosServidor();
            } catch(e) { alert("Erro ao excluir."); }
        }

        function renderizarFollowUp() {
            const container = document.getElementById('lista-followup');
            const busca = document.getElementById('filtro-busca-fw').value.toLowerCase();
            const statusFiltro = document.getElementById('filtro-status-fw').value;
            container.innerHTML = "";

            let countTransito = 0, countPendente = 0, countEntregue = 0;

            baseFollowUp.forEach(item => {
                let st = String(item.status || '').toUpperCase();
                if (st.includes('TRANSITO') || st === '') countTransito++;
                else if (st.includes('PENDENTE') || st.includes('ATRASADA')) countPendente++;
                else if (st.includes('ENTREGUE') || st.includes('TRUE')) countEntregue++;
            });

            document.getElementById('stat-transito').innerText = countTransito;
            document.getElementById('stat-pendente').innerText = countPendente;
            document.getElementById('stat-entregue').innerText = countEntregue;

            let filtrados = baseFollowUp.filter(item => {
                let st = String(item.status || '').toUpperCase();
                const matchStatus = statusFiltro === 'TODOS' || st.includes(statusFiltro.replace(/[^A-Z]/g, ''));
                const matchBusca = (String(item.nota) + String(item.origem) + String(item.transportadora) + String(item.obs)).toLowerCase().includes(busca);
                return matchStatus && matchBusca;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500 font-bold text-xs uppercase">Nenhuma carga encontrada.</div>`;
                return;
            }

            filtrados.forEach(item => {
                const transpObj = baseTransportadoras.find(t => String(t.nome).trim().toUpperCase() === String(item.transportadora).trim().toUpperCase());
                const telefoneTransp = transpObj ? String(transpObj.telefone || '').replace(/\D/g, '') : '';
                const linkTransp = transpObj && transpObj.link && transpObj.link !== '#' ? transpObj.link : '';

                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-3.5 flex flex-col gap-2 shadow-lg animate-fade-in";

                let st = String(item.status || '').toUpperCase();
                let statusBadge = '<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-extrabold px-2 py-0.5 rounded">🚚 EM TRÂNSITO</span>';
                if (st.includes('PENDENTE') || st.includes('ATRASADA')) {
                    statusBadge = '<span class="bg-red-500/20 text-red-300 border border-red-500/40 text-[10px] font-extrabold px-2 py-0.5 rounded">⏳ PENDENTE</span>';
                } else if (st.includes('ENTREGUE') || st.includes('TRUE')) {
                    statusBadge = '<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-extrabold px-2 py-0.5 rounded">✅ ENTREGUE</span>';
                }

                let textoZap = `Olá! Gostaria de verificar o status da *${item.nota}* (Origem: ${item.origem}), transportada pela ${item.transportadora}. Previsão: ${item.previsao || 'N/A'}.`;
                let linkZap = telefoneTransp ? `https://wa.me/55${telefoneTransp}?text=${encodeURIComponent(textoZap)}` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-white">${item.nota}</span>
                        <div class="flex items-center gap-2">
                            ${statusBadge}
                            <button onclick="editarFollowUp('${item.id}', '${item.nota}', '${item.origem}', '${item.transportadora}', '${item.previsao}', '${item.status}', '${item.obs}')" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="excluirFollowUp('${item.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-300">
                        <div><i class="fa-solid fa-location-dot text-atag-accent mr-1"></i><b>Origem:</b> ${item.origem || 'Não informada'}</div>
                        <div><i class="fa-solid fa-truck text-atag-accent mr-1"></i><b>Transp:</b> <span class="text-atag-accent font-bold">${item.transportadora}</span></div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-gray-400 border-t border-slate-700/50 pt-2">
                        <span>Previsão: <b>${item.previsao || 'N/A'}</b></span>
                        <span class="truncate max-w-[220px] text-gray-300">${item.obs || ''}</span>
                    </div>
                    <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
                        ${linkZap ? `<a href="${linkZap}" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all"><i class="fa-brands fa-whatsapp text-sm"></i> Cobrar WhatsApp</a>` : '<span class="text-[10px] text-gray-500">Cadastre o WhatsApp na aba Transportadoras</span>'}
                        ${linkTransp ? `<a href="${linkTransp}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-atag-accent py-1.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition-all"><i class="fa-solid fa-globe"></i> Rastreio Site</a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function exportarRelatorioFw() {
            let csv = "data:text/csv;charset=utf-8,\uFEFFNF / Pedido;Origem;Transportadora;Previsão;Status;Observação\n";
            baseFollowUp.forEach(i => {
                csv += `"${i.nota}";"${i.origem}";"${i.transportadora}";"${i.previsao}";"${i.status}";"${(i.obs || '').replace(/;/g, ',')}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `FollowUp_Cargas_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>

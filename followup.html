<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAG - Gestão de Cargas & Transportes</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATAG Cargas">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        atag: {
                            red: '#E53E3E',
                            redDark: '#9B2C2C',
                            bg: '#0F172A',
                            card: 'rgba(30, 41, 59, 0.92)',
                            border: '#334155',
                            accent: '#38BDF8',
                            success: '#22C55E',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('atag_logo.png');
            background-repeat: no-repeat;
            background-position: 65% center;
            background-size: 55% auto; 
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background-color: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }
        .atag-logo-glow { filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.25)); }
        input:focus, textarea:focus, select:focus {
            border-color: #38BDF8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25) !important;
            outline: none;
            transition: all 0.1s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        /* REGRA DE MODO CONSULTA: ESCONDE ELEMENTOS EXCLUSIVOS DE ADMIN */
        body.modo-consulta .admin-only {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased relative z-10 modo-consulta">

    <!-- HEADER -->
    <header class="glass-card border-b border-atag-border p-3 px-4 sticky top-0 z-40 shadow-xl flex flex-col lg:flex-row justify-between items-center gap-3">
        <div class="flex items-center justify-between w-full lg:w-auto">
            <div class="flex items-center gap-3">
                <a href="./index.html" class="bg-slate-800 hover:bg-slate-700 text-atag-accent border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 transition-all active:scale-95 shadow">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span class="hidden sm:inline">Módulos</span>
                </a>
                <img src="atag_logo.png" alt="Logo ATAG" class="h-8 w-auto atag-logo-glow rounded object-contain">
                <div>
                    <h1 class="text-xs font-black text-gray-100 uppercase tracking-wide leading-none">Gestão de Cargas & Transportes</h1>
                    <p class="text-[10px] text-gray-400 font-medium">ATAG Auto Peças <span id="label-modo-acesso" class="text-atag-accent">| Consulta</span></p>
                </div>
            </div>

            <div id="status-badge" class="lg:hidden flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] px-2.5 py-1 rounded-full font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="status-text-mob">ONLINE</span>
            </div>
        </div>

        <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800">
            <button onclick="mudarAba('cargas')" id="nav-desk-cargas" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40"><i class="fa-solid fa-truck-fast mr-1"></i> Cargas</button>
            <button onclick="mudarAba('historico')" id="nav-desk-historico" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white"><i class="fa-solid fa-clipboard-check mr-1"></i> Histórico</button>
            <button onclick="mudarAba('transp')" id="nav-desk-transp" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white admin-only"><i class="fa-solid fa-address-book mr-1"></i> Transportadoras</button>
        </div>

        <div class="hidden lg:flex items-center gap-2.5">
            <div class="bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-lg text-center flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase">Trânsito:</span>
                <span id="stat-transito" class="text-xs font-black text-amber-400">0</span>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-lg text-center flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase">Pendentes:</span>
                <span id="stat-pendentes" class="text-xs font-black text-atag-red">0</span>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-lg text-center flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase">Entregues:</span>
                <span id="stat-entregues" class="text-xs font-black text-emerald-400">0</span>
            </div>
            <div id="status-badge-desk" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-semibold ml-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="status-text">ONLINE</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md lg:max-w-7xl w-full mx-auto p-3 pb-20 lg:pb-4 flex flex-col gap-3 relative z-10">

        <section id="view-cargas" class="flex flex-col gap-3">
            <div class="lg:grid lg:grid-cols-12 lg:gap-4 lg:items-start">

                <!-- COLUNA ESQUERDA: FORMULÁRIO DE CADASTRO/EDIÇÃO (APARECE APENAS PARA ADMIN) -->
                <div id="coluna-formulario" class="lg:col-span-4 flex flex-col gap-3 mb-3 lg:mb-0 lg:sticky lg:top-24 z-20 admin-only">
                    <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex flex-col gap-2.5 max-h-[calc(100vh-120px)] overflow-y-auto">
                        <div class="flex justify-between items-center border-b border-slate-700/60 pb-1.5">
                            <h3 id="form-titulo" class="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-square-plus text-atag-accent"></i>
                                Registrar Carga
                            </h3>
                            <span id="form-badge" class="text-[9px] bg-atag-accent/20 text-atag-accent px-1.5 py-0.5 rounded font-bold">NOVO</span>
                        </div>

                        <input type="hidden" id="reg-id-edicao" value="">

                        <div class="flex flex-col gap-2.5">
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">NF / Nº Pedido *</label>
                                <input type="text" id="reg-nf" placeholder="EX: 45892" class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase mt-0.5 font-mono font-bold">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Origem / Fornecedor *</label>
                                <input type="text" id="reg-origem" onblur="preencherDadosPorFornecedor()" placeholder="EX: SCHADEK, NGK..." class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase mt-0.5 font-bold">
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-400 uppercase block mb-0.5">Destinatário *</label>
                                    <select id="reg-cnpj" class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-[11px] font-bold text-atag-accent">
                                        <option value="09.253.819/0001-35">Matriz (Dourados)</option>
                                        <option value="09.253.819/0002-16">Filial (Campo Grande)</option>
                                    </select>
                                </div>
                                <div>
                                    <div class="flex justify-between items-center mb-0.5">
                                        <label class="text-[10px] font-bold text-gray-400 uppercase">Transportadora *</label>
                                        <button onclick="mudarAba('transp')" class="text-[9px] text-atag-accent hover:underline">+ Nova</button>
                                    </div>
                                    <select id="reg-transp" onchange="preencherDadosTransportadora()" class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-[11px] font-bold text-white">
                                        <option value="">Selecione...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-1.5 bg-slate-900/60 p-2 rounded-lg border border-slate-800 text-[10px]">
                                <div>
                                    <span class="text-gray-400 font-semibold block uppercase">Site Rastreio</span>
                                    <input type="text" id="reg-site" placeholder="URL..." class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-[10px] text-white mt-0.5">
                                </div>
                                <div>
                                    <span class="text-gray-400 font-semibold block uppercase">Telefone</span>
                                    <input type="text" id="reg-fone" placeholder="Tel..." class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-[10px] text-white mt-0.5">
                                </div>
                                <div>
                                    <span class="text-gray-400 font-semibold block uppercase">WhatsApp</span>
                                    <input type="text" id="reg-whats" placeholder="Whats..." class="w-full bg-slate-950 border border-slate-800 rounded p-1 text-[10px] text-white mt-0.5">
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-400 uppercase">Previsão Entrega</label>
                                    <input type="date" id="reg-previsao" onchange="calcularStatusAutomaticoFormulario()" class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white mt-0.5">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-400 uppercase">Status</label>
                                    <select id="reg-status" class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs font-bold text-amber-400 mt-0.5">
                                        <option value="EM TRÂNSITO">Em Trânsito</option>
                                        <option value="PENDENTE / ATRASADA">Pendente / Atrasada</option>
                                        <option value="ENTREGUE">Entregue</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Observações</label>
                                <textarea id="reg-obs" rows="1" placeholder="Obs..." class="form-input w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white mt-0.5 resize-none"></textarea>
                            </div>

                            <div class="flex gap-2 mt-0.5">
                                <button id="btn-salvar-carga" onclick="salvarNovaCarga()" class="flex-1 bg-atag-red hover:bg-atag-redDark text-white py-2.5 rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-lg active:scale-95 transition-all">
                                    <i class="fa-solid fa-floppy-disk mr-1"></i> Salvar Carga
                                </button>
                                <button id="btn-cancelar-edicao" onclick="limparFormularioCarga()" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-3 py-2.5 rounded-xl font-bold text-xs uppercase transition-all">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLUNA DA LISTAGEM -->
                <div id="coluna-lista" class="lg:col-span-12 flex flex-col gap-2">
                    <div class="glass-card border border-atag-border rounded-xl p-2.5 shadow-xl flex flex-col gap-2 sticky top-24 z-10">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                                <i class="fa-solid fa-magnifying-glass text-atag-accent text-xs"></i>
                                <input type="text" id="search-cargas" oninput="renderizarCargas()" placeholder="Buscar por NF, Transportadora, Origem..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                            </div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <select id="select-filtro-status" onchange="renderizarCargas()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-bold text-atag-accent">
                                    <option value="TODAS">TODAS ATIVAS</option>
                                    <option value="EM TRÂNSITO">EM TRÂNSITO</option>
                                    <option value="PENDENTE / ATRASADA">PENDENTES</option>
                                </select>
                                <button onclick="apagarSelecionadas()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow admin-only" title="Excluir marcadas">
                                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Excluir</span>
                                </button>
                                <button onclick="exportarRelatorioCargas()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow admin-only">
                                    <i class="fa-solid fa-file-excel"></i> CSV
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-gray-400 border-t border-slate-700/50 pt-1 font-medium">
                            <span>REGISTROS ATIVOS</span>
                            <span id="total-cargas-contador" class="text-atag-accent font-bold">0 CARGAS</span>
                        </div>
                    </div>

                    <div id="lista-cargas" class="flex flex-col gap-2">
                        <!-- Injetado Dinamicamente -->
                    </div>
                </div>
            </div>
        </section>

        <!-- MÓDULO: HISTÓRICO -->
        <section id="view-historico" class="hidden flex-col gap-3">
            <div class="glass-card border border-atag-border rounded-xl p-3 shadow-xl flex flex-col gap-2.5 sticky top-24 z-10">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center gap-2 flex-1">
                        <i class="fa-solid fa-magnifying-glass text-emerald-400 text-xs"></i>
                        <input type="text" id="search-historico" oninput="renderizarHistorico()" placeholder="Buscar no histórico..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                    </div>
                    <button onclick="exportarRelatorioHistorico()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow admin-only">
                        <i class="fa-solid fa-file-excel mr-1"></i> Exportar CSV
                    </button>
                </div>
                <div class="flex justify-between items-center text-[10px] text-gray-400 border-t border-slate-700/50 pt-1.5 font-medium">
                    <span>CARGAS JÁ ENTREGUES</span>
                    <span id="total-historico-contador" class="text-emerald-400 font-bold">0 ENTREGUES</span>
                </div>
            </div>

            <div id="lista-historico" class="flex flex-col gap-2">
                <!-- Injetado Dinamicamente -->
            </div>
        </section>

        <!-- MÓDULO: TRANSPORTADORAS (APENAS ADMIN) -->
        <section id="view-transp" class="hidden flex-col gap-3 admin-only">
            <div class="glass-card border border-atag-border rounded-xl p-3.5 shadow-xl flex flex-col gap-2.5">
                <div class="flex justify-between items-center border-b border-slate-700 pb-1.5">
                    <h3 class="text-xs font-bold text-white uppercase"><i class="fa-solid fa-truck text-atag-accent mr-1"></i> Cadastrar Nova Transportadora</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input type="text" id="transp-nome" placeholder="Nome..." class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white uppercase font-bold">
                    <input type="text" id="transp-site" placeholder="Site de Rastreio..." class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <input type="text" id="transp-fone" placeholder="Telefone..." class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <input type="text" id="transp-whats" placeholder="WhatsApp..." class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                </div>
                <button onclick="salvarTransportadora()" class="bg-atag-accent hover:bg-sky-400 text-slate-950 py-2 rounded-lg font-black text-xs uppercase shadow transition-all">Salvar Transportadora</button>
            </div>

            <div id="lista-transp" class="flex flex-col gap-2">
                <!-- Injetado Dinamicamente -->
            </div>
        </section>

    </main>

    <!-- FOOTER MOBILE -->
    <footer class="lg:hidden glass-card border-t border-atag-border p-1.5 fixed bottom-0 left-0 right-0 z-30 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-1">
            <button onclick="mudarAba('cargas')" id="nav-mob-cargas" class="py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 bg-slate-800 text-atag-accent border border-atag-accent/40">
                <i class="fa-solid fa-truck-fast text-xs"></i>
                <span>CARGAS</span>
            </button>
            <button onclick="mudarAba('historico')" id="nav-mob-historico" class="py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 text-gray-400 hover:bg-slate-800/50">
                <i class="fa-solid fa-clipboard-check text-xs"></i>
                <span>HISTÓRICO</span>
            </button>
            <button onclick="mudarAba('transp')" id="nav-mob-transp" class="py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 text-gray-400 hover:bg-slate-800/50 admin-only">
                <i class="fa-solid fa-address-book text-xs"></i>
                <span>TRANSP.</span>
            </button>
        </div>
    </footer>

    <div id="toast-copia" class="fixed bottom-14 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-2xl z-[80] hidden transition-all">
        Copiado com sucesso! ✓
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQDDnTJjPoOSnEOT97bOazZURRjXWGk_VXAwwaNlzA3bP5lEKJ8FqJjiAe45ZM0zhQ/exec";

        let baseCargas = [];
        let baseTransp = [];
        let isAdmin = false;

        window.onload = async function() {
            // VERIFICA SE O UTILIZADOR AUTENTICOU COMO ADMIN
            const storedAdmin = localStorage.getItem('atag_admin');
            isAdmin = (storedAdmin === 'true' || storedAdmin === true);
            
            if (isAdmin) {
                document.body.classList.remove('modo-consulta');
                document.getElementById('label-modo-acesso').innerText = "| Admin";
                const colLista = document.getElementById('coluna-lista');
                if(colLista) colLista.className = "lg:col-span-8 flex flex-col gap-2";
            } else {
                document.body.classList.add('modo-consulta');
                document.getElementById('label-modo-acesso').innerText = "| Consulta";
                const colLista = document.getElementById('coluna-lista');
                if(colLista) colLista.className = "lg:col-span-12 flex flex-col gap-2";
            }

            await carregarTransportadoras();
            await carregarCargas();
        };

        function norm(str) {
            return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function calcularStatusAutomaticoFormulario() {
            const statusSelect = document.getElementById('reg-status');
            if (!statusSelect || statusSelect.value === "ENTREGUE") return;
            const previsaoVal = document.getElementById('reg-previsao').value;
            if (!previsaoVal) { statusSelect.value = "EM TRÂNSITO"; return; }
            const partes = previsaoVal.split("-");
            if (partes.length === 3) {
                const dataPrevisao = new Date(partes[0], partes[1] - 1, partes[2]);
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                statusSelect.value = (dataPrevisao < hoje) ? "PENDENTE / ATRASADA" : "EM TRÂNSITO";
            }
        }

        function preencherDadosTransportadora() {
            const nomeTransp = document.getElementById('reg-transp').value;
            const transpObj = baseTransp.find(t => norm(t.nome || t["TRANSPORTADORA"] || t["Transportadora"]) === norm(nomeTransp));
            if (transpObj) {
                document.getElementById('reg-site').value = transpObj.link || transpObj["SITE"] || transpObj["Site"] || "";
                document.getElementById('reg-fone').value = transpObj.telefone || transpObj["TELEFONE"] || transpObj["Telefone"] || "";
                document.getElementById('reg-whats').value = transpObj.whatsapp || transpObj["WHATSAPP"] || transpObj["WHATS"] || transpObj["WhatsApp"] || "";
            }
        }

        function preencherDadosPorFornecedor() {
            const inputOrigem = document.getElementById('reg-origem');
            const selectTransp = document.getElementById('reg-transp');
            const fornecedorDigitado = norm(inputOrigem.value);
            if (!fornecedorDigitado) return;

            const cargaAnterior = baseCargas.find(i => {
                const origemItem = norm(i.origem || i["Emitente (Razão Social)"] || i["Emitente"] || i["Fornecedor"]);
                const transpItem = i.transportadora || i["TRANSPORTADORA"] || i["Transp."] || i["Transportadora"];
                return origemItem === fornecedorDigitado && transpItem;
            });

            if (cargaAnterior) {
                const transpAnterior = cargaAnterior.transportadora || cargaAnterior["TRANSPORTADORA"] || cargaAnterior["Transp."] || cargaAnterior["Transportadora"];
                if (transpAnterior) {
                    selectTransp.value = transpAnterior;
                    preencherDadosTransportadora();
                }
                if (cargaAnterior.site || cargaAnterior["SITE"] || cargaAnterior["Site"]) document.getElementById('reg-site').value = cargaAnterior.site || cargaAnterior["SITE"] || cargaAnterior["Site"];
                if (cargaAnterior.telefone || cargaAnterior["TELEFONE"] || cargaAnterior["Telefone"]) document.getElementById('reg-fone').value = cargaAnterior.telefone || cargaAnterior["TELEFONE"] || cargaAnterior["Telefone"];
                if (cargaAnterior.whatsapp || cargaAnterior["WHATS"] || cargaAnterior["WHATSAPP"] || cargaAnterior["WhatsApp"]) document.getElementById('reg-whats').value = cargaAnterior.whatsapp || cargaAnterior["WHATS"] || cargaAnterior["WHATSAPP"] || cargaAnterior["WhatsApp"];
            }
        }

        function mudarAba(aba) {
            ['cargas', 'historico', 'transp'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(`view-${aba}`).classList.remove('hidden');

            ['cargas', 'historico', 'transp'].forEach(v => {
                const deskBtn = document.getElementById(`nav-desk-${v}`);
                const mobBtn = document.getElementById(`nav-mob-${v}`);
                if (deskBtn) deskBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white";
                if (mobBtn) mobBtn.className = "py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 text-gray-400 hover:bg-slate-800/50";
            });

            if (aba === 'cargas') {
                document.getElementById('nav-desk-cargas').className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40";
                document.getElementById('nav-mob-cargas').className = "py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 bg-slate-800 text-atag-accent border border-atag-accent/40";
                carregarCargas();
            } else if (aba === 'historico') {
                document.getElementById('nav-desk-historico').className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
                document.getElementById('nav-mob-historico').className = "py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 bg-slate-800 text-emerald-400 border border-emerald-500/40";
                renderizarHistorico();
            } else {
                document.getElementById('nav-desk-transp').className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-atag-accent/20 text-atag-accent border border-atag-accent/40";
                document.getElementById('nav-mob-transp').className = "py-2 rounded-xl font-bold text-[10px] flex flex-col items-center gap-0.5 bg-slate-800 text-atag-accent border border-atag-accent/40";
                carregarTransportadoras();
            }
        }

        async function carregarCargas(mostrarLoading = true) {
            try {
                const res = await fetch(`${WEB_APP_URL}?tipo=followup`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    baseCargas = data;
                    atualizarEstatisticas();
                    renderizarCargas();
                    renderizarHistorico();
                    setOnlineStatus(true, "ONLINE");
                }
            } catch(e) {
                try {
                    const res2 = await fetch(`${WEB_APP_URL}?action=getFollowUp`);
                    const data2 = await res2.json();
                    if (Array.isArray(data2)) {
                        baseCargas = data2;
                        atualizarEstatisticas();
                        renderizarCargas();
                        renderizarHistorico();
                        setOnlineStatus(true, "ONLINE");
                        return;
                    }
                } catch(err) {}
                if(mostrarLoading) setOnlineStatus(false, "OFFLINE");
            }
        }

        async function carregarTransportadoras() {
            try {
                const res = await fetch(`${WEB_APP_URL}?tipo=transportadoras`);
                const data = await res.json();
                if (Array.isArray(data)) {
                    baseTransp = data;
                    preencherSelectTransportadoras();
                    renderizarTransportadoras();
                }
            } catch(e) {
                try {
                    const res2 = await fetch(`${WEB_APP_URL}?action=getTransportadoras`);
                    const data2 = await res2.json();
                    if (Array.isArray(data2)) {
                        baseTransp = data2;
                        preencherSelectTransportadoras();
                        renderizarTransportadoras();
                    }
                } catch(err) {}
            }
        }

        function preencherSelectTransportadoras() {
            const select = document.getElementById('reg-transp');
            if (!select) return;
            const atual = select.value;
            select.innerHTML = '<option value="">Selecione...</option>';
            baseTransp.forEach(t => {
                const nome = t.nome || t["TRANSPORTADORA"] || t["Transportadora"] || t["Nome"] || "";
                if (nome && String(nome).trim() !== "") {
                    const opt = document.createElement('option');
                    opt.value = nome.trim();
                    opt.text = nome.trim();
                    select.appendChild(opt);
                }
            });
            select.value = atual;

        function setOnlineStatus(online, text) {
            document.getElementById('status-text').innerText = text;
            document.getElementById('status-text-mob').innerText = text;
            const cls = online ? "flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-semibold" : "flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1.5 rounded-full font-semibold";
            document.getElementById('status-badge-desk').className = cls;
        }

        function atualizarEstatisticas() {
            let transito = 0, pendentes = 0, entregues = 0;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            baseCargas.forEach(i => {
                const statusEntregue = String(i.status || i["Entregue? (checkbox)"] || "").toUpperCase();
                if (statusEntregue === "TRUE" || statusEntregue === "SIM" || statusEntregue === "ENTREGUE") {
                    entregues++;
                    return;
                }
                let isAtrasado = false;
                const rawPrevisao = i.previsao || i["Previsão Entrega"] || i["Previsao Entrega"] || "";
                if (rawPrevisao) {
                    const parts = String(rawPrevisao).split("/");
                    if (parts.length === 3) {
                        const dataPrevObj = new Date(parts[2], parts[1] - 1, parts[0]);
                        if (dataPrevObj < hoje) isAtrasado = true;
                    }
                }
                const obs = String(i.obs || i["OBSERVAÇÕES"] || "").toUpperCase();
                const statusCampo = String(i.status || "").toUpperCase();
                if (isAtrasado || statusCampo.includes("PENDENTE") || statusCampo.includes("ATRASADA") || obs.includes("ATRASADA") || obs.includes("PENDENTE")) {
                    pendentes++;
                } else {
                    transito++;
                }
            });

            document.getElementById('stat-transito').innerText = transito;
            document.getElementById('stat-pendentes').innerText = pendentes;
            document.getElementById('stat-entregues').innerText = entregues;
        }

        function renderizarCargas() {
            const container = document.getElementById('lista-cargas');
            const search = norm(document.getElementById('search-cargas').value);
            const filtroStatus = document.getElementById('select-filtro-status').value;
            container.innerHTML = "";

            let itens = baseCargas.filter(i => {
                const statusEntregue = String(i.status || i["Entregue? (checkbox)"] || "").toUpperCase();
                if (statusEntregue === "TRUE" || statusEntregue === "SIM" || statusEntregue === "ENTREGUE") return false;

                const nf = String(i.nota || i["Número da NF"] || i.nf || "");
                const emitente = norm(i.origem || i["Emitente (Razão Social)"] || "");
                const transp = norm(i.transportadora || i["TRANSPORTADORA"] || i["Transp."] || i["Transportadora"] || "");

                if (!norm(nf).includes(search) && !emitente.includes(search) && !transp.includes(search)) return false;

                let statusAtual = "EM TRÂNSITO";
                const rawPrevisao = i.previsao || i["Previsão Entrega"] || i["Previsão"] || "";
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);

                if (rawPrevisao) {
                    const parts = String(rawPrevisao).split("/");
                    if (parts.length === 3) {
                        if (new Date(parts[2], parts[1] - 1, parts[0]) < hoje) statusAtual = "PENDENTE / ATRASADA";
                    }
                }
                const obs = String(i.obs || i["OBSERVAÇÕES"] || "").toUpperCase();
                const statusCampo = String(i.status || "").toUpperCase();
                if (statusCampo.includes("PENDENTE") || statusCampo.includes("ATRASADA") || obs.includes("ATRASADA") || obs.includes("PENDENTE")) {
                    statusAtual = "PENDENTE / ATRASADA";
                }

                if (filtroStatus !== "TODAS" && statusAtual !== filtroStatus) return false;
                return true;
            });

            document.getElementById('total-cargas-contador').innerText = `${itens.length} CARGAS`;

            if (itens.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-500 font-bold text-xs uppercase">Nenhuma carga encontrada.</div>`;
                return;
            }

            itens.forEach(i => montarCardCarga(i, container, false));
        }

        function renderizarHistorico() {
            const container = document.getElementById('lista-historico');
            const search = norm(document.getElementById('search-historico').value);
            container.innerHTML = "";

            let itens = baseCargas.filter(i => {
                const statusEntregue = String(i.status || i["Entregue? (checkbox)"] || "").toUpperCase();
                if (statusEntregue !== "TRUE" && statusEntregue !== "SIM" && statusEntregue !== "ENTREGUE") return false;

                const nf = String(i.nota || i["Número da NF"] || i.nf || "");
                const emitente = norm(i.origem || i["Emitente (Razão Social)"] || "");
                const transp = norm(i.transportadora || i["TRANSPORTADORA"] || i["Transp."] || i["Transportadora"] || "");
                return norm(nf).includes(search) || emitente.includes(search) || transp.includes(search);
            });

            document.getElementById('total-historico-contador').innerText = `${itens.length} ENTREGUES`;

            if (itens.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-500 font-bold text-xs uppercase">Nenhum histórico encontrado.</div>`;
                return;
            }

            itens.forEach(i => montarCardCarga(i, container, true));
        }

                        <span class="text-xs font-bold text-white uppercase truncate max-w-[180px] sm:max-w-sm">${emitente}</span>
                    </div>

                        </span>
                        <button onclick='prepararEdicao(${JSON.stringify(i)})' class="text-sky-400 hover:text-sky-300 text-xs p-1 admin-only" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="excluirCarga('${id}')" class="text-gray-500 hover:text-red-400 text-xs p-1 admin-only" title="Excluir"><i class="fa-solid fa-trash"></i></button>

                    <div>
                        <i class="fa-solid fa-building text-atag-accent mr-1"></i> 
                        <b class="text-gray-400">CNPJ Destinatário:</b> 
                        <span class="border px-1.5 py-0.2 rounded font-bold ${cnpjBadgeClass}">
                            ${cnpj} (${filialLabel})
                        </span>
                    </div>
                </div>

                <!-- DADOS DE TRANSPORTADORA E CONTATO EXCLUSIVOS DO ADMIN -->
                <div class="admin-only text-[10px] text-gray-300 bg-slate-950/50 p-2 rounded border border-slate-800 flex flex-wrap justify-between items-center gap-2">

                <div class="flex items-center justify-between pt-1 border-t border-slate-800 text-xs admin-only">
                    <div>

        function prepararEdicao(item) {
            if (!isAdmin) return;
            mudarAba('cargas');
            document.getElementById('reg-id-edicao').value = item.id || item["ID_Registro"] || "";
            document.getElementById('reg-nf').value = item.nota || item["Número da NF"] || item.nf || "";
            document.getElementById('reg-origem').value = item.origem || item["Emitente (Razão Social)"] || "";
            document.getElementById('reg-cnpj').value = item.cnpj || item["CNPJ Destinatário"] || "09.253.819/0001-35";
            document.getElementById('reg-transp').value = item.transportadora || item["TRANSPORTADORA"] || "";
            document.getElementById('reg-site').value = item.link || item.site || item["SITE"] || "";
            document.getElementById('reg-fone').value = item.telefone || item["TELEFONE"] || "";
            document.getElementById('reg-whats').value = item.whatsapp || item.whats || item["WHATS"] || "";
            
            const prevOriginal = item.previsao || item["Previsão Entrega"] || "";
            if (prevOriginal.includes("/")) {
                const parts = prevOriginal.split("/");
                if (parts.length === 3) {
                    document.getElementById('reg-previsao').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
            } else {
                document.getElementById('reg-previsao').value = prevOriginal;
            }

            document.getElementById('reg-obs').value = item.obs || item["OBSERVAÇÕES"] || "";
            calcularStatusAutomaticoFormulario();

            document.getElementById('form-titulo').innerHTML = `<i class="fa-solid fa-pen-to-square text-sky-400"></i> Editar Carga`;
            document.getElementById('form-badge').innerText = "EDIT";
            document.getElementById('btn-salvar-carga').innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i> Atualizar`;
            document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

            document.getElementById('reg-nf').value = "";
            document.getElementById('reg-origem').value = "";
            document.getElementById('reg-site').value = "";
            document.getElementById('reg-fone').value = "";
            document.getElementById('reg-whats').value = "";
            document.getElementById('reg-previsao').value = "";

        async function salvarNovaCarga() {
            if (!isAdmin) return;
            const idEdicao = document.getElementById('reg-id-edicao').value.trim();
            const nf = document.getElementById('reg-nf').value.trim();
            const origem = document.getElementById('reg-origem').value.trim();
            const cnpj = document.getElementById('reg-cnpj').value;
            const transp = document.getElementById('reg-transp').value;
            const site = document.getElementById('reg-site').value.trim();
            const fone = document.getElementById('reg-fone').value.trim();
            const whats = document.getElementById('reg-whats').value.trim();
            const previsao = document.getElementById('reg-previsao').value;
            
            calcularStatusAutomaticoFormulario();
            const status = document.getElementById('reg-status').value;
            const obs = document.getElementById('reg-obs').value.trim();

            if (!nf || !origem || !transp) {
                alert("Preencha a NF, a Origem e selecione a Transportadora.");
                return;
            }

            const payload = {
                action: idEdicao ? "updateFollowUp" : "insertFollowUp",
                modulo: "followup",
                id: idEdicao,
                ID_Registro: idEdicao,
                nf: nf,
                nota: nf,
                "Número da NF": nf,
                origem: origem,
                emitente: origem,
                "Emitente (Razão Social)": origem,
                cnpj: cnpj,
                "CNPJ Destinatário": cnpj,
                transportadora: transp,
                "TRANSPORTADORA": transp,
                site: site,
                "SITE": site,
                telefone: fone,
                "TELEFONE": fone,
                whatsapp: whats,
                "WHATS": whats,
                previsao: previsao,
                "Previsão Entrega": previsao,
                status: status,
                obs: obs,
                "OBSERVAÇÕES": obs
            };

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const resultado = await res.json();
                if (resultado.status === "error") { alert(resultado.message); return; }
                limparFormularioCarga();
                await carregarCargas(false);
            } catch(e) { alert("Erro ao gravar carga no servidor."); }
        }

        async function toggleEntrega(id, status) {
            if (!isAdmin) return;
            const item = baseCargas.find(i => String(i.id || i["ID_Registro"]) === String(id));
            if (item) {
                item.status = status ? "ENTREGUE" : "EM TRÂNSITO";
                item["Entregue? (checkbox)"] = status ? "TRUE" : "FALSE";
                atualizarEstatisticas();
                renderizarCargas();
                renderizarHistorico();
            }
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateFollowUp", modulo: "followup", id: id, ID_Registro: id, status: status ? "ENTREGUE" : "EM TRÂNSITO" })
                });
                carregarCargas(false);
            } catch(e) { carregarCargas(false); }
        }

        async function excluirCarga(id) {
            if (!isAdmin) return;
            if (!confirm("Deseja realmente excluir este registro?")) return;
            baseCargas = baseCargas.filter(i => String(i.id || i["ID_Registro"]) !== String(id));
            atualizarEstatisticas();
            renderizarCargas();
            renderizarHistorico();
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "deleteFollowUp", modulo: "followup", id: id, ID_Registro: id })
                });
                carregarCargas(false);
            } catch(e) { carregarCargas(false); }
        }

        async function apagarSelecionadas() {
            if (!isAdmin) return;
            const checks = document.querySelectorAll('.chk-carga:checked');
            if (checks.length === 0) { alert("Selecione pelo menos uma carga."); return; }
            if (!confirm(`Excluir as ${checks.length} cargas selecionadas?`)) return;
            const idsParaExcluir = Array.from(checks).map(chk => String(chk.value));
            baseCargas = baseCargas.filter(i => !idsParaExcluir.includes(String(i.id || i["ID_Registro"])));
            atualizarEstatisticas();
            renderizarCargas();
            renderizarHistorico();
            for (let id of idsParaExcluir) {
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "deleteFollowUp", modulo: "followup", id: id, ID_Registro: id })
                    });
                } catch(e) {}
            }
            carregarCargas(false);
        }

        async function salvarTransportadora() {
            if (!isAdmin) return;
            const nome = document.getElementById('transp-nome').value.trim();
            const site = document.getElementById('transp-site').value.trim();
            const fone = document.getElementById('transp-fone').value.trim();
            const whats = document.getElementById('transp-whats').value.trim();
            if (!nome) { alert("Informe o nome da transportadora."); return; }
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "insertTransportadora", modulo: "transportadoras", nome: nome, link: site, telefone: fone, whatsapp: whats })
                });
                document.getElementById('transp-nome').value = "";
                document.getElementById('transp-site').value = "";
                document.getElementById('transp-fone').value = "";
                document.getElementById('transp-whats').value = "";
                await carregarTransportadoras();
                alert("Transportadora cadastrada com sucesso!");
            } catch(e) { alert("Erro ao cadastrar."); }
        }

        function renderizarTransportadoras() {
            const container = document.getElementById('lista-transp');
            if (!container) return;
            container.innerHTML = "";
            baseTransp.forEach(t => {
                const nome = t.nome || t["TRANSPORTADORA"] || t["Transportadora"] || "";
                const site = t.link || t["SITE"] || t["Site"] || "";
                const fone = t.telefone || t["TELEFONE"] || t["Telefone"] || "";
                const whats = t.whatsapp || t["WHATSAPP"] || t["WHATS"] || t["WhatsApp"] || fone;

                const card = document.createElement('div');
                card.className = "glass-card border border-atag-border rounded-xl p-2.5 flex flex-col gap-1.5 shadow";
                card.innerHTML = `
                    <h4 class="font-bold text-xs text-white uppercase">${nome}</h4>
                    <div class="flex flex-col gap-0.5 text-[10px] text-gray-400">
                        ${fone ? `<p><i class="fa-solid fa-phone text-atag-accent mr-1"></i>${fone}</p>` : ''}
                        ${whats ? `<p><i class="fa-brands fa-whatsapp text-emerald-400 mr-1"></i>${whats}</p>` : ''}
                    </div>
                    ${site ? `<a href="${site}" target="_blank" class="mt-1 bg-slate-900 hover:bg-slate-800 text-atag-accent border border-slate-700 py-1 rounded text-[10px] font-bold text-center block"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Portal de Rastreio</a>` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function exportarRelatorioCargas() {
            if (!isAdmin) return;
            if (baseCargas.length === 0) { alert("Sem dados para exportar."); return; }
            let csv = "data:text/csv;charset=utf-8,\uFEFF";
            csv += "ID;NF;Emitente;CNPJ;Transportadora;Site;Telefone;WhatsApp;Observação;Status\n";
            baseCargas.forEach(i => {
                const statusEntregue = String(i.status || i["Entregue? (checkbox)"] || "").toUpperCase();
                if (statusEntregue !== "TRUE" && statusEntregue !== "SIM" && statusEntregue !== "ENTREGUE") {
                    csv += `"${i.id || ""}","${i.nota || ""}","${i.origem || ""}","${i.cnpj || ""}","${i.transportadora || ""}","${i.link || i.site || ""}","${i.telefone || ""}","${i.whatsapp || ""}","${(i.obs || "").replace(/;/g, ',')}","EM TRÂNSITO"\n`;
                }
            });
            baixarCSV(csv, "Cargas_Em_Transito.csv");
        }

        async function exportarRelatorioHistorico() {
            if (!isAdmin) return;
            let csv = "data:text/csv;charset=utf-8,\uFEFF";
            csv += "ID;NF;Emitente;CNPJ;Transportadora;Data Conclusão;Observação\n";
            baseCargas.forEach(i => {
                const statusEntregue = String(i.status || i["Entregue? (checkbox)"] || "").toUpperCase();
                if (statusEntregue === "TRUE" || statusEntregue === "SIM" || statusEntregue === "ENTREGUE") {
                    csv += `"${i.id || ""}","${i.nota || ""}","${i.origem || ""}","${i.cnpj || ""}","${i.transportadora || ""}","${i.dataConclusao || ""}","${(i.obs || "").replace(/;/g, ',')}"\n`;
                }
            });
            baixarCSV(csv, "Historico_Entregas.csv");
        }

        function baixarCSV(csvContent, filename) {
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
